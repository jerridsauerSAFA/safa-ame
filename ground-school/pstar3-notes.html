<style>
:root{
  --bg:#000; --panel:#121110; --cue:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
header img{width:84px;flex:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);line-height:1.15;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px}
.title .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--gold);line-height:1}
.title .name{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;text-transform:uppercase}
.title .kind{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.goldleft{border-left:4px solid var(--gold)}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.b li{position:relative;padding-left:18px}
ul.b li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:13px;top:1px}
b{font-weight:700}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.hint{font-size:13px;color:var(--muted)}
.cornell{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.colhead{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:2px solid var(--gold)}
.colhead div{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--gold)}
.sec{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px}
.row{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cue{background:var(--cue);color:var(--gold);font-weight:700;padding:12px 14px;border-right:2px solid var(--gold);min-width:0}
.note{padding:12px 16px;min-width:0;position:relative}
.note ul.b li{line-height:1.45}
.studying .note .content{filter:blur(7px);opacity:.55;user-select:none;transition:filter .25s,opacity .25s}
.studying .note.shown .content{filter:none;opacity:1;user-select:auto}
.reveal{display:none}
.studying .note:not(.shown) .reveal{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;width:100%}
.reveal span{background:#000;border:1px solid var(--gold);border-radius:99px;padding:6px 14px}
.summary{border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
textarea{width:100%;min-height:96px;resize:vertical;background:#1b1915;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.saved{font-size:13px;color:#7fc48a}
.qa{display:flex;flex-direction:column;gap:8px}
.q{background:#17150f;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.q .n{font-family:var(--display);font-weight:700;color:var(--gold)}
.q .a{grid-column:2;color:var(--gold)}
.q button{grid-column:2;justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:12px;font-weight:600;cursor:pointer}
.q button:hover{border-color:var(--gold);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand img{width:60px}
.tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){
  .row,.colhead{grid-template-columns:1fr}
  .cue{border-right:0;border-bottom:1px solid var(--gold);padding:10px 14px}
  .colhead div:last-child{display:none}
  .grid2{grid-template-columns:1fr}
  .title .kind{margin-left:0;width:100%}
}
@media print{body{background:#fff;color:#000}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}
header img{width:62px!important}

.fig{margin:10px 0 2px;background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;overflow-y:hidden}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.model{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cmp{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.cmp:disabled{background:var(--line);color:var(--muted);cursor:default}
.panel a{color:var(--gold)}
</style>

<script>
const FIGS = {"pic": {"svg": "<svg viewBox=\"0 0 600 252\" role=\"img\" aria-label=\"Before every flight: the pilot-in-command\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Before every flight: the pilot-in-command<\/text><rect x=\"0\" y=\"26\" width=\"600\" height=\"52\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"46\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">INFORMATION<\/text><text x=\"14\" y=\"62\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 602.71<\/text><text x=\"190\" y=\"48.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">All the available information for this flight:<\/text><text x=\"190\" y=\"65.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">weather, NOTAM, runways, fuel, alternates<\/text><rect x=\"0\" y=\"84\" width=\"600\" height=\"52\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"104\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">YOU CARRY<\/text><text x=\"14\" y=\"120\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 401.03<\/text><text x=\"190\" y=\"106.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">A valid permit or licence + medical certificate,<\/text><text x=\"190\" y=\"123.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">and you can produce them<\/text><rect x=\"0\" y=\"142\" width=\"600\" height=\"52\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"162\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">AIRCRAFT CARRIES<\/text><text x=\"14\" y=\"178\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 202.26 · 605.03<\/text><text x=\"190\" y=\"164.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">Certificate of registration + flight authority<\/text><text x=\"190\" y=\"181.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">(usually a certificate of airworthiness)<\/text><rect x=\"0\" y=\"200\" width=\"600\" height=\"52\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"220\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">FUEL<\/text><text x=\"14\" y=\"236\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 602.88<\/text><text x=\"190\" y=\"222.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">Day VFR: destination + 30 min<\/text><text x=\"190\" y=\"239.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">Night VFR: destination + 45 min<\/text><\/svg>", "cap": "Fuel reserves are flight time at normal cruising speed, for aeroplanes."}, "spp": {"svg": "<svg viewBox=\"0 0 560 206\" role=\"img\" aria-label=\"Student pilot permit: acting as pilot-in-command\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Student pilot permit: acting as pilot-in-command<\/text><rect x=\"0\" y=\"26\" width=\"560\" height=\"32\" rx=\"8\" fill=\"#1b1915\" stroke=\"#7fd18b\" stroke-opacity=\".55\"/><text x=\"18\" y=\"47\" text-anchor=\"middle\" fill=\"#7fd18b\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\">✓<\/text><text x=\"38\" y=\"47\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\">For your own flight training<\/text><rect x=\"0\" y=\"62\" width=\"560\" height=\"32\" rx=\"8\" fill=\"#1b1915\" stroke=\"#7fd18b\" stroke-opacity=\".55\"/><text x=\"18\" y=\"83\" text-anchor=\"middle\" fill=\"#7fd18b\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\">✓<\/text><text x=\"38\" y=\"83\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\">In Canada<\/text><rect x=\"0\" y=\"98\" width=\"560\" height=\"32\" rx=\"8\" fill=\"#1b1915\" stroke=\"#7fd18b\" stroke-opacity=\".55\"/><text x=\"18\" y=\"119\" text-anchor=\"middle\" fill=\"#7fd18b\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\">✓<\/text><text x=\"38\" y=\"119\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\">Day VFR<\/text><rect x=\"0\" y=\"134\" width=\"560\" height=\"32\" rx=\"8\" fill=\"#1b1915\" stroke=\"#7fd18b\" stroke-opacity=\".55\"/><text x=\"18\" y=\"155\" text-anchor=\"middle\" fill=\"#7fd18b\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\">✓<\/text><text x=\"38\" y=\"155\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\">Directed and supervised by a qualified instructor<\/text><rect x=\"0\" y=\"170\" width=\"560\" height=\"32\" rx=\"8\" fill=\"#1b1915\" stroke=\"#f08c7a\" stroke-opacity=\".55\"/><text x=\"18\" y=\"191\" text-anchor=\"middle\" fill=\"#f08c7a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\">✗<\/text><text x=\"38\" y=\"191\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\">Carrying passengers<\/text><\/svg>", "cap": "CAR 401.19(1). Students in an integrated course may also fly night VFR (401.19(2))."}, "ceiling": {"svg": "<svg viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Circuit height under a 1,000 foot overcast in a control zone\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"600\" height=\"250\" rx=\"12\" fill=\"#0f1724\"/><rect x=\"0\" y=\"20\" width=\"600\" height=\"54\" fill=\"#3b4250\"/><circle cx=\"0\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"40\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"80\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"120\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"160\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"200\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"240\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"280\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"320\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"360\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"400\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"440\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"480\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"520\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"560\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><circle cx=\"600\" cy=\"74\" r=\"16\" fill=\"#3b4250\"/><text x=\"16\" y=\"44\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\">Overcast cloud base: 1,000 ft AGL<\/text><rect x=\"0\" y=\"214\" width=\"600\" height=\"36\" fill=\"#2a2a1f\"/><rect x=\"40\" y=\"210\" width=\"200\" height=\"6\" rx=\"1\" fill=\"#6b665b\"/><text x=\"140\" y=\"238\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">Runway<\/text><path d=\"M30 144 H340\" stroke=\"#d8b358\" stroke-width=\"2\" stroke-dasharray=\"7 6\"/><g transform=\"translate(250 144)\"><path d=\"M-22 0 L18 0 L24 -3 L18 -6 L-14 -6 Z\" fill=\"#d8b358\"/><path d=\"M-4 -3 L-12 -16 L-6 -16 L8 -3 Z\" fill=\"#d8b358\"/><path d=\"M-20 -3 L-24 -12 L-19 -12 L-14 -3 Z\" fill=\"#d8b358\"/><\/g><text x=\"30\" y=\"134\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Circuit at 500 ft AGL<\/text><path d=\"M362 93 V141\" stroke=\"#ffffff\" stroke-width=\"1.5\"/><polygon points=\"357,99 362,91 367,99\" fill=\"#ffffff\"/><polygon points=\"357,135 362,143 367,135\" fill=\"#ffffff\"/><text x=\"374\" y=\"122.0\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\">at least 500 ft below cloud<\/text><path d=\"M362 147 V211\" stroke=\"#ffffff\" stroke-width=\"1.5\"/><polygon points=\"357,153 362,145 367,153\" fill=\"#ffffff\"/><polygon points=\"357,205 362,213 367,205\" fill=\"#ffffff\"/><text x=\"374\" y=\"184.0\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\">at least 500 ft above ground<\/text><text x=\"586\" y=\"242\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">Flight visibility: at least 3 miles<\/text><\/svg>", "cap": "CAR 602.114: VFR in a control zone needs 3 miles visibility, 500 ft below and 1 mile from cloud, and at least 500 ft above the ground except to take off or land."}, "medical": {"svg": "<svg viewBox=\"0 0 600 188\" role=\"img\" aria-label=\"Your medical certificate\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Your medical certificate<\/text><rect x=\"0\" y=\"26\" width=\"600\" height=\"52\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"46\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">CATEGORY<\/text><text x=\"14\" y=\"62\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 404.10<\/text><text x=\"190\" y=\"48.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">Student pilot permit (aeroplane):<\/text><text x=\"190\" y=\"65.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">Category 1, 3 or 4<\/text><rect x=\"0\" y=\"84\" width=\"600\" height=\"46\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"104\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">VALID FOR<\/text><text x=\"14\" y=\"120\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 404.04(6)<\/text><text x=\"190\" y=\"112.0\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">60 months, at any age<\/text><rect x=\"0\" y=\"136\" width=\"600\" height=\"52\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"156\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">COUNTED FROM<\/text><text x=\"14\" y=\"172\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 404.04(7)<\/text><text x=\"190\" y=\"158.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">The first day of the month after your<\/text><text x=\"190\" y=\"175.5\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"400\">medical exam or declaration<\/text><\/svg>", "cap": "A private pilot licence has different periods (60 months under 40, 24 months at 40 or older)."}, "hypo": {"svg": "<svg viewBox=\"0 0 600 226\" role=\"img\" aria-label=\"Hypoxia versus Hyperventilation\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"150\" y=\"0\" width=\"220\" height=\"30\" rx=\"8\" fill=\"#4a1f18\"/><text x=\"260\" y=\"20\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Hypoxia<\/text><rect x=\"380\" y=\"0\" width=\"220\" height=\"30\" rx=\"8\" fill=\"#5b4c1c\"/><text x=\"490\" y=\"20\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Hyperventilation<\/text><rect x=\"0\" y=\"36\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"58\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">What it is<\/text><text x=\"260\" y=\"58\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Too little oxygen<\/text><text x=\"490\" y=\"58\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Breathing too fast<\/text><rect x=\"0\" y=\"74\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"96\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Cause<\/text><text x=\"260\" y=\"96\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Altitude (also CO, alcohol)<\/text><text x=\"490\" y=\"96\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Anxiety, fear, concentration<\/text><rect x=\"0\" y=\"112\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"134\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Feels like<\/text><text x=\"260\" y=\"134\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Euphoria, slow thinking<\/text><text x=\"490\" y=\"134\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Dizzy, tingling, short of air<\/text><rect x=\"0\" y=\"150\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"172\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Rule of thumb<\/text><text x=\"260\" y=\"172\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Above 10,000 ft ASL: use O₂<\/text><text x=\"490\" y=\"172\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Below 8,000 ft: likely this<\/text><rect x=\"0\" y=\"188\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"210\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Fix<\/text><text x=\"260\" y=\"210\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">O₂, or descend (if safe)<\/text><text x=\"490\" y=\"210\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">O₂ if any, then breathe slowly<\/text><\/svg>", "cap": "TC AIM AIR 3.2.1 and 3.2.3. The signs overlap, so don't try to diagnose: use 100% oxygen first if you have it (hypoxia improves within 3–4 breaths), then slow your breathing."}, "waits": {"svg": "<svg viewBox=\"0 0 600 330\" role=\"img\" aria-label=\"Wait times before flying\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">How long before you fly?<\/text><rect x=\"0\" y=\"26\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"48\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Alcohol: the law<\/text><text x=\"408\" y=\"48\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">CAR 602.03<\/text><rect x=\"420\" y=\"31\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"48\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">12 hours<\/text><rect x=\"0\" y=\"64\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"86\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Alcohol: TC advice<\/text><text x=\"408\" y=\"86\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.9<\/text><rect x=\"420\" y=\"69\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"86\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">24 hours<\/text><rect x=\"0\" y=\"102\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"124\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Dive under 33 ft, no stops; fly below 8,000 ft<\/text><text x=\"408\" y=\"124\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.4<\/text><rect x=\"420\" y=\"107\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"124\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">12 hours<\/text><rect x=\"0\" y=\"140\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"162\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Dive with stops, or flying above 8,000 ft<\/text><text x=\"408\" y=\"162\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.4<\/text><rect x=\"420\" y=\"145\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"162\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">24 hours<\/text><rect x=\"0\" y=\"178\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"200\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Gave blood<\/text><text x=\"408\" y=\"200\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.12<\/text><rect x=\"420\" y=\"183\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"200\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">48 hours<\/text><rect x=\"0\" y=\"216\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"238\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Big dental job, local anaesthetic<\/text><text x=\"408\" y=\"238\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.11<\/text><rect x=\"420\" y=\"221\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"238\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">24 hours<\/text><rect x=\"0\" y=\"254\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"276\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">General or spinal anaesthetic<\/text><text x=\"408\" y=\"276\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.11<\/text><rect x=\"420\" y=\"259\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"276\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Doctor says OK<\/text><rect x=\"0\" y=\"292\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"314\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\">Any cannabis product, incl. CBD<\/text><text x=\"408\" y=\"314\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\">AIR 3.10<\/text><rect x=\"420\" y=\"297\" width=\"172\" height=\"24\" rx=\"12\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"506\" y=\"314\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">28 days<\/text><\/svg>", "cap": "Count each wait to the start of your flight duties, not just to take-off. When in doubt, ask a Civil Aviation Medical Examiner (CAME)."}, "report": {"svg": "<svg viewBox=\"0 0 600 284\" role=\"img\" aria-label=\"Occurrence reporting decision tree\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"330\" height=\"34\" rx=\"10\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"165.0\" y=\"21.5\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Something happened to an aircraft<\/text><path d=\"M165 34 L165 52\" stroke=\"#a8a39a\" stroke-width=\"1.6\"/><polygon points=\"160,44 165,52 170,44\" fill=\"#a8a39a\"/><rect x=\"0\" y=\"52\" width=\"330\" height=\"70\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"165.0\" y=\"75.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">ACCIDENT? Death or serious injury ·<\/text><text x=\"165.0\" y=\"91.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">major structural damage ·<\/text><text x=\"165.0\" y=\"107.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">aircraft missing or can&#x27;t be reached<\/text><path d=\"M330 87 L372 87\" stroke=\"#a8a39a\" stroke-width=\"1.6\"/><polygon points=\"364,82 372,87 364,92\" fill=\"#a8a39a\"/><text x=\"338\" y=\"80\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\">YES<\/text><path d=\"M165 122 L165 142\" stroke=\"#a8a39a\" stroke-width=\"1.6\"/><polygon points=\"160,134 165,142 170,134\" fill=\"#a8a39a\"/><text x=\"173\" y=\"137\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\">NO<\/text><rect x=\"0\" y=\"142\" width=\"330\" height=\"70\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"165.0\" y=\"165.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">MANDATORY INCIDENT? Aircraft over<\/text><text x=\"165.0\" y=\"181.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">2,250 kg or air operator, and the<\/text><text x=\"165.0\" y=\"197.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">event is on the TSB list<\/text><path d=\"M330 177 L372 177\" stroke=\"#a8a39a\" stroke-width=\"1.6\"/><polygon points=\"364,172 372,177 364,182\" fill=\"#a8a39a\"/><text x=\"338\" y=\"170\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\">YES<\/text><path d=\"M165 212 L165 232\" stroke=\"#a8a39a\" stroke-width=\"1.6\"/><polygon points=\"160,224 165,232 170,224\" fill=\"#a8a39a\"/><text x=\"173\" y=\"227\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\">NO<\/text><rect x=\"0\" y=\"232\" width=\"330\" height=\"52\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"165.0\" y=\"254.5\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"600\">No mandatory TSB report.<\/text><text x=\"165.0\" y=\"270.5\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"600\">You may still report it in writing.<\/text><rect x=\"372\" y=\"52\" width=\"228\" height=\"170\" rx=\"10\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"486.0\" y=\"93.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">REPORT IT<\/text><text x=\"486.0\" y=\"109.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\"><\/text><text x=\"486.0\" y=\"125.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">Who: owner, operator,<\/text><text x=\"486.0\" y=\"141.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">PIC, crew, ATS<\/text><text x=\"486.0\" y=\"157.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">To: regional TSB office<\/text><text x=\"486.0\" y=\"173.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">How fast: ASAP, quickest<\/text><text x=\"486.0\" y=\"189.5\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"600\">means; the rest in 30 days<\/text><\/svg>", "cap": "TC AIM GEN 3.3. Other safety problems may be reported to the TSB in writing, or confidentially through SECURITAS."}};
const GUIDE = {"name": "TP 11919 Student Pilot Permit study guide (Transport Canada) · §6, §8, §14", "url": "https://tc.canada.ca/en/aviation/publications/student-pilot-permit-private-pilot-licence-foreign-military-applicants-aviation-regulations-tp-11919"};
const LESSONS = [{"code": "P3.1", "title": "Pilot Responsibilities", "objectives": ["Do the **pre-flight** jobs the CARs give the pilot-in-command: information, papers and fuel", "State what a **student pilot permit** lets you do as pilot-in-command", "Follow **ATC clearances and instructions**, and know when to say **unable**", "Fly the **circuit**, radar vectors and **Special VFR** while staying responsible for your own aircraft"], "sections": [["Before every flight", [["Get the information", ["Before a flight, the pilot-in-command must be **familiar with all the available information** for that flight (CAR 602.71).", "That means weather, NOTAM, fuel, runway lengths, and a plan if you can't land where you meant to."], "pic"], ["Carry the papers", ["**You**: a valid permit or licence and the right **medical certificate**, and you must be able to **produce** them (CAR 401.03).", "**The aircraft**: its **certificate of registration** and its **flight authority** (usually the certificate of airworthiness) on board (CAR 202.26, 605.03)."]], ["Carry enough fuel", ["VFR by **day**: enough to reach the destination **plus 30 minutes** at normal cruise.", "VFR by **night**: destination **plus 45 minutes** (CAR 602.88).", "The rule also applies if you **change destination** in flight."]], ["Your student pilot permit", ["You may act as pilot-in-command only for **your own flight training**, **in Canada**, by **day VFR**, under the **direction and supervision** of a qualified instructor, with **no passengers** (CAR 401.19)."], "spp"], ["Busy airports", ["Check the **Canada Flight Supplement (CFS)** for special procedures.", "The **VFR Terminal Area (VTA) chart** shows terminal airspace around big airports and the frequencies to use."]]]], ["Clearances and instructions", [["A clearance you accept", ["Once you **accept** a clearance, you must **comply** with it (CAR 602.31).", "Can't comply? Tell ATC **right away**. ATC takes your acknowledgement as a \"yes\" (TC AIM RAC 1.6)."]], ["Instructions", ["Comply with and acknowledge ATC **instructions**, as long as the **safety of the aircraft** isn't put at risk (RAC 1.6).", "Asked to fly slower than is safe for your aircraft? Tell ATC you are **unable** (RAC, Speed Adjustment).", "A take-off clearance with **\"immediate\"**: taxi on and take off in **one continuous movement**, or refuse it if you can't (RAC 4.2.8)."]], ["You still decide", ["ATC picks the runway, but **you** decide if it is **operationally acceptable**. Crosswind too strong for you? Ask for another runway (RAC 4.1.3).", "Even with a clearance, you must **see and avoid** other aircraft (RAC 4.3). If a heading ATC gave you points at traffic, avoid it and tell ATC."]]]], ["Take-off and the circuit", [["Intersection take-off", ["You may take off from part of the runway, but **you** must make sure the **length left is enough** (RAC 4.2.8).", "You can always ask for the **full length**."]], ["Wake turbulence", ["ATC adds time or distance behind large aircraft, but **cannot guarantee** you won't meet wake turbulence (RAC 4.1.1).", "If you **waive** that spacing on a VFR departure, **you** take responsibility for avoiding it."]], ["\"Cleared to the circuit\"", ["Join the **downwind leg** at **circuit height**. You may need to cross over and join **crosswind** first (RAC 4.4.2).", "For a left-hand circuit you may make a **right turn** to join crosswind, or a partial right turn to join the circuit, **if it is safe**.", "Aeroplanes normally fly the circuit at **1,000 ft above aerodrome elevation** (RAC 4.3)."]], ["Low cloud in a control zone", ["VFR in controlled airspace: **3 miles** visibility, **500 ft below** and **1 mile** sideways from cloud (CAR 602.114).", "In a **control zone**, also at least **500 ft above the ground**, except to take off or land.", "Overcast at **1,000 ft AGL**? The only legal height is **500 ft AGL**, so that is where you fly the circuit."], "ceiling"], ["Landing clearance", ["At a controlled airport you must get **landing clearance**. The tower usually gives it on **final**. If it hasn't, **ask in good time**.", "Still none? Except in an emergency, **pull up and go around** (RAC 4.4.3)."]], ["No radio (NORDO)", ["Arrange your arrival with the tower **before** you go, and watch for **light signals**.", "Need to cross the airport before joining? Cross **at least 500 ft above circuit height**, then descend to circuit height in the **upwind area** of the runway (RAC 4.4.5)."]]]], ["Radar help, Special VFR and the transponder", [["Radar vectors for VFR", ["ATC can give VFR flights **vectors**. **You** stay responsible for avoiding **traffic**, **weather below VFR minima**, and **terrain and obstacles** (RAC 1.5.4, 1.5.5).", "A vector would take you into cloud? **Tell the controller** and get one that keeps you VFR."]], ["Special VFR (SVFR)", ["Weather below VFR minima in a control zone? You may **request** SVFR. ATC never offers it first (RAC 2.7.3).", "Aeroplanes need **1 mile** flight visibility and must stay **clear of cloud** and **in sight of the ground** (CAR 602.117).", "You remain responsible for avoiding **other aircraft** and weather beyond your skill. At night, aeroplanes get SVFR only to **land** at the destination."]], ["Transponder", ["VFR: squawk **1200** at or below **12,500 ft ASL** and **1400** above it, unless ATC gives you a code (TC AIM COM 8.4).", "Press **IDENT** only when ATC asks (COM 8.5)."]]]]], "summary": "Before every flight the pilot-in-command must know all the available information, carry a valid permit and medical certificate, have the registration and flight authority on board, and carry fuel for the trip plus 30 minutes by day or 45 by night. A student pilot permit allows solo flying for your own training, in Canada, by day VFR, supervised by an instructor, with no passengers. Comply with clearances you accept and instructions you receive, but say \"unable\" if one isn't safe; you still decide if a runway is acceptable and you must see and avoid. You are responsible for intersection take-off length and wake turbulence. \"Cleared to the circuit\" means join downwind at circuit height; with a 1,000 ft ceiling in a control zone, fly the circuit at 500 ft AGL. No landing clearance means go around. On vectors or Special VFR you stay responsible for traffic, weather and terrain. VFR squawk 1200, or 1400 above 12,500 ft ASL.", "selfcheck": [["What does CAR 602.71 require before every flight?", "The pilot-in-command must be familiar with all the available information appropriate to the flight."], ["Day and night VFR fuel reserves for an aeroplane?", "Destination plus 30 minutes by day, plus 45 minutes by night, at normal cruise."], ["When may a student pilot permit holder act as pilot-in-command?", "Own flight training, in Canada, day VFR, supervised by a qualified instructor, no passengers."], ["You accepted a clearance but now can't follow it. What do you do?", "Tell ATC right away."], ["Who decides whether an assigned runway is acceptable?", "The pilot."], ["What does \"cleared to the circuit\" mean?", "Join the downwind leg at circuit height (crosswind first if needed)."], ["Control zone, 1,000 ft overcast. Circuit height?", "500 ft AGL: 500 ft below cloud and 500 ft above the ground."], ["VFR transponder codes?", "1200 at or below 12,500 ft ASL, 1400 above. IDENT only when ATC asks."]], "practice": [["TP 11919 §6", "Pilot Responsibilities (23 questions in the bank)"], ["TC AIM", "RAC 1.5.4–1.6 · RAC 2.7.3 · RAC 4.1.1–4.4.5 · COM 8.4–8.5"], ["CARs", "401.03 · 401.19 · 602.31 · 602.71 · 602.88 · 602.114 · 602.117"]], "reading": ["TP 11919 §6 Pilot Responsibilities", "TC AIM RAC 1.6 and RAC 4.2–4.4"]}, {"code": "P3.2", "title": "Aeromedical", "objectives": ["Decide when a pilot is **not fit to fly**, and what the CARs say about it", "Know the **medical certificate** a student pilot permit needs and how long it lasts", "Apply the **alcohol, drug and cannabis** rules for crew members", "Recognize **hypoxia, hyperventilation, carbon monoxide, ear block and fatigue**, and know the **wait times** after diving, giving blood and anaesthetics"], "sections": [["Are you fit to fly?", [["No inspection for pilots", ["No pre-flight check tells you if **you** are fit. You decide before every flight, using good judgement (TC AIM AIR 3.1).", "In doubt? Ask your doctor or a **Civil Aviation Medical Examiner (CAME)**."]], ["The rule", ["Don't use your permit if an **illness, injury or disability**, a **drug**, or **medical treatment** could stop you flying safely (CAR 404.06).", "Common illnesses like a cold, the flu or a stomach bug ground you for a while (AIR 3.1)."]], ["Tell your doctor", ["When you see a doctor or optometrist, **say you hold a pilot permit**. They must report any finding that could be a **hazard to aviation safety** (Aeronautics Act s. 6.5; AIR 3.1.1)."]], ["Your medical certificate", ["A student pilot permit (aeroplane) needs a **Category 1, 3 or 4** medical certificate (CAR 404.10).", "For a student pilot permit it is valid for **60 months, at any age** (CAR 404.04).", "The 60 months count from the **first day of the month after** your exam or declaration.", "A **private pilot licence** medical is different: **60 months under 40**, **24 months at 40 or older** (CAR 404.04). Know both."], "medical"]]], ["Alcohol, drugs and cannabis", [["The law: 12 hours", ["No one may act as a crew member **within 12 hours** of drinking alcohol, while **under the influence** of alcohol, or while using a **drug that impairs** them (CAR 602.03)."]], ["The advice: 24 hours", ["TC advises **at least 24 hours** between the last drink and take-off (AIR 3.9).", "Alcohol stays in the fluid of the **inner ear** after it leaves the blood, which upsets balance.", "The body clears alcohol at a **fixed rate**. Coffee, medicine or oxygen don't speed it up."]], ["Medicines", ["Cold pills, sedating **antihistamines**, cough syrup, sleeping pills and herbal remedies can cause drowsiness and poor judgement.", "Don't fly on **any** medicine unless a **CAME** has cleared it (AIR 3.10)."]], ["Cannabis", ["TC policy: pilots must not use **any cannabis product**, including **CBD**, by any method, for **at least 28 days** before flying (AIR 3.10)."]]]], ["Your body in flight", [["Hypoxia: not enough oxygen", ["It comes on slowly and can feel **pleasant** (euphoria). Even mild hypoxia dulls **night vision** (one of the first signs) and slows reaction time. Worse hypoxia hurts reasoning (AIR 3.2.1, 3.5).", "Don't fly above **10,000 ft ASL** without extra oxygen or pressurization. At night, use oxygen **from the ground up** if you have it.", "Carbon monoxide, high blood alcohol and **smoking** all make it worse."], "hypo"], ["Hyperventilation: breathing too fast", ["Caused by **anxiety, fear** or hard concentration. You blow off too much carbon dioxide (AIR 3.2.3).", "Signs: dizziness, feeling cold, **tingling** hands and feet, and feeling you can't get enough air.", "Fix: breathe **100% oxygen** if you have it. Still there? **Slow your breathing** to 10–12 breaths a minute. Below **8,000 ft**, hypoxia is unlikely to be the cause."]], ["Carbon monoxide (CO)", ["Colourless, odourless and tasteless, often from a leaking **heater or exhaust** (AIR 3.2.2).", "Headache, dizziness or trouble concentrating? Heater **off**, vents **open**, descend if safe, use oxygen, and **land as soon as possible** if you suspect an exhaust leak."]], ["Ears and sinuses", ["Air escapes easily on the **climb**. On **descent**, a cold can block the tube to your middle ear and cause pain (AIR 3.6).", "Swallow, yawn, chew, or blow gently with your nose pinched. Still blocked? **Climb back up**, clear your ears, then **descend slowly**.", "Best fix: **don't fly with a cold** or sore throat."]], ["Fatigue", ["Slows reaction time, hurts concentration and causes errors. **Don't fly tired**; get good sleep (AIR 3.8)."]]]], ["How long to wait", [["Scuba diving", ["Dive under 33 ft with **no decompression stops**: wait **12 hours** before flying up to 8,000 ft ASL.", "Dive **with** decompression stops, or a flight **above 8,000 ft**: wait **24 hours** (AIR 3.4)."], "waits"], ["Giving blood", ["Active pilots generally shouldn't donate. If you do, wait **at least 48 hours** (AIR 3.12)."]], ["Anaesthetics", ["**General or spinal**: don't fly until **your doctor says it is safe**.", "Local, after a big job like several wisdom teeth out: wait **at least 24 hours** (AIR 3.11)."]], ["Shots", ["After a routine shot, wait at the clinic as advised (usually 15–30 minutes). Feel fine? You may fly. Feel unwell? Wait **24 hours** and get checked (AIR 3.13)."]]]]], "summary": "You decide before every flight whether you are fit; CAR 404.06 says not to use your permit if an illness, injury, drug or treatment could make you unsafe. Tell any doctor you are a pilot. A student pilot permit needs a Category 1, 3 or 4 medical, valid 60 months at any age. The law bans crew duty within 12 hours of a drink or while impaired; TC advises 24 hours, and nothing speeds up sobering. No medicine unless a CAME clears it, and no cannabis for 28 days. Hypoxia feels pleasant and hits night vision first: use oxygen above 10,000 ft. Hyperventilation comes from stress: slow your breathing. Suspect CO with the heater on. Ear pain comes on descent: don't fly with a cold. Wait 12 hours after a shallow (under 33 ft) no-stop dive (24 with stops or above 8,000 ft), 48 hours after giving blood, and 24 hours after a big dental job.", "selfcheck": [["Under the CARs, how soon after drinking may you fly?", "Not within 12 hours (and never while under the influence). TC advises 24 hours."], ["Medical category and validity for a student pilot permit?", "Category 1, 3 or 4; valid 60 months at any age."], ["TC's cannabis policy for pilots?", "No cannabis product, including CBD, for at least 28 days before flying."], ["Name two early signs of hypoxia.", "Euphoria (feeling good) and poorer night vision; slow thinking."], ["What do you do about hyperventilation?", "Oxygen if available, then slow your breathing to 10–12 breaths a minute."], ["Your ears won't clear on descent. What now?", "Climb back up, clear them, then descend slowly."], ["Wait times: shallow (under 33 ft) no-stop dive, dive with stops, blood donation?", "12 hours, 24 hours, 48 hours."], ["Why tell your doctor you hold a pilot permit?", "They must report findings that could be a hazard to aviation safety."]], "practice": [["TP 11919 §8", "Aeromedical (13 questions in the bank)"], ["TC AIM", "AIR 3.1–3.13"], ["CARs", "404.04 · 404.06 · 404.10 · 602.03"]], "reading": ["TP 11919 §8 Aeromedical", "TC AIM AIR 3.0 Medical Information"]}, {"code": "P3.3", "title": "Aviation Occurrences", "objectives": ["State the **purpose** of a TSB safety investigation", "Decide whether an event is a **reportable accident**", "Know **who** reports, **to whom**, and **how fast**", "List the main **information** a report must include, and how to treat **evidence**"], "sections": [["Why investigate?", [["Causes, not blame", ["The **Transportation Safety Board of Canada (TSB)** investigates aviation occurrences in Canada to **prevent them happening again**. It does **not** assign blame or liability (TC AIM GEN 3.1).", "Investigators are on **24-hour** standby."]], ["What counts", ["An **aviation occurrence** is any accident or incident linked to operating an aircraft, or a situation that could lead to one if left alone (GEN 3.2)."]]]], ["Is it reportable?", [["Accidents", ["Someone is **killed or seriously injured** from being on board, from touching the aircraft (or a part that came off), or from **propeller wash or jet blast**.", "The aircraft has **damage** that hurts its strength, performance or handling and would normally need **major repair**.", "The aircraft is **missing** or **can't be reached** (GEN 3.3.1)."], "report"], ["Damage that doesn't count", ["Damage **only** to the engine (and its cowlings or accessories), or only to the **propeller, wing tips, antennas, tires, brakes, fairings**, or **small dents or holes** in the skin."]], ["Serious injury", ["For example a **broken bone** (but not a simple fracture of a finger, toe or nose), heavy bleeding, an internal injury, bad burns, or an injury **likely to need a hospital stay** (GEN 3.2)."]], ["Incidents", ["A list of **incidents** (engine shut down, smoke or fire, a near collision, a fuel shortage that forces a diversion…) must be reported for aircraft **over 2,250 kg** or flown by an **air operator** (GEN 3.3.2).", "Any other safety problem **may** be reported to the TSB in writing (GEN 3.3.4)."]]]], ["Making the report", [["Who reports", ["The **owner, operator, pilot-in-command**, any **crew member**, and air traffic services staff with **direct knowledge** of it (GEN 3.3)."]], ["To whom, how fast", ["To a **regional TSB office** (in Alberta, TSB Western in Edmonton: 1-800-387-3557).", "Send what you know **as soon as possible, by the quickest means**. Send the rest **as it becomes available, within 30 days** (GEN 3.3.3, 3.3.5)."]], ["What to say", ["Aircraft type and **registration**; owner, operator and pilot; departure point and destination; **date, time and place**; people on board and **injuries**; what happened and the damage; any **dangerous goods**; what is being done to protect people; and your name and **phone number** (GEN 3.3.3)."]], ["Protect the evidence", ["Keep wreckage and evidence as they are unless the TSB says otherwise, but **always keep people safe first**. If you must move something, **record it first** if you can and tell the TSB (GEN 3.4)."]], ["SECURITAS", ["A **confidential** TSB line for reporting unsafe acts or conditions that wouldn't normally be reported (GEN 3.5)."]]]]], "summary": "The TSB investigates aviation occurrences to stop them happening again, not to blame anyone. An accident must be reported when someone is killed or seriously injured, when the aircraft has damage needing major repair (damage only to the engine, propeller, wing tips, tires, brakes or small dents doesn't count), or when the aircraft is missing or can't be reached. Listed incidents must also be reported for aircraft over 2,250 kg or flown by an air operator. The owner, operator, pilot-in-command, crew or ATS staff who know about it report to a regional TSB office as soon as possible by the quickest means, with the rest within 30 days. Keep evidence as it is unless people's safety requires otherwise.", "selfcheck": [["What is the purpose of a TSB investigation?", "To prevent a recurrence, not to assign blame or liability."], ["Name the three kinds of reportable accident.", "Death or serious injury; damage needing major repair; aircraft missing or inaccessible."], ["Is a simple fractured finger a serious injury?", "No. Simple fractures of fingers, toes or the nose are left out."], ["Which aircraft do the mandatory incident reports apply to?", "Over 2,250 kg, or operated by an air operator."], ["Who must report an occurrence?", "Owner, operator, pilot-in-command, crew, or ATS staff with direct knowledge."], ["How fast must you report?", "As soon as possible by the quickest means; the rest within 30 days."], ["To whom?", "A regional TSB office."], ["What do you do with wreckage?", "Leave it as it is unless needed for safety; record it first if you must move it."]], "practice": [["TP 11919 §14", "Aviation Occurrences (5 questions in the bank)"], ["TC AIM", "GEN 3.1–3.5"]], "reading": ["TP 11919 §14 Aviation Occurrences", "TC AIM GEN 3.0 Transportation Safety Board of Canada"]}];
const KEY = 'safapp-cornell-pstar3';
let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const $ = id => document.getElementById(id);
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let cur = store.last && LESSONS.some(l => l.code === store.last) ? store.last : LESSONS[0].code;
let studying = false;

function tabs() {
  $('tabs').innerHTML = '';
  LESSONS.forEach(L => {
    const b = document.createElement('button'); b.className = 'tab';
    b.setAttribute('aria-pressed', L.code === cur); b.textContent = L.code + ' ' + L.title;
    b.onclick = () => { cur = L.code; store.last = cur; save(); tabs(); render(); document.getElementById('scroller').scrollTo(0, 0); };
    $('tabs').appendChild(b);
  });
}
function render() {
  const L = LESSONS.find(l => l.code === cur);
  let h = `<div style="display:flex;flex-direction:column;gap:18px">
  <div class="title"><span class="code">${L.code}</span><span class="name">${esc(L.title)}</span><span class="kind">CORNELL NOTES</span></div>
  <div class="panel goldleft"><h3>By the end of this lesson you can</h3><ul class="b">${L.objectives.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>
  <div class="toolbar">
    <label class="switch" for="study"><input type="checkbox" id="study" ${studying ? 'checked' : ''}> Study mode: hide the notes</label>
    <span class="hint" id="hint">${studying ? 'Answer each cue in your head, then tap the notes to check.' : 'Turn on study mode to quiz yourself with the cues.'}</span>
  </div>
  <div class="cornell ${studying ? 'studying' : ''}" id="cornell">
    <div class="colhead"><div>CUES / QUESTIONS</div><div>NOTES</div></div>`;
  L.sections.forEach(([head, rows]) => {
    h += `<div class="sec">${esc(head)}</div>`;
    rows.forEach(([cue, notes, fig]) => {
      h += `<div class="row"><div class="cue">${md(cue)}</div><div class="note"><div class="content"><ul class="b">${notes.map(n => `<li>${md(n)}</li>`).join('')}</ul>${fig && FIGS[fig] ? `<figure class="fig">${FIGS[fig].svg}<figcaption>${md(FIGS[fig].cap)}</figcaption></figure>` : ''}</div><button class="reveal" aria-label="Show notes"><span>Tap to check</span></button></div></div>`;
    });
  });
  h += `</div>
  <div class="summary"><h3>Summary</h3>
    <label for="mine" style="font-weight:600">In my own words</label>
    <textarea id="mine" placeholder="Write the big ideas of this lesson in 3–4 sentences without looking at the notes.">${esc((store.mine || {})[L.code] || '')}</textarea>
    <span class="saved" id="saved" hidden>Saved on this device</span>
    <div class="model"><button class="cmp" id="cmp" type="button">Compare with the model summary</button><span class="hint" id="cmpHint">Write at least 30 characters first.</span><p style="margin:0" id="model" hidden>${md(L.summary)}</p></div></div>
  <div class="panel"><h3>Self-check</h3><div class="qa">${L.selfcheck.map(([q, a], i) => `<div class="q"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span><span class="a" hidden>${esc(a)}</span><button data-i="${i}">Show answer</button></div>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Exam practice</h3><span class="hint">Official guide: <a href="${GUIDE.url}" target="_blank" rel="noopener">${esc(GUIDE.name)}</a></span><ul class="b">${L.practice.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>Required reading — next class</h3><ul class="b">${L.reading.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  </div></div>`;
  $('lesson').innerHTML = h;
  $('study').onchange = e => { studying = e.target.checked; render(); };
  document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => { if (studying) n.classList.add('shown'); }));
  document.querySelectorAll('.q button').forEach(b => b.onclick = () => { const a = b.previousElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; });
  let t; $('mine').oninput = e => { clearTimeout(t); t = setTimeout(() => { store.mine = store.mine || {}; store.mine[L.code] = e.target.value; save(); $('saved').hidden = false; }, 500); };
  const gate = () => { const ok = $('mine').value.trim().length >= 30; $('cmp').disabled = !ok; $('cmpHint').hidden = ok; };
  $('mine').addEventListener('input', gate); gate();
  $('cmp').onclick = () => { if ($('cmp').disabled) return; $('model').hidden = false; $('cmp').hidden = true; };
}
tabs(); render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "pstar3-notes", "unit": 3, "kind": "notes"};
  const run = window.google && google.script && google.script.run;
  const sent = {};

  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();
  function askName() {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };
    document.body.appendChild(b);
  }
  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
  if (typeof render === 'function') { const _r = render; render = function () { _r.apply(this, arguments); try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }; try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }
  document.addEventListener('change', e => { if (e.target && e.target.id === 'study' && e.target.checked) T('notes', {l: cur, a: 'study'}, 6e5); });
  let st_; document.addEventListener('input', e => { if (e.target && e.target.id === 'mine' && e.target.value.trim().length >= 30) { clearTimeout(st_); st_ = setTimeout(() => T('notes', {l: cur, a: 'summary'}, 6e5), 1500); } });
})();
</script>
