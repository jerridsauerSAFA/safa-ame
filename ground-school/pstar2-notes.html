<style>
:root{
  --bg:#000; --panel:#121110; --cue:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
header img{width:84px;flex:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);line-height:1.15;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px}
.title .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--gold);line-height:1}
.title .name{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;text-transform:uppercase}
.title .kind{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.goldleft{border-left:4px solid var(--gold)}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.b li{position:relative;padding-left:18px}
ul.b li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:13px;top:1px}
b{font-weight:700}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.hint{font-size:13px;color:var(--muted)}
.cornell{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.colhead{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:2px solid var(--gold)}
.colhead div{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--gold)}
.sec{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px}
.row{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cue{background:var(--cue);color:var(--gold);font-weight:700;padding:12px 14px;border-right:2px solid var(--gold);min-width:0}
.note{padding:12px 16px;min-width:0;position:relative}
.note ul.b li{line-height:1.45}
.studying .note .content{filter:blur(7px);opacity:.55;user-select:none;transition:filter .25s,opacity .25s}
.studying .note.shown .content{filter:none;opacity:1;user-select:auto}
.reveal{display:none}
.studying .note:not(.shown) .reveal{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;width:100%}
.reveal span{background:#000;border:1px solid var(--gold);border-radius:99px;padding:6px 14px}
.summary{border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
textarea{width:100%;min-height:96px;resize:vertical;background:#1b1915;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.saved{font-size:13px;color:#7fc48a}
.qa{display:flex;flex-direction:column;gap:8px}
.q{background:#17150f;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.q .n{font-family:var(--display);font-weight:700;color:var(--gold)}
.q .a{grid-column:2;color:var(--gold)}
.q button{grid-column:2;justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:12px;font-weight:600;cursor:pointer}
.q button:hover{border-color:var(--gold);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand img{width:60px}
.tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){
  .row,.colhead{grid-template-columns:1fr}
  .cue{border-right:0;border-bottom:1px solid var(--gold);padding:10px 14px}
  .colhead div:last-child{display:none}
  .grid2{grid-template-columns:1fr}
  .title .kind{margin-left:0;width:100%}
}
@media print{body{background:#fff;color:#000}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}
header img{width:62px!important}

.fig{margin:10px 0 2px;background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;overflow-y:hidden}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.model{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cmp{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.cmp:disabled{background:var(--line);color:var(--muted);cursor:default}
.panel a{color:var(--gold)}
</style>

"2.4\"/><text x=\"40\" y=\"162\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" >Tachometer, oil pressure, oil or coolant temperature<\/text><text x=\"40\" y=\"176\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"10.5\" font-weight=\"400\" >For each engine<\/text><text x=\"588\" y=\"169\" text-anchor=\"end\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"11\" font-weight=\"600\" >605.14(e)–(h)<\/text><rect x=\"0\" y=\"186\" width=\"600\" height=\"36\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><rect x=\"12\" y=\"196\" width=\"16\" height=\"16\" rx=\"3\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2\"/><path d=\"M15 204 l4 4 l7 -9\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2.4\"/><text x=\"40\" y=\"202\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" >Fuel quantity for each main tank<\/text><text x=\"40\" y=\"216\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"10.5\" font-weight=\"400\" >Readable from the pilot&#x27;s seat (gear position too, if retractable)<\/text><text x=\"588\" y=\"209\" text-anchor=\"end\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"11\" font-weight=\"600\" >605.14(j)<\/text><rect x=\"0\" y=\"226\" width=\"600\" height=\"36\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><rect x=\"12\" y=\"236\" width=\"16\" height=\"16\" rx=\"3\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2\"/><path d=\"M15 244 l4 4 l7 -9\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2.4\"/><text x=\"40\" y=\"242\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" >Two-way radio<\/text><text x=\"40\" y=\"256\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"10.5\ const GUIDE = {"name": "TP 11919 PSTAR study guide §2, §4, §5 (Transport Canada)", "url": "https://tc.canada.ca/en/aviation/publications/student-pilot-permit-private-pilot-licence-foreign-military-applicants-aviation-regulations-tp-11919"};
const LESSONS = [{"code": "P2.1", "title": "Aerodromes", "objectives": ["Tell an **aerodrome** from an **airport**, and name the **manoeuvring area**, **apron** and **movement area**", "Read a **wind direction indicator** and work out **runway numbers**", "Recognize **closed** runway and taxiway marks, **holding position** markings and **displaced thresholds**", "Know where to **hold** with no markings, who lets **vehicles** onto an uncontrolled airport, and the **2,000 ft** overflight rule"], "sections": [["Aerodrome or airport?", [["Aerodrome", ["Any area of **land, water** (including **frozen** water) or other surface used for aircraft to **arrive, depart, move or be serviced**, including its buildings.", "A **registered** aerodrome is one listed in the **CFS** (Canada Flight Supplement) or the **CWAS** (Canada Water Aerodrome Supplement)."]], ["Airport", ["An aerodrome with an **airport certificate** in force.", "Every airport is an aerodrome. Not every aerodrome is an airport: a farm strip can be an aerodrome."]], ["The parts", ["**Manoeuvring area**: the runways and taxiways used for **take-off, landing** and moving to and from them. It does **not** include the apron.", "**Apron** (ramp): for loading, unloading, refuelling, servicing and **parking**.", "**Movement area** = manoeuvring area **+** aprons."], "areas"]]], ["Reading the field", [["Wind direction indicator", ["The wind blows **into the wide end**, so the sock streams **downwind**.", "Standard dry sock: **straight out (horizontal) = 15 kt or more**. About 5° below horizontal = 10 kt. About 30° below = 6 kt.", "It is lit at night at certified airports. Socks at other aerodromes may not be standard."], "windsock"], ["Runway numbers", ["The number is the runway's **magnetic direction to the nearest 10°**, with the last zero dropped: 087° → **09**.", "You read the number as you land or take off. The **west end** of an east-west runway is **09** (you face east). The east end is **27**.", "The two ends differ by **18**. Parallel runways add **L, C, R**. In the far north, where compasses are unreliable, runways use **true** direction."], "numbers"]]], ["Markings", [["Closed", ["**Closed runway**: **white Xs**, no more than 300 m apart.", "**Closed taxiway**: **yellow Xs** at each end of the closed part.", "A **lighted X** near the threshold can mark a runway that is closed for a while. Lights on a closed area stay off."], "marks"], ["Holding position", ["**Two solid and two dashed lines** across the taxiway protect the runway. Stop before them.", "At an airport with a tower, you need a **clearance** to go past a holding position.", "**No marking or sign?** Stay at least **200 ft from the runway edge** until you are cleared for take-off or to cross."]], ["Clearing the runway", ["After landing, keep taxiing until the **whole aircraft** is past the holding position line, or 200 ft from the edge if there is no line. Only then are you clear."]], ["Displaced threshold", ["**Arrows** before the threshold: you may **taxi**, **take off**, and finish your **landing roll** there coming from the other direction.", "Do **not** touch down on the arrows."]]]], ["Rules on and over the field", [["People and vehicles", ["Nobody may walk, drive or park on the **movement area** without permission from the **aerodrome operator** (and from air traffic services, such as the tower, where that applies).", "So at an **uncontrolled** airport, the **operator** gives permission."]], ["Overflying", ["Stay at least **2,000 ft** above an aerodrome unless you are **landing or taking off**, or ATC authorizes lower.", "A few jobs are exempt, such as police work, saving lives, firefighting and air ambulance."], "low"]]]], "summary": "An aerodrome is any land, water (even frozen) or other surface used for aircraft; an airport is an aerodrome with an airport certificate. The manoeuvring area is the runways and taxiways used for take-off and landing; the apron is for loading and parking; the movement area is both. A standard windsock is straight out at 15 kt or more. Runway numbers are the magnetic direction to the nearest 10°, so the west end of an east-west runway is 09. White Xs close a runway; yellow Xs close a taxiway. With no holding marking, hold at least 200 ft from the runway edge. Vehicles at an uncontrolled airport need the operator's permission. Stay at least 2,000 ft over an aerodrome unless landing or taking off.", "selfcheck": [["What makes an aerodrome an airport?", "An airport certificate in force."], ["What is the manoeuvring area?", "The runways and taxiways used for take-off, landing and moving to and from them (not the apron)."], ["What is the movement area?", "The manoeuvring area plus the aprons."], ["A standard dry windsock is straight out. What is the wind speed?", "15 kt or more."], ["What number is painted at the west end of an east-west runway?", "09."], ["How are a closed runway and a closed taxiway marked?", "Runway: white Xs. Taxiway: yellow Xs at each end of the closed part."], ["There is no holding position marking. Where do you wait for take-off?", "At least 200 ft from the edge of the runway."], ["What is the lowest you may fly over an aerodrome when not landing or taking off?", "2,000 ft (unless ATC authorizes lower)."]], "practice": [["TP 11919 §4", "4.01 Airport · 4.02 Wind indicator · 4.03 Vehicles · 4.04 Closed markings · 4.05 Runway numbers · 4.06 Holding · 4.07 Manoeuvring area · 4.08 Overflying"]], "reading": ["TC AIM AGA 2, 3.5, 5 and RAC 4.2, 5.5 (free on the Transport Canada website)"]}, {"code": "P2.2", "title": "Visual Signals", "objectives": ["Read the tower's **light signals** for an aircraft **on the ground** and **in flight**", "Know what light signals and **blinking runway lights** mean for **vehicles and people**", "**Acknowledge** a light signal by day and by night", "Spot **fur farm** markings and keep **2,000 ft AGL** over farms and wildlife"], "sections": [["When the tower uses lights", [["Why", ["No radio, or the radio failed? The tower can still talk to you with a **light gun**: green, red or white, **steady** or a **series of flashes**.", "The same light can mean something different **on the ground** and **in the air**. Learn both."]], ["Memory hook", ["**Steady green** = the big \"yes\": take off (ground) or land (air).", "**Steady red** = \"not now\": stop (ground) or give way and keep circling (air).", "**Green flashes** = \"come on\": taxi (ground) or come back to land (air).", "**Red flashes** = \"get away\": taxi clear of the runway (ground) or don't land, it's unsafe (air)."]]]], ["On the ground", [["Aircraft", ["**Series of green flashes**: cleared to taxi.", "**Steady green**: cleared for take-off.", "**Series of red flashes**: taxi clear of the landing area or runway in use.", "**Steady red**: stop.", "**Flashing white**: return to your starting point on the aerodrome.", "**Blinking runway lights** are not used to signal aircraft."], "lights"], ["Vehicles and people", ["**Green flashes**: cleared to cross; proceed; go.", "**Steady green**: not used for vehicles or people.", "**Red flashes**: vacate the runway immediately. **Steady red**: stop; hold your position.", "**Flashing white**: return to starting point. **Blinking runway lights**: **vacate the active runway**."]]]], ["In the air", [["Aircraft in flight", ["**Steady green**: cleared to land.", "**Steady red**: give way to other aircraft and continue circling.", "**Series of green flashes**: return for landing. A steady green follows when it is time to land.", "**Series of red flashes**: aerodrome unsafe, do not land.", "**Red flare** (military control towers only): do not land for the time being, day or night, whatever you were told before."]]]], ["Answering the tower", [["Acknowledge", ["**In flight**: rock the aircraft so it is easy to see. **At night**: one flash of your landing light.", "**On the ground by day**: move the ailerons or rudder **three times in a row**, or taxi to the spot you were cleared to."], "ack"], ["Tips", ["Stopped by a red light? **Wait** for another signal before you move.", "Ready for take-off by day with no radio? **Turn toward the tower** to get the controller's attention."]]]], ["Signs below you", [["Fur farms", ["May be marked with **chrome yellow and black stripes** on pylons or roofs. A **red flag** may fly in whelping season (**February to May**).", "Fur and poultry animals panic at low aircraft. Avoid flying over these farms below **2,000 ft AGL**."], "low"], ["Wildlife", ["Near herds of **caribou, reindeer, moose or muskoxen**, and over wildlife refuges and bird sanctuaries: **no lower than 2,000 ft AGL**."]]]]], "summary": "With no radio, the tower uses a light gun. On the ground: green flashes = taxi, steady green = take off, red flashes = taxi clear of the runway, steady red = stop, flashing white = return to your starting point. In the air: steady green = land, steady red = give way and keep circling, green flashes = return for landing, red flashes = unsafe, don't land. Vehicles and people: blinking runway lights = vacate the active runway. Acknowledge by rocking the aircraft in flight (one landing-light flash at night), or by moving the ailerons or rudder three times on the ground. Fur farms may have chrome yellow and black stripes; stay at least 2,000 ft AGL over them and over wildlife herds.", "selfcheck": [["On the ground, what do green flashes mean?", "Cleared to taxi."], ["On the ground, what does a steady green mean?", "Cleared for take-off."], ["In flight, what does a steady green mean?", "Cleared to land."], ["In flight, what does a steady red mean?", "Give way to other aircraft and continue circling."], ["In flight, what do red flashes mean?", "Aerodrome unsafe: do not land."], ["What does a flashing white light mean to an aircraft on the manoeuvring area?", "Return to your starting point on the aerodrome."], ["A driver sees the runway lights blinking. What must they do?", "Vacate the active runway."], ["How might a fur farm be marked, and how high should you stay?", "Chrome yellow and black stripes on pylons or roofs; at least 2,000 ft AGL."]], "practice": [["TP 11919 §2", "2.01–2.04 Green and red lights · 2.05 Flashing white · 2.06 Blinking runway lights · 2.07 Fur farm markings · 2.08 Wildlife"]], "reading": ["TC AIM RAC 1.10, 4.2.11 and 4.4.7"]}, {"code": "P2.3", "title": "Equipment", "objectives": ["List the **documents** that must be on board a private aircraft with a radio", "Know the **survival**, **water** and **oxygen** rules", "Know the equipment for **day VFR**, the **landing light** rule and the **lighting** needed for night take-offs", "Define an **infant** and how one rides without a child seat; know **121.5 MHz**"], "sections": [["Paperwork on board", [["Aircraft documents", ["**Certificate of registration**.", "**Flight authority**: usually the **certificate of airworthiness**.", "**Proof of liability insurance**.", "**Journey log**: on board unless you won't land and shut down anywhere other than where you started."], "docs"], ["Pilot documents", ["Your **permit or licence** and your **medical certificate**: you must be able to show them while you fly.", "Using the radio? You need your **ROC-A** (Restricted Operator Certificate, Aeronautical)."]]]], ["Survival gear", [["Over land", ["Carry equipment for **every person**, suited to the area and season, to: **start a fire**, **make shelter**, **get or purify water**, and **signal for help**.", "Not needed within **25 NM** of the aerodrome you left, if you can talk to a ground station by **radio** the whole flight. (Also not needed in gliders, balloons, hang gliders, gyroplanes and ultralights.)"], "survive"], ["Over water", ["Taking off from or landing on **water**, or flying beyond where you could **reach shore** if the engine failed: a **life jacket** (or flotation device) for **each person**.", "Single-engine aeroplane more than **100 NM or 30 minutes** (whichever is less) from a place to land: carry **life rafts**."]]]], ["Oxygen", [["Unpressurized aircraft", ["Cabin above **10,000 ft ASL** up to **13,000 ft**: you may stay **up to 30 minutes** without oxygen. Longer: oxygen for all crew and **10%** of passengers (at least one).", "Above **13,000 ft ASL**: oxygen for **everyone**, the **whole time**."], "oxygen"]]], ["Day and night equipment", [["Day VFR", ["An **altimeter** (a **sensitive** one in controlled airspace), an **airspeed indicator**, and a **magnetic compass** that works without the electrical system.", "For each engine: **tachometer**, **oil pressure** and oil or coolant **temperature**. A way to see **fuel quantity** in each main tank.", "A **two-way radio** in Class B, C or D airspace, a mandatory frequency (MF) area or the ADIZ."], "dayvfr"], ["Night VFR", ["Most of the day list, plus items such as a sensitive altimeter, instrument lighting, spare fuses, and **position and anti-collision lights**.", "**Landing light**: required at night **when carrying passengers**."]], ["Night at the aerodrome", ["You may take off or land at night only where the aerodrome is **lit to the CARs standard**: lines of fixed **white lights** along both sides of the runway.", "Exceptions: police work or **saving a life**, if no one on the ground is put at risk."]]]], ["Passengers and radio", [["Infants", ["An **infant** is a person **under 2 years** old.", "When the pilot orders seat belts on and there is no child restraint system, the passenger responsible for the infant **holds it securely in their arms**, with their own belt fastened.", "One passenger may be responsible for only **one** infant."]], ["121.5 MHz", ["The VHF **emergency** frequency.", "Monitor it whenever you can in **sparsely settled areas**, and over water more than **50 NM** from shore.", "On the ground, only control towers and flight service stations listen on 121.5, and only during their hours."]]]]], "summary": "A private aircraft carries its certificate of registration, flight authority (certificate of airworthiness), proof of liability insurance and journey log; you carry your permit or licence, medical, and ROC-A to use the radio. Over land, survival gear must let everyone make fire, shelter, water and a distress signal (not needed within 25 NM of departure with radio). On water or beyond gliding reach of shore, carry a life jacket for each person. Unpressurized: up to 30 minutes between 10,000 and 13,000 ft ASL without oxygen; above 13,000, oxygen for everyone the whole time. Day VFR needs basics like an altimeter, airspeed indicator and magnetic compass. A landing light is needed at night with passengers, and night take-offs need a properly lit aerodrome. An infant is under 2 and, with no child seat, is held securely in a passenger's arms. 121.5 MHz is the emergency frequency.", "selfcheck": [["Name the four aircraft documents for a private aircraft.", "Certificate of registration, flight authority (certificate of airworthiness), proof of liability insurance, journey log."], ["Survival gear over land must let you do what four things?", "Start a fire, make shelter, get or purify water, signal distress."], ["When is survival gear over land not needed?", "Within 25 NM of the departure aerodrome with radio contact the whole flight."], ["When must you carry a life jacket for each person?", "Taking off from or landing on water, or flying beyond where you could reach shore if the engine failed."], ["Above 13,000 ft ASL in an unpressurized aircraft, who needs oxygen?", "Everyone on board, the whole time."], ["How long may you fly between 10,000 and 13,000 ft ASL without oxygen?", "Up to 30 minutes."], ["When is a landing light required?", "At night when carrying passengers."], ["What is an infant, and how does one ride without a child seat?", "Under 2 years old; held securely in the arms of the passenger responsible for it."]], "practice": [["TP 11919 §5", "5.01 Documents · 5.02 Survival · 5.03 Landing light · 5.04–5.05 Oxygen · 5.06 Water · 5.07 121.5 MHz · 5.08 Night lighting · 5.09–5.10 Infants · 5.11 Day VFR"]], "reading": ["CARs 602.61–602.63, 605.14, 605.16, 605.26, 605.31 (free on the Justice Laws website)"]}];
const KEY = 'safapp-cornell-pstar2';
let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const $ = id => document.getElementById(id);
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let cur = store.last && LESSONS.some(l => l.code === store.last) ? store.last : LESSONS[0].code;
let studying = false;

function tabs() {
  $('tabs').innerHTML = '';
  LESSONS.forEach(L => {
    const b = document.createElement('button'); b.className = 'tab';
    b.setAttribute('aria-pressed', L.code === cur); b.textContent = L.code + ' ' + L.title;
    b.onclick = () => { cur = L.code; store.last = cur; save(); tabs(); render(); document.getElementById('scroller').scrollTo(0, 0); };
    $('tabs').appendChild(b);
  });
}
function render() {
  const L = LESSONS.find(l => l.code === cur);
  let h = `<div style="display:flex;flex-direction:column;gap:18px">
  <div class="title"><span class="code">${L.code}</span><span class="name">${esc(L.title)}</span><span class="kind">CORNELL NOTES</span></div>
  <div class="panel goldleft"><h3>By the end of this lesson you can</h3><ul class="b">${L.objectives.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>
  <div class="toolbar">
    <label class="switch" for="study"><input type="checkbox" id="study" ${studying ? 'checked' : ''}> Study mode: hide the notes</label>
    <span class="hint" id="hint">${studying ? 'Answer each cue in your head, then tap the notes to check.' : 'Turn on study mode to quiz yourself with the cues.'}</span>
  </div>
  <div class="cornell ${studying ? 'studying' : ''}" id="cornell">
    <div class="colhead"><div>CUES / QUESTIONS</div><div>NOTES</div></div>`;
  L.sections.forEach(([head, rows]) => {
    h += `<div class="sec">${esc(head)}</div>`;
    rows.forEach(([cue, notes, fig]) => {
      h += `<div class="row"><div class="cue">${md(cue)}</div><div class="note"><div class="content"><ul class="b">${notes.map(n => `<li>${md(n)}</li>`).join('')}</ul>${fig && FIGS[fig] ? `<figure class="fig">${FIGS[fig].svg}<figcaption>${md(FIGS[fig].cap)}</figcaption></figure>` : ''}</div><button class="reveal" aria-label="Show notes"><span>Tap to check</span></button></div></div>`;
    });
  });
  h += `</div>
  <div class="summary"><h3>Summary</h3>
    <label for="mine" style="font-weight:600">In my own words</label>
    <textarea id="mine" placeholder="Write the big ideas of this lesson in 3–4 sentences without looking at the notes.">${esc((store.mine || {})[L.code] || '')}</textarea>
    <span class="saved" id="saved" hidden>Saved on this device</span>
    <div class="model"><button class="cmp" id="cmp" type="button">Compare with the model summary</button><span class="hint" id="cmpHint">Write at least 30 characters first.</span><p style="margin:0" id="model" hidden>${md(L.summary)}</p></div></div>
  <div class="panel"><h3>Self-check</h3><div class="qa">${L.selfcheck.map(([q, a], i) => `<div class="q"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span><span class="a" hidden>${esc(a)}</span><button data-i="${i}">Show answer</button></div>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Exam practice</h3><span class="hint">Official guide: <a href="${GUIDE.url}" target="_blank" rel="noopener">${esc(GUIDE.name)}</a></span><ul class="b">${L.practice.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>Required reading — next class</h3><ul class="b">${L.reading.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  </div></div>`;
  $('lesson').innerHTML = h;
  $('study').onchange = e => { studying = e.target.checked; render(); };
  document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => { if (studying) n.classList.add('shown'); }));
  document.querySelectorAll('.q button').forEach(b => b.onclick = () => { const a = b.previousElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; });
  let t; $('mine').oninput = e => { clearTimeout(t); t = setTimeout(() => { store.mine = store.mine || {}; store.mine[L.code] = e.target.value; save(); $('saved').hidden = false; }, 500); };
  const gate = () => { const ok = $('mine').value.trim().length >= 30; $('cmp').disabled = !ok; $('cmpHint').hidden = ok; };
  $('mine').addEventListener('input', gate); gate();
  $('cmp').onclick = () => { if ($('cmp').disabled) return; $('model').hidden = false; $('cmp').hidden = true; };
}
tabs(); render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "pstar2-notes", "unit": 2, "kind": "notes"};
  const run = window.google && google.script && google.script.run;
  const sent = {};
  let who = ''; try { who = localStorage.getItem('safa-who') || ''; } catch (e) {}
  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();
  function askName() {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };
    document.body.appendChild(b);
  }
  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
  if (typeof render === 'function') { const _r = render; render = function () { _r.apply(this, arguments); try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }; try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }
  document.addEventListener('change', e => { if (e.target && e.target.id === 'study' && e.target.checked) T('notes', {l: cur, a: 'study'}, 6e5); });
  let st_; document.addEventListener('input', e => { if (e.target && e.target.id === 'mine' && e.target.value.trim().length >= 30) { clearTimeout(st_); st_ = setTimeout(() => T('notes', {l: cur, a: 'summary'}, 6e5), 1500); } });
})();
</script>
