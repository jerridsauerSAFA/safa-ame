<style>
:root{
  --bg:#000; --panel:#121110; --cue:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
header img{width:84px;flex:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);line-height:1.15;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px}
.title .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--gold);line-height:1}
.title .name{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;text-transform:uppercase}
.title .kind{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.goldleft{border-left:4px solid var(--gold)}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.b li{position:relative;padding-left:18px}
ul.b li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:13px;top:1px}
b{font-weight:700}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.hint{font-size:13px;color:var(--muted)}
.cornell{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.colhead{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:2px solid var(--gold)}
.colhead div{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--gold)}
.sec{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px}
.row{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cue{background:var(--cue);color:var(--gold);font-weight:700;padding:12px 14px;border-right:2px solid var(--gold);min-width:0}
.note{padding:12px 16px;min-width:0;position:relative}
.note ul.b li{line-height:1.45}
.studying .note .content{filter:blur(7px);opacity:.55;user-select:none;transition:filter .25s,opacity .25s}
.studying .note.shown .content{filter:none;opacity:1;user-select:auto}
.reveal{display:none}
.studying .note:not(.shown) .reveal{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;width:100%}
.reveal span{background:#000;border:1px solid var(--gold);border-radius:99px;padding:6px 14px}
.summary{border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
textarea{width:100%;min-height:96px;resize:vertical;background:#1b1915;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.saved{font-size:13px;color:#7fc48a}
.qa{display:flex;flex-direction:column;gap:8px}
.q{background:#17150f;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.q .n{font-family:var(--display);font-weight:700;color:var(--gold)}
.q .a{grid-column:2;color:var(--gold)}
.q button{grid-column:2;justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:12px;font-weight:600;cursor:pointer}
.q button:hover{border-color:var(--gold);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand img{width:60px}
.tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){
  .row,.colhead{grid-template-columns:1fr}
  .cue{border-right:0;border-bottom:1px solid var(--gold);padding:10px 14px}
  .colhead div:last-child{display:none}
  .grid2{grid-template-columns:1fr}
  .title .kind{margin-left:0;width:100%}
}
@media print{body{background:#fff;color:#000}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}
header img{width:62px!important}

.fig{margin:10px 0 2px;background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;overflow-y:hidden}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.model{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cmp{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.cmp:disabled{background:var(--line);color:var(--muted);cursor:default}
.panel a{color:var(--gold)}
</style>

<script>
const FIGS = {"row_geom": {"svg": "<svg viewBox=\"0 0 600 270\" role=\"img\" aria-label=\"Right of way: converging, head-on and overtaking\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"p1ag\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#d8b358\"/><\/marker><marker id=\"p1aw\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#ffffff\"/><\/marker><marker id=\"p1ak\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#7fd18b\"/><\/marker><marker id=\"p1ab\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#7fc3ff\"/><\/marker><marker id=\"p1ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#f08c7a\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"190\" height=\"270\" rx=\"12\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"95\" y=\"24\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Converging<\/text><text x=\"95\" y=\"236\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Traffic on your right?<\/text><text x=\"95\" y=\"255\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">You give way: pass behind.<\/text><g transform=\"translate(75 185) rotate(0) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#d8b358\"/><\/g><text x=\"75\" y=\"215\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"700\">You<\/text><g transform=\"translate(140 92) rotate(-90) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#ffffff\"/><\/g><text x=\"140\" y=\"122\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"700\">Traffic<\/text><path d=\"M75,166 Q83,120 170,136\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2.2\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1ag)\"/><path d=\"M117,92 H65\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-dasharray=\"2 4\" marker-end=\"url(#p1aw)\"/><rect x=\"205\" y=\"0\" width=\"190\" height=\"270\" rx=\"12\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"300\" y=\"24\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Head-on<\/text><text x=\"300\" y=\"236\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Coming straight at you?<\/text><text x=\"300\" y=\"255\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">Both turn right.<\/text><g transform=\"translate(300 190) rotate(0) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#d8b358\"/><\/g><text x=\"326\" y=\"205\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"700\">You<\/text><g transform=\"translate(300 62) rotate(180) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#ffffff\"/><\/g><text x=\"274\" y=\"52\" text-anchor=\"end\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"700\">Other<\/text><path d=\"M300,170 Q304,140 344,128\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2.2\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1ag)\"/><path d=\"M300,82 Q296,112 256,124\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.2\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1aw)\"/><rect x=\"410\" y=\"0\" width=\"190\" height=\"270\" rx=\"12\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"505\" y=\"24\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Overtaking<\/text><text x=\"505\" y=\"236\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Catching up from behind?<\/text><text x=\"505\" y=\"255\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">You turn right to pass.<\/text><g transform=\"translate(505 190) rotate(0) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#d8b358\"/><\/g><text x=\"481\" y=\"194\" text-anchor=\"end\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"700\">You<\/text><text x=\"481\" y=\"208\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"10.5\" font-weight=\"400\">faster<\/text><g transform=\"translate(505 74) rotate(0) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#ffffff\"/><\/g><text x=\"481\" y=\"78\" text-anchor=\"end\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"700\">Slower<\/text><path d=\"M505,170 Q513,128 551,116 L551,64\" fill=\"none\" stroke=\"#d8b358\" stroke-width=\"2.2\" stroke-dasharray=\"5 4\" marker-end=\"url(#p1ag)\"/><\/svg>", "cap": "CARs 602.19(2), (5) and (6), quoted in TC AIM RAC 1.8. Giving way: never pass over, under or ahead unless well clear (602.19(4))."}, "row_order": {"svg": "<svg viewBox=\"0 0 600 328\" role=\"img\" aria-label=\"Right-of-way order for converging aircraft\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Converging at about the same altitude: who gives way?<\/text><rect x=\"0\" y=\"28\" width=\"600\" height=\"50\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"18\" y=\"59\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\">1<\/text><text x=\"44\" y=\"49\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\">Balloons<\/text><text x=\"44\" y=\"67\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">Every other type gives way to them.<\/text><g transform=\"translate(566 53) scale(0.85)\"><circle cx=\"0\" cy=\"-4\" r=\"13\" fill=\"#d8b358\"/><path d=\"M-9,5 L-3,14 M9,5 L3,14\" stroke=\"#d8b358\" stroke-width=\"1.5\"/><rect x=\"-4\" y=\"13\" width=\"8\" height=\"6\" fill=\"#d8b358\"/><\/g><rect x=\"0\" y=\"84\" width=\"600\" height=\"50\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"18\" y=\"115\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\">2<\/text><text x=\"44\" y=\"105\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\">Gliders (hang gliders too)<\/text><text x=\"44\" y=\"123\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">Give way to balloons.<\/text><g transform=\"translate(566 109) rotate(0) scale(0.85)\"><path d=\"M0,-11 L2,-3 L24,-1 L24,1.5 L2,1.5 L1,10 L6,12 L6,13.5 L-6,13.5 L-6,12 L-1,10 L-2,1.5 L-24,1.5 L-24,-1 L-2,-3 Z\" fill=\"#ffffff\"/><\/g><rect x=\"0\" y=\"140\" width=\"600\" height=\"50\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"18\" y=\"171\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\">3<\/text><text x=\"44\" y=\"161\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\">Airships<\/text><text x=\"44\" y=\"179\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">Give way to gliders and balloons.<\/text><g transform=\"translate(566 165) rotate(0) scale(0.85)\"><ellipse cx=\"0\" cy=\"0\" rx=\"8\" ry=\"19\" fill=\"#ffffff\"/><path d=\"M0,14 L6,22 L-6,22 Z\" fill=\"#ffffff\"/><\/g><rect x=\"0\" y=\"196\" width=\"600\" height=\"50\" rx=\"9\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"18\" y=\"227\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\">4<\/text><text x=\"44\" y=\"217\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\">Power-driven heavier-than-air: aeroplanes, helicopters<\/text><text x=\"44\" y=\"235\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">Give way to all above, and to towing or slung-load aircraft.<\/text><g transform=\"translate(566 221) rotate(0) scale(0.85)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#ffffff\"/><\/g><rect x=\"0\" y=\"252\" width=\"600\" height=\"34\" rx=\"9\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"16\" y=\"274\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Same type?<\/text><text x=\"118\" y=\"274\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"400\">The one that has the other on its right gives way.<\/text><rect x=\"0\" y=\"292\" width=\"600\" height=\"34\" rx=\"9\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"16\" y=\"314\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Emergency?<\/text><text x=\"118\" y=\"314\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"400\">Every aircraft gives way to an aircraft in an emergency.<\/text><\/svg>", "cap": "CARs 602.19(1)(b) and (2). CARs 101.01 defines a hang glider as a glider."}, "approach": {"svg": "<svg viewBox=\"0 0 600 230\" role=\"img\" aria-label=\"Two aircraft approaching to land\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"600\" height=\"230\" rx=\"12\" fill=\"#0f1724\"/><rect x=\"400\" y=\"166\" width=\"190\" height=\"10\" fill=\"#3a352c\"/><text x=\"495\" y=\"194\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">Runway<\/text><path d=\"M20,30 L400,168\" stroke=\"#a8a39a\" stroke-width=\"1.4\" stroke-dasharray=\"3 5\"/><g transform=\"translate(120 66) rotate(110) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#d8b358\"/><\/g><text x=\"120\" y=\"40\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">Higher: gives way<\/text><g transform=\"translate(270 121) rotate(110) scale(1.0)\"><path d=\"M0,-15 L3,-5 L17,2 L17,5 L3,3 L2,10 L7,13 L7,15 L0,14 L-7,15 L-7,13 L-2,10 L-3,3 L-17,5 L-17,2 L-3,-5 Z\" fill=\"#ffffff\"/><\/g><text x=\"270\" y=\"155\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">Lower: has ess than 1,000 ft below (in 2 minutes).<\/text><text x=\"262\" y=\"204\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">Avoid the area below and behind.<\/text><\/svg>", "cap": "TC AIM AIR 2.9 and 2.9.1."}, "wind": {"svg": "<svg viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Wind and vortex drift near the runway\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"p1wg\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#d8b358\"/><\/marker><marker id=\"p1ww\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#ffffff\"/><\/marker><marker id=\"p1wk\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#7fd18b\"/><\/marker><marker id=\"p1wb\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#7fc3ff\"/><\/marker><marker id=\"p1wr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#f08c7a\"/><\/marker><\/defs><rect x=\"0\" y=\"0\" width=\"600\" height=\"104\" rx=\"12\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"24\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Calm wind<\/text><text x=\"14\" y=\"42\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\" font-weight=\"400\">Vortices spread out at about 5 kt.<\/text><rect x=\"250\" y=\"38\" width=\"330\" height=\"28\" fill=\"#3a352c\"/><text x=\"258\" y=\"56\" text-anchor=\"start\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans 26\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"46\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">1<\/text><text x=\"36\" y=\"46\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">BEFORE FLIGHT: switch at ARM; listen on 121.5<\/text><text x=\"588\" y=\"46\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">every flight<\/text><rect x=\"0\" y=\"60\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"80\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">2<\/text><text x=\"36\" y=\"80\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">AFTER LANDING: listen on 121.5 before shutdown<\/text><text x=\"588\" y=\"80\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">every flight<\/text><rect x=\"0\" y=\"94\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#d8b358\"/><text x=\"14\" y=\"114\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">3<\/text><text x=\"36\" y=\"114\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">CRASH: switch it ON as soon as practical<\/text><text x=\"588\" y=\"114\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">emergency<\/text><rect x=\"0\" y=\"128\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#d8b358\"/><text x=\"14\" y=\"148\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">4<\/text><text x=\"36\" y=\"148\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">LEAVE IT ON until you are found<\/text ker-start=\"url(#p1lw)\" marker-end=\"url(#p1lw)\"/><text x=\"406\" y=\"152\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\" font-weight=\"700\">200 ft<\/text><path d=\"M20,172 H383\" stroke=\"#7fd18b\" stroke-width=\"1.4\" marker-start=\"url(#p1lk)\" marker-end=\"url(#p1lk)\"/><text x=\"200\" y=\"190\" text-anchor=\"middle\" fill=\"#7fd18b\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Landing distance available (LDA)<\/text><text x=\"16\" y=\"30\" text-anchor=\"start\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">LAHSO: land and stop before the hold line.<\/text><text x=\"16\" y=\"48\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\">Hold line, red and white sign, flashing lights.<\/text><text x=\"16\" y=\"214\" text-anchor=\"start\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Not sure you can stop in the LDA? Decline the clearance.<\/text><\/svg>", "cap": "TC AIM RAC 4.4.9. Not to scale."}};
const GUIDE = {"name": "TP 11919 PSTAR study guide §1, §7, §11 (Transport Canada)", "url": "https://tc.canada.ca/en/aviation/publications/student-pilot-permit-private-pilot-licence-foreign-military-applicants-aviation-regulations-tp-11919"};
const LESSONS = [{"code": "P1.1", "title": "Collision Avoidance", "objectives": ["Use the **right-hand rule** when two aircraft converge at about the same altitude", "Know **who gives way to whom**: balloons, gliders, airships, towing and power-driven aircraft", "Know what to do **head-on**, when **overtaking**, and on **approach** to land", "Remember that the aircraft with the right of way must **still avoid a collision**"], "sections": [["Converging", [["The right-hand rule", ["Two aircraft **converging at about the same altitude**: the pilot who has the other aircraft **on its right gives way**.", "Memory hook: **traffic on your right has the right of way**."], "row_geom"], ["How to give way", ["**Don't pass over, under or ahead** of the other aircraft unless you are far enough away that there is no risk of collision.", "In practice: change heading and **pass behind it**."]], ["Right of way is not a free pass", ["If there is **any risk of collision**, the pilot with the right of way must **still act** to avoid it.", "An aircraft in an **emergency** gets the right of way from everyone."]]]], ["Who gives way to whom", [["The order", ["**Power-driven heavier-than-air** aircraft (aeroplanes, helicopters) give way to **airships, gliders and balloons**.", "**Airships** give way to **gliders and balloons**.", "**Gliders** give way to **balloons**.", "A **hang glider** is a glider in the CARs."], "row_order"], ["Towing and slung loads", ["**Power-driven** aircraft give way to an aircraft **seen towing** a glider or other object, or **carrying a slung load**.", "But a **towing aeroplane** still gives way to **gliders and balloons** (602.19(2)(a))."]], ["Same class?", ["Two aeroplanes, an aeroplane and a helicopter, or a jet and a Cessna are **all power-driven heavier-than-air**. Use the **right-hand rule**.", "Size and speed don't matter: a jet gets **no extra** right of way."]], ["Two balloons", ["Two balloons converging at **different altitudes**: the **higher** balloon gives way to the **lower** one."]]]], ["Head-on and overtaking", [["Head-on", ["Approaching **head-on** (or nearly) with a risk of collision: **each** pilot **alters heading to the right**."]], ["Overtaking", ["The aircraft **being overtaken** has the right of way.", "The overtaking aircraft, whether climbing, descending or level, **alters heading to the right**.", "It keeps giving way until it has **entirely passed and is clear**, even if the positions change."]]]], ["Landing traffic and other rules", [["Landing has priority", ["Aircraft **in flight or on the ground** give way to an aircraft **landing or about to land**."], "approach"], ["Two aircraft on approach", ["The **higher** aircraft gives way to the **lower** one.", "But the lower aircraft must **not overtake or cut in front** of a higher aircraft in the final stages of its approach."]], ["More CARs", ["No **reckless or negligent** flying that endangers anyone (602.01).", "Never fly **so close** to another aircraft that it creates a risk of collision (602.21).", "**Formation flight** only by **pre-arrangement** between the pilots-in-command, plus ATC inside a control zone (602.24)."]]]]], "summary": "When two aircraft converge at about the same altitude, the one with the other on its right gives way, and it must not pass over, under or ahead unless well clear. Type beats side: power-driven heavier-than-air aircraft give way to airships, gliders and balloons; airships give way to gliders and balloons; gliders give way to balloons; power-driven aircraft give way to aircraft towing or carrying a slung load. Head-on, both turn right. The overtaken aircraft has the right of way and the overtaking one turns right until clear. On approach, the higher aircraft gives way to the lower one, but the lower one must not cut in front. Everyone gives way to an aircraft in an emergency or landing, and the right-of-way pilot must still avoid a collision.", "selfcheck": [["Two aeroplanes converge at the same altitude. Who gives way?", "The one that has the other on its right."], ["When you give way, what must you not do?", "Pass over, under or ahead of the other aircraft, unless well clear."], ["Put in order, gives way most to least: balloon, aeroplane, glider, airship.", "Aeroplane, airship, glider, balloon."], ["Your aeroplane converges with an aircraft towing a glider. Who gives way?", "You do: power-driven aircraft give way to towing aircraft."], ["Head-on with a risk of collision: what does each pilot do?", "Alters heading to the right."], ["Who has the right of way when overtaking, and how does the other give way?", "The aircraft being overtaken. The overtaking aircraft alters heading to the right."], ["Two aircraft approaching to land at different altitudes: who gives way?", "The higher one. The lower one must not cut in front of it."], ["You have the right of way and a collision is likely. What must you do?", "Act to avoid the collision anyway."]], "practice": [["TP 11919 §1", "Collision Avoidance, questions 1.01–1.10"], ["TC AIM", "RAC 1.8 Collision Avoidance—Right of Way (CARs 602.19)"]], "reading": ["TC AIM RAC 1.8 (quotes CARs 602.19)", "TP 11919 §1 (free on the Transport Canada website)"]}, {"code": "P1.2", "title": "Wake Turbulence", "objectives": ["Explain **what makes** wake turbulence and **which aircraft** make the worst", "Describe how vortices **move**: they sink, drift with the wind and last for minutes", "Plan a **takeoff or landing** behind a heavier aircraft", "Know that **you**, the pilot, are responsible for avoiding it"], "sections": [["What it is", [["Wingtip vortices", ["Wake turbulence is caused by **wingtip vortices**, a **by-product of lift**.", "High-pressure air under the wing curls around the **wingtips** to the low pressure on top.", "The result: **two counter-rotating** spinning tubes of air behind the wings."], "vortex"], ["Who makes the worst", ["Strength depends on **wing shape, weight and speed**. **Weight** matters most.", "Worst: **heavy, clean** (gear and flaps up) **and slow**."]], ["What it can do", ["A vortex core can **roll** an aircraft at up to **80° per second**, about twice what some light aircraft can counter.", "Its **downdraft** (up to **1,500 ft per minute**) beats the climb rate of many aircraft.", "Short-wingspan aircraft are **less able** to fight the roll, even fast ones."]], ["Helicopters", ["Rotor blades make a **pair of trailing vortices**, like wingtip vortices. Helicopter wake is **potentially worse**: lower speeds make **more concentrated** wakes.", "The **heavier** the helicopter, the stronger the wake. It **spreads out**, **drifts with the wind**, and can be deadly to lighter aircraft **nearby and slightly below** its path."]]]], ["How vortices move", [["They sink", ["Vortices from large aircraft **sink 400 to 500 ft per minute**, then level off: **less than 1,000 ft** below in 2 minutes.", "So **avoid the area below and behind** other aircraft.", "**1,000 ft** of vertical separation from an aircraft in level flight: little effect."]], ["They last", ["At altitude they barely weaken for about **2 minutes**. After that they start to break up, one vortex and then the other.", "**Turbulent** air breaks them up faster. **Calm** air lets them linger."]], ["Near the ground", ["Below about **200 ft AGL** they drift sideways and **can come back**. Below 100 ft they break up faster.", "They spread out at about **5 kt**.", "A **light crosswind (3 to 7 kt)** can hold the **upwind vortex** in the touchdown zone. A **tailwind** can push vortices **forward** into the touchdown zone."], "wind"]]], ["Takeoff and landing", [["Where it starts and stops", ["A departing aircraft starts making wake at **rotation** (nosewheel lifts off). It is **most severe just after** the rotation point.", "A landing aircraft stops making wake when its **nosewheel touches down**."], "runway_wake"], ["Taking off", ["Behind a **departing** large aircraft: lift off **before its rotation point**, then **stay above** its climb path or ask for a turn away from it.", "Behind a **landing** large aircraft: lift off **after its touchdown point**."]], ["Landing", ["Behind a **landing** large aircraft: stay **at or above its approach path** and land **beyond its touchdown point**.", "Behind a **departing** large aircraft: touch down **before its rotation point**.", "Most dangerous encounters happen in the **last half mile of final**."]], ["Can't do it?", ["On the ground: **WAIT**. About **2 minutes** is usually enough.", "On approach: **go around** for another try.", "On the ground, before crossing a runway a large aircraft just used, **wait a few minutes**."]]]], ["Your responsibility", [["ATC's warning", ["ATC may say \"**CAUTION – WAKE TURBULENCE**\".", "Avoiding it is still **the pilot's responsibility**."]], ["En route", ["Avoid flying **below and behind** a large aircraft.", "Meeting or overtaking one on the same track? Move **sideways, preferably upwind**."]]]]], "summary": "Wake turbulence comes from wingtip vortices, a by-product of lift: two counter-rotating vortices behind the wings. Weight matters most; the worst wake comes from a heavy, clean, slow aircraft, and helicopters can be worse because they are slow. Vortices sink 400 to 500 ft per minute to less than 1,000 ft below, barely weaken for 2 minutes, drift about 5 kt near the ground, and a light crosswind can hold one in the touchdown zone. Wake starts at rotation and ends at nosewheel touchdown. Behind a departing heavy, lift off before its rotation point and stay above; behind a landing heavy, stay above its path and land beyond its touchdown point. If you can't, wait about 2 minutes or go around. ATC may warn you, but avoiding wake is the pilot's job.", "selfcheck": [["What causes wake turbulence?", "Wingtip vortices, a by-product of lift."], ["Which factor matters most for vortex strength?", "Weight."], ["Which aircraft makes the worst wake?", "Heavy, clean and slow."], ["How do vortices from a large aircraft move after forming?", "They sink 400–500 ft/min and level off less than 1,000 ft below."], ["When does a departing aircraft start making wake?", "At rotation, when the nosewheel lifts off."], ["Taking off behind a departing heavy: plan?", "Lift off before its rotation point and stay above its path."], ["Landing behind a landing heavy: plan?", "Stay at or above its approach path and land beyond its touchdown point."], ["ATC says \"caution – wake turbulence\". Whose job is it to avoid it?", "The pilot's."]], "practice": [["TP 11919 §7", "Wake Turbulence, questions 7.01–7.15 (7.07 removed)"], ["TC AIM", "AIR 2.9 Wake Turbulence"]], "reading": ["TC AIM AIR 2.9 Wake Turbulence", "TP 11919 §7"]}, {"code": "P1.3", "title": "Aircraft Operations", "objectives": ["Use your **ELT** correctly: in an emergency, when testing, after landing, and after an accidental activation", "Follow the rules for **starting and running engines** with no one at the controls", "Decide safely about **thunderstorms** near the airport", "Know the **jet blast** danger distances and how **land and hold short** operations work"], "sections": [["The ELT", [["What it is", ["An **emergency locator transmitter** sends a signal so search and rescue can find you.", "Frequencies: **121.5, 243 or 406 MHz**. Satellites detect a **406 MHz** ELT and relay its position. There is **no satellite detection** of 121.5 MHz."]], ["In an emergency", ["After a crash, switch it **ON as soon as possible**, if you can. Don't wait for your flight plan time to run out.", "**Don't** switch it off and on to save the battery. Leave it **ON until you are found**."]], ["Every flight", ["Before flight: switch at **ARM**, battery not expired, and **listen on 121.5 MHz** to make sure it isn't transmitting.", "**After landing**: **listen on 121.5 MHz** before you shut down. Hear an ELT and yours isn't OFF? **Switch yours off** and report it."], "elt"], ["Testing", ["Activating an ELT is allowed **only in an emergency**, except for a test.", "Test a 121.5 MHz ELT only in the **first 5 minutes of any hour UTC**, for **5 seconds or less**."]], ["Accidental activation", ["Tell the **nearest ATS unit** (or community aerodrome radio station, or a **JRCC**) as soon as you can, and **switch it off**.", "Reporting it right away stops an unneeded search."]]]], ["On the ramp", [["Starting an engine", ["Only with a **competent person in a pilot's seat**, or with the aircraft secured so it **can't move**."]], ["Leaving it running", ["Only if a **competent person is in a pilot's seat**.", "Or, with **no one on board**: the aircraft is secured so it can't move **and is not left unattended**."]], ["Jet blast", ["Danger area behind a jet, **ground idle → take-off thrust**:", "**Executive jet** 200 ft → 500 ft · **Medium jet** 450 ft → 1,200 ft · **Jumbo jet** 600 ft → 1,600 ft.", "Newer engines are bigger, so some distances may need to be **much larger**."], "blast"], ["Propeller blast", ["Behind a **large turboprop taxiing**: about **45 kt** of wind at 60 ft, **36 kt** at 80–100 ft, **28 kt** at 120–140 ft.", "Light **high-wing** aircraft with **narrow landing gear** are **more at risk** than heavier low-wing, wide-gear aircraft."]]]], ["Thunderstorms", [["Takeoff and landing", ["**Don't take off or land** when a thunderstorm is **approaching**.", "Why: a sudden **wind shift** at its **gust front**, or low-level turbulence, could cause **loss of control**."]], ["A storm near your destination", ["The cloud you see is only part of it. Its updrafts and downdrafts often reach **far beyond** it, and severe turbulence can extend up to **20 NM** from a severe storm.", "Expect **wind shifts and turbulence** on approach, even outside the cloud. **Stay well clear** until it has passed the airport."]], ["Never", ["Never fly **under** a thunderstorm, even if you can see through to the other side.", "Lightning can strike in **clear air** near a storm. Don't **refuel** with thunderstorms nearby."]]]], ["Intersecting runways", [["Two kinds", ["ATC can use intersecting runways **one after the other** (sequential) or **at the same time** (simultaneous). ATC advisories say which.", "**Simultaneous** operations need **one aircraft** to accept a clearance to **land and hold short** (LAHSO)."], "lahso"], ["Land and hold short", ["You must **stop before the hold line**: **200 ft** before the edge of the intersecting runway. It has hold lines, red and white signs and, where installed, flashing lights.", "Accept only if you are sure you can **stop in the landing distance available**.", "The **pilot-in-command** decides, and **must decline** if it isn't safe. Not sure you can comply? **Tell ATC right away**."]], ["When there is no LAHSO", ["Wet or contaminated runway, any precipitation, thunderstorms, turbulence or wind shear.", "Ceiling below **1,000 ft** or visibility below **3 SM**."]]]]], "summary": "The ELT (121.5, 243 or 406 MHz; satellites only detect 406) goes ON as soon as possible after a crash and stays on until you are found. Activate it only in an emergency or to test a 121.5 MHz ELT in the first 5 minutes of the hour UTC, for 5 seconds or less. Listen on 121.5 MHz after landing, and report an accidental activation to the nearest ATS unit or a JRCC and switch it off. Start an engine only with a competent person in a pilot's seat or the aircraft secured so it can't move; with no one on board, a running engine also needs the aircraft attended. Don't take off or land with a thunderstorm approaching; its gust front can cause loss of control. Jet blast danger areas, idle to take-off: executive 200–500 ft, medium 450–1,200 ft, jumbo 600–1,600 ft. On intersecting runways, simultaneous operations need a LAHSO clearance: stop before the hold line, 200 ft from the other runway, and decline if you can't.", "selfcheck": [["After a crash, when do you switch the ELT on, and for how long?", "As soon as possible, and leave it on until you are found."], ["When may you test a 121.5 MHz ELT, and for how long?", const KEY = 'safapp-cornell-pstar1';
let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const $ = id => document.getElementById(id);
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let cur = store.last && LESSONS.some(l => l.code === store.last) ? store.last : LESSONS[0].code;
let studying = false;

function tabs() {
  $('tabs').innerHTML = '';
  LESSONS.forEach(L => {
    const b = document.createElement('button'); b.className = 'tab';
    b.setAttribute('aria-pressed', L.code === cur); b.textContent = L.code + ' ' + L.title;
    b.onclick = () => { cur = L.code; store.last = cur; save(); tabs(); render(); document.getElementById('scroller').scrollTo(0, 0); };
    $('tabs').appendChild(b);
  });
}
function render() {
  const L = LESSONS.find(l => l.code === cur);
  let h = `<div style="display:flex;flex-direction:column;gap:18px">
  <div class="title"><span class="code">${L.code}</span><span class="name">${esc(L.title)}</span><span class="kind">CORNELL NOTES</span></div>
  <div class="panel goldleft"><h3>By the end of this lesson you can</h3><ul class="b">${L.objectives.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>
  <div class="toolbar">
    <label class="switch" for="study"><input type="checkbox" id="study" ${studying ? 'checked' : ''}> Study mode: hide the notes</label>
    <span class="hint" id="hint">${studying ? 'Answer each cue in your head, then tap the notes to check.' : 'Turn on study mode to quiz yourself with the cues.'}</span>
  </div>
  <div class="cornell ${studying ? 'studying' : ''}" id="cornell">
    <div class="colhead"><div>CUES / QUESTIONS</div><div>NOTES</div></div>`;
  L.sections.forEach(([head, rows]) => {
    h += `<div class="sec">${esc(head)}</div>`;
    rows.forEach(([cue, notes, fig]) => {
      h += `<div class="row"><div class="cue">${md(cue)}</div><div class="note"><div class="content"><ul class="b">${notes.map(n => `<li>${md(n)}</li>`).join('')}</ul>${fig && FIGS[fig] ? `<figure class="fig">${FIGS[fig].svg}<figcaption>${md(FIGS[fig].cap)}</figcaption></figure>` : ''}</div><button class="reveal" aria-label="Show notes"><span>Tap to check</span></button></div></div>`;
    });
  });
  h += `</div>
  <div class="summary"><h3>Summary</h3>
    <label for="mine" style="font-weight:600">In my own words</label>
    <textarea id="mine" placeholder="Write the big ideas of this lesson in 3–4 sentences without looking at the notes.">${esc((store.mine || {})[L.code] || '')}</textarea>
    <span class="saved" id="saved" hidden>Saved on this device</span>
    <div class="model"><button class="cmp" id="cmp" type="button">Compare with the model summary</button><span class="hint" id="cmpHint">Write at least 30 characters first.</span><p style="margin:0" id="model" hidden>${md(L.summary)}</p></div></div>
  <div class="panel"><h3>Self-check</h3><div class="qa">${L.selfcheck.map(([q, a], i) => `<div class="q"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span><span class="a" hidden>${esc(a)}</span><button data-i="${i}">Show answer</button></div>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Exam practice</h3><span class="hint">Official guide: <a href="${GUIDE.url}" target="_blank" rel="noopener">${esc(GUIDE.name)}</a></span><ul class="b">${L.practice.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>Required reading — next class</h3><ul class="b">${L.reading.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  </div></div>`;
  $('lesson').innerHTML = h;
  $('study').onchange = e => { studying = e.target.checked; render(); };
  document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => { if (studying) n.classList.add('shown'); }));
  document.querySelectorAll('.q button').forEach(b => b.onclick = () => { const a = b.previousElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; });
  let t; $('mine').oninput = e => { clearTimeout(t); t = setTimeout(() => { store.mine = store.mine || {}; store.mine[L.code] = e.target.value; save(); $('saved').hidden = false; }, 500); };
  const gate = () => { const ok = $('mine').value.trim().length >= 30; $('cmp').disabled = !ok; $('cmpHint').hidden = ok; };
  $('mine').addEventListener('input', gate); gate();
  $('cmp').onclick = () => { if ($('cmp').disabled) return; $('model').hidden = false; $('cmp').hidden = true; };
}
tabs(); render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "pstar1-notes", "unit": 1, "kind": "notes"};
  const run = window.google && google.script && google.script.run;
  const sent = {};
  let who = ''; try { who = localStorage.getItem('safa-who') || ''; } catch (e) {}
  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();
  function askName() {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };
    document.body.appendChild(b);
  }
  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
  if (typeof render === 'function') { const _r = render; render = function () { _r.apply(this, arguments); try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }; try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }
  document.addEventListener('change', e => { if (e.target && e.target.id === 'study' && e.target.checked) T('notes', {l: cur, a: 'study'}, 6e5); });
  let st_; document.addEventListener('input', e => { if (e.target && e.target.id === 'mine' && e.target.value.trim().length >= 30) { clearTimeout(st_); st_ = setTimeout(() => T('notes', {l: cur, a: 'summary'}, 6e5), 1500); } });
})();
</script>
