<style>
:root{
  --bg:#000; --panel:#121110; --cue:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
header img{width:84px;flex:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);line-height:1.15;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px}
.title .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--gold);line-height:1}
.title .name{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;text-transform:uppercase}
.title .kind{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.goldleft{border-left:4px solid var(--gold)}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.b li{position:relative;padding-left:18px}
ul.b li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:13px;top:1px}
b{font-weight:700}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.hint{font-size:13px;color:var(--muted)}
.cornell{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.colhead{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:2px solid var(--gold)}
.colhead div{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--gold)}
.sec{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px}
.row{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cue{background:var(--cue);color:var(--gold);font-weight:700;padding:12px 14px;border-right:2px solid var(--gold);min-width:0}
.note{padding:12px 16px;min-width:0;position:relative}
.note ul.b li{line-height:1.45}
.studying .note .content{filter:blur(7px);opacity:.55;user-select:none;transition:filter .25s,opacity .25s}
.studying .note.shown .content{filter:none;opacity:1;user-select:auto}
.reveal{display:none}
.studying .note:not(.shown) .reveal{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;width:100%}
.reveal span{background:#000;border:1px solid var(--gold);border-radius:99px;padding:6px 14px}
.summary{border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
textarea{width:100%;min-height:96px;resize:vertical;background:#1b1915;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.saved{font-size:13px;color:#7fc48a}
.qa{display:flex;flex-direction:column;gap:8px}
.q{background:#17150f;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.q .n{font-family:var(--display);font-weight:700;color:var(--gold)}
.q .a{grid-column:2;color:var(--gold)}
.q button{grid-column:2;justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:12px;font-weight:600;cursor:pointer}
.q button:hover{border-color:var(--gold);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand img{width:60px}
.tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){
  .row,.colhead{grid-template-columns:1fr}
  .cue{border-right:0;border-bottom:1px solid var(--gold);padding:10px 14px}
  .colhead div:last-child{display:none}
  .grid2{grid-template-columns:1fr}
  .title .kind{margin-left:0;width:100%}
}
@media print{body{background:#fff;color:#000}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}
header img{width:62px!important}

.fig{margin:10px 0 2px;background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;overflow-y:hidden}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.model{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cmp{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.cmp:disabled{background:var(--line);color:var(--muted);cursor:default}
.panel a{color:var(--gold)}
</style>

=\"114\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">a permanent change<\/text><rect x=\"0\" y=\"128\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"148\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">4<\/text><text x=\"36\" y=\"148\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">YY MM DD HH MM<\/text><text x=\"588\" y=\"148\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">every NOTAM time is UTC<\/text><\/svg>", "cap": "TC AIM MAP 3.2.3.4. 2611051800 = 2026, Nov 5, 1800 UTC."}, "fail": {"svg": "<svg viewBox=\"0 0 640 260\" role=\"img\" aria-label=\"VFR radio failure procedure\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"150\" y=\"0\" width=\"340\" height=\"40\" rx=\"10\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"320\" y=\"25\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"800\">Two-way radio fails, VFR, Class B, C or D<\/text><path d=\"M320 40 V56 M100 56 H540 M100 56 V66 M320 56 V66 M540 56 V66\" stroke=\"#d8b358\" stroke-width=\"2\" fill=\"none\"/><rect x=\"0\" y=\"66\" width=\"200\" height=\"66\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"100\" y=\"88\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">In a control zone<\/text><text x=\"100\" y=\"108\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Land at its aerodrome<\/text><rect x=\"220\" y=\"66\" width=\"200\" height=\"66\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"320\" y=\"88\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">Other B, C or D airspace<\/text><text x=\"320\" y=\"108\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Leave by the shortest route<\/text><rect x=\"440\" y=\"66\" width=\"200\" height=\"66\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"540\" y=\"88\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"800\">Failed outside, need in?<\/text><text x=\"540\" y=\"108\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">No suitable aerodrome near:<\/text><text x=\"540\" y=\"125\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">may enter VFR, land or leave<\/text><path d=\"M100 132 V146 M320 132 V146 M540 132 V146 M100 146 H540 M320 146 V156\" stroke=\"#d8b358\" stroke-width=\"2\" fill=\"none\"/><rect x=\"20\" y=\"156\" width=\"600\" height=\"48\" rx=\"10\" fill=\"#3a2a12\" stroke=\"#d8b358\"/><text x=\"320\" y=\"176\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Every case: squawk 7600 · tell ATC as soon as possible<\/text><text x=\"320\" y=\"195\" text-anchor=\"middle\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">A phone is OK after the normal steps (squawk 7600 first). Numbers are in the CFS.<\/text><text x=\"0\" y=\"228\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\"><tspan fill=\"#d8b358\" font-weight=\"700\">Landing at a towered airport?<\/tspan> Join from the upwind side and watch the tower for light signals.<\/text><text x=\"0\" y=\"250\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\"><tspan fill=\"#d8b358\" font-weight=\"700\">Acknowledge signals:<\/tspan> rock the wings by day · one flash of the landing light at night.<\/text><\/svg>", "cap": "CAR 602.138; TC AIM RAC 4.4.5, 4.4.7, 4.4.8; COM 1.7."}, "codes": {"svg": "<svg viewBox=\"0 0 640 114\" role=\"img\" aria-label=\"Transponder codes\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"100\" height=\"84\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\" stroke-width=\"1.4\"/><text x=\"50.0\" y=\"32\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"22\" font-weight=\"700\">1200<\/text><text x=\"50.0\" y=\"54\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">VFR, at or<\/text><text x=\"50.0\" y=\"70\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">below 12,500 ft<\/text><rect x=\"108\" y=\"0\" width=\"100\" height=\"84\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\" stroke-width=\"1.4\"/><text x=\"158.0\" y=\"32\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"22\" font-weight=\"700\">1400<\/text><text x=\"158.0\" y=\"54\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">VFR, above<\/text><text x=\"158.0\" y=\"70\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">12,500 ft ASL<\/text><rect x=\"216\" y=\"0\" width=\"100\" height=\"84\" rx=\"10\" fill=\"#1b1915\" stroke=\"#2e2a23\" stroke-width=\"1.4\"/><text x=\"266.0\" y=\"32\" text-anchor=\"middle\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"22\" font-weight=\"700\">1202<\/text><text x=\"266.0\" y=\"54\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">Gliders<\/text><rect x=\"324\" y=\"0\" width=\"100\" height=\"84\" rx=\"10\" fill=\"#3b1a14\" stroke=\"#f08c7a\" stroke-width=\"1.4\"/><text x=\"374.0\" y=\"32\" text-anchor=\"middle\" fill=\"#f08c7a\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"22\" font-weight=\"700\">7500<\/text><text x=\"374.0\" y=\"54\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">Unlawful<\/text><text x=\"374.0\" y=\"70\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">interference<\/text><rect x=\"432\" y=\"0\" width=\"100\" height=\"84\" rx=\"10\" fill=\"#3b1a14\" stroke=\"#f08c7a\" stroke-width=\"1.4\"/><text x=\"482.0\" y=\"32\" text-anchor=\"middle\" fill=\"#f08c7a\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"22\" font-weight=\"700\">7600<\/text><text x=\"482.0\" y=\"54\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">Radio<\/text><text x=\"482.0\" y=\"70\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">failure<\/text><rect x=\"540\" y=\"0\" width=\"100\" height=\"84\" rx=\"10\" fill=\"#3b1a14\" stroke=\"#f08c7a\" stroke-width=\"1.4\"/><text x=\"590.0\" y=\"32\" text-anchor=\"middle\" fill=\"#f08c7a\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"22\" font-weight=\"700\">7700<\/text><text x=\"590.0\" y=\"54\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11\" font-weight=\"600\">Emergency<\/text><text x=\"0\" y=\"106\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\">Use these unless ATS gives you a code. Red = sets off an alarm for ATC.<\/text><\/svg>", "cap": "TC AIM COM 8.2 (note 2), 8.4, 8.6–8.8."}, "xpdr": {"svg": "<svg viewBox=\"0 0 600 230\" role=\"img\" aria-label=\"Using the transponder\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">Using the transponder<\/text><rect x=\"0\" y=\"26\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"46\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">1<\/text><text x=\"36\" y=\"46\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">STANDBY<\/text><text x=\"588\" y=\"46\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">while you taxi<\/text><rect x=\"0\" y=\"60\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"80\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">2<\/text><text x=\"36\" y=\"80\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">ON (ALT)<\/text><text x=\"588\" y=\"80\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">as late as practical: entering the runway<\/text><rect x=\"0\" y=\"94\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"114\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">3<\/text><text x=\"36\" y=\"114\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">STANDBY or OFF<\/text><text x=\"588\" y=\"114\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">as soon as you exit the runway<\/text><rect x=\"0\" y=\"128\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#d8b358\"/><text x=\"14\" y=\"148\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">4<\/text><text x=\"36\" y=\"148\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">1700 → 1100 → 7100<\/text><text x=\"588\" y=\"148\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">never pass through 7500, 7600, 7700<\/text><rect x=\"0\" y=\"162\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"182\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">5<\/text><text x=\"36\" y=\"182\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">NOT STANDBY<\/text><text x=\"588\" y=\"182\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">while you change codes<\/text><rect x=\"0\" y=\"196\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"216\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">6<\/text><text x=\"36\" y=\"216\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">IDENT<\/text><text x=\"588\" y=\"216\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">only when ATS asks<\/text><\/svg>", "cap": "TC AIM COM 8.1 and 8.5. Some airports (noted in the CFS) want it on the whole time on the manoeuvring area."}, "elt": {"svg": "<svg viewBox=\"0 0 600 264\" role=\"img\" aria-label=\"ELTs and 121.5 MHz\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"0\" y=\"16\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\">ELTs and 121.5 MHz<\/text><rect x=\"0\" y=\"26\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"46\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">1<\/text><text x=\"36\" y=\"46\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">121.5 · 243 · 406 MHz<\/text><text x=\"588\" y=\"46\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">ELT frequencies<\/text><rect x=\"0\" y=\"60\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"80\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">2<\/text><text x=\"36\" y=\"80\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">406 MHz<\/text><text x=\"588\" y=\"80\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">the only one satellites detect<\/text><rect x=\"0\" y=\"94\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#d8b358\"/><text x=\"14\" y=\"114\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">3<\/text><text x=\"36\" y=\"114\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">LISTEN ON 121.5<\/text><text x=\"588\" y=\"114\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">after every flight: is yours on?<\/text><rect x=\"0\" y=\"128\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#d8b358\"/><text x=\"14\" y=\"148\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">4<\/text><text x=\"36\" y=\"148\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">HEARD ONE?<\/text><text x=\"588\" y=\"148\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">tell the nearest ATS unit<\/text><rect x=\"0\" y=\"162\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"182\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">5<\/text><text x=\"36\" y=\"182\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">WHERE · WHEN · HOW STRONG<\/text><text x=\"588\" y=\"182\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">first heard, lost, stopped or faded<\/text><rect x=\"0\" y=\"196\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"216\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">6<\/text><text x=\"36\" y=\"216\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">SET OFF BY MISTAKE?<\/text><text x=\"588\" y=\"216\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">switch off + report to nearest ATS<\/text><rect x=\"0\" y=\"230\" width=\"600\" height=\"30\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"14\" y=\"250\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">7<\/text><text x=\"36\" y=\"250\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"600\">TEST A 121.5 ELT<\/text><text x=\"588\" y=\"250\" text-anchor=\"end\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"11.5\">first 5 min of a UTC hour, 5 s max<\/text><\/svg>", "cap": "TC AIM SAR 3.1, 3.4, 3.7, 3.8."}};
const GUIDE = {"name": "TP 11919 PSTAR study guide · Section 3 Communications", "url": "https://tc.canada.ca/en/aviation/publications/student-pilot-permit-private-pilot-licence-foreign-military-applicants-aviation-regulations-tp-11919"};
const LESSONS = [{"code": "P5.1", "title": "Radio Procedures & Frequencies", "objectives": ["Pick the right **frequency** at every stage: ATIS, ground, tower, 126.7, MF or ATF, 121.5", "Make the right calls at **uncontrolled aerodromes** (MF and ATF)", "Follow **tower** procedures: taxi, hold short, immediate takeoff, clock traffic, landing", "Know what **FSSs**, **FICs** and **NOTAMs** give you"], "sections": [["Start here", [["Already in ROC-A", ["Phonetics, numbers, call signs, radio checks, circuit calls and readbacks: **ROC-A Part 2**. MAYDAY and PAN PAN: **ROC-A Part 3**.", "PSTAR asks about them too. The must-knows are below."]], ["Call signs", ["First call: your **full** call sign, type plus registration: \"Cessna **Foxtrot Alfa Bravo Charlie**\".", "Shorten it to the last three letters (\"**Alfa Bravo Charlie**\") only **after ATS** shortens it."]], ["Readability", ["**1** bad (unreadable) · **2** poor (readable now and then) · **3** fair (readable with difficulty) · **4** good · **5** excellent (perfectly readable)."]]]], ["Which frequency, where?", [["The big picture", ["**ATIS** → **Ground** (taxi) → **Tower** (takeoff and the control zone) → **126.7** en route → the **MF or ATF** at an uncontrolled aerodrome.", "**121.5** is the emergency frequency."], "route"], ["126.7 MHz", ["VFR en route in **uncontrolled airspace** (when not on an MF or ATF), or VFR on an airway: **monitor 126.7** the whole time.", "When you can, **broadcast** your identification, position, altitude and intentions. Not mandatory, but encouraged."]], ["121.5 MHz", ["The **emergency** frequency. Monitor it over **sparsely settled areas** (and over water more than 50 NM from shore) when you can.", "Of the ATS units, only **towers and FSSs** have 121.5, and only during their hours. RCOs don't.", "Emergency with no ATS in range? Broadcast on **121.5 or 126.7, or both**, for help from other pilots."]]]], ["ATIS", [["What it is", ["A **recorded broadcast** of routine airport information on its own frequency.", "Why: it frees controllers and **cuts frequency congestion**."], "atis"], ["What's in it", ["Airport name and **code letter**, weather (wind, visibility, sky, temperature, dew point), **altimeter**, approach type, **runways**, and NOTAMs."]], ["Your first call", ["Listen **before** you call. Then repeat the code letter: \"…**with Bravo**\".", "No ATIS mentioned? The controller gives you the runway, wind and altimeter instead."]]]], ["Uncontrolled aerodromes: MF and ATF", [["MF (mandatory frequency)", ["Used at **selected busier** uncontrolled aerodromes. In the MF area you **must** have a working two-way radio (a few no-radio exceptions exist).", "The frequency, distance and altitude are in the **CFS**, e.g. \"MF—rdo 122.2 5 NM 3100 ASL\"."], "mfatf"], ["ATF (aerodrome traffic frequency)", ["At other active uncontrolled aerodromes. Normally the **UNICOM** frequency, or **123.2 MHz** where there is no UNICOM."]], ["Who you talk to", ["A ground station is operating (FSS, RCO, CARS, UNICOM)? **Direct** your reports to it: \"Fredericton **Radio**, this is…\".", "No station, or no answer? **Broadcast**: \"Fredericton **Traffic**, this is…\"."]], ["Calls to remember", ["Arriving: report **before you enter** the area, at least **5 minutes** before when you can.", "Departing: report leaving the circuit, then **keep listening on the MF or ATF until you are clear of the area**.", "\"Any traffic in the area, please advise\" is **not** standard. Other traffic should answer without being asked."]]]], ["Flight service: FSS and FIC", [["FSS (flight service station)", ["Gives **aerodrome advisories** on the MF: runway, wind, traffic, vehicles, weather.", "Call it \"**(place) Radio**\". Already have runway, wind and altimeter from the last advisory? Say \"**have numbers**\"."], "fssfic"], ["FIC (flight information centre)", ["En route on the **FISE** frequency, through an RCO: **weather**, **NOTAMs**, relays ATC clearances, takes **position reports** and PIREPs. **No traffic information.**", "Position reports to a FIC are **recorded**, ready for search and rescue.", "Briefings and flight plans by phone: **1-866-WXBRIEF**."]]]], ["At a controlled airport", [["Arriving", ["Call the tower **before** the control zone, at least **5 minutes** before if you can.", "Report **downwind**: the tower answers with your **number** in the landing sequence and who to follow."], "tower"], ["Landing clearance", ["Normally given on **final**. **No clearance? Pull up and go around** (unless it's an emergency).", "Acknowledge it with your **call sign**, never just \"roger\" or \"wilco\". Add the runway too: \"Cleared to land runway 27, Alfa Bravo Charlie\". From 19 Nov 2026 the CARs require runway readbacks.", "A turn-off comes with it (\"turn left at Charlie\")? Acknowledging means you **accept**, so you must do it. Can't? **Tell ATC right away**, then exit at the next turn-off you can make safely."]], ["Taxiing", ["Ask **Ground** for taxi. A normal taxi clearance takes you to the **holding position** for your runway. It never lets you enter or cross a runway.", "No clearance to cross a runway on the way? **Hold short and ask.** Told to hold short? **Read it back.**"]], ["Taking off and leaving", ["\"Cleared for **immediate** takeoff\": taxi onto the runway and take off in **one continuous movement**. Can't? **Refuse** it.", "VFR flights stay on tower frequency **inside the control zone**. Once clear, you may change without asking (monitoring tower until 10 NM from the zone is recommended)."]], ["Traffic by the clock", ["\"Traffic, **two o'clock**, 3 miles\": 12 o'clock is your **track** over the ground, not your nose. Each hour is **30°**, so 2 o'clock is 60° right.", "In a strong crosswind your nose points off your track, so traffic may look a little off from where ATC said."], "clock"]]], ["NOTAMs", [["What and where", ["A **NOTAM** is a notice about a new or changed facility, service, procedure or hazard.", "Get them from a **FIC** (briefing or in flight), an **FSS**, or the **NAV CANADA website**. Review them **before every flight**."]], ["How they end", ["A **fixed end time**: the NOTAM **expires by itself** at that time.", "**EST** = estimated. The NOTAM **stays in force** until it is **replaced or cancelled**.", "**PERM** = a permanent change. All NOTAM times are **UTC**."], "notam"]]]], "summary": "Listen to ATIS first and say its code letter on your first call (\"with Bravo\"). Use Ground to taxi and Tower for takeoff, landing and the whole control zone. En route in uncontrolled airspace, monitor 126.7 and broadcast when you can. At an uncontrolled aerodrome use the MF (radio required) or ATF (UNICOM, or 123.2) listed in the CFS: talk to the station if one is operating, otherwise broadcast. Report before you enter and listen until you are clear. 121.5 is for emergencies. A taxi clearance stops at your runway's holding position; read back hold-short. Immediate takeoff means one continuous movement. FICs give weather and NOTAMs but no traffic. A NOTAM marked EST stays in force until it is replaced or cancelled.", "selfcheck": [["ATIS is \"Information Delta\". What do you say on your first call?", "\"…with Delta\" (the code letter)."], ["VFR en route in uncontrolled airspace: which frequency do you monitor?", "126.7 MHz."], ["MF or ATF: which one requires a working two-way radio?", "The MF."], ["What is the ATF where there is no UNICOM?", "123.2 MHz."], ["The MF ground station is closed. How do you make your reports?", "Broadcast them: \"(place) Traffic, this is…\"."], ["A taxi clearance has no hold-short. How far may you go?", "To the holding position of your runway. No entering or crossing runways."], ["What does \"cleared for immediate takeoff\" require?", "Taxi on and take off in one continuous movement, or refuse it."], ["What does EST mean at the end of a NOTAM?", "The end time is estimated. It stays in force until replaced or cancelled."]], "practice": [["TP 11919 (PSTAR)", "§3 Communications, questions 3.01–3.17 and 3.21–3.29"], ["TC AIM", "RAC 1.1.2, 1.3, 1.5.3, 1.6, 4.2.5–4.2.9, 4.4.1–4.4.3, 4.5, 5.1 · COM 1.4.2 · MAP 3"]], "reading": ["TC AIM RAC 1.3 (ATIS), 4.5 (uncontrolled aerodromes), 5.1 (126.7)", "TC AIM RAC 4.2 and 4.4 (controlled aerodromes)", "ROC-A Part 2 (Speaking on the Radio)"]}, {"code": "P5.2", "title": "Communication Failure & Transponders", "objectives": ["Follow the **VFR radio-failure** procedure in and around controlled airspace", "Set the right **transponder code** and use the transponder correctly", "Use **121.5** and your **ELT** correctly, and report an ELT you hear", "Know when to use **MAYDAY**, **PAN PAN** and **7700**"], "sections": [["When the radio quits (VFR)", [["In Class B, C or D (CAR 602.138)", ["1 **Leave** the airspace: in a **control zone**, by **landing** at its aerodrome; anywhere else, by the **shortest route**.", "2 **Squawk 7600** if you have a transponder.", "3 **Tell ATC** as soon as possible what you did."], "fail"], ["It fails outside, and you need to get in", ["No suitable aerodrome nearby? You **may enter**, stay **VFR**, and land or leave as above.", "Want to land at a towered airport nearby? TC recommends the **NORDO arrival**: join from the **upwind side**, crosswind at circuit height, then downwind."]], ["Class E or G", ["The rule is written for B, C and D, but you **may** follow the same steps anywhere."]]]], ["Light signals and phones", [["Watch the tower", ["Stay alert for **light signals** from the tower (their meanings are in PSTAR Part 2).", "No landing clearance on final? **Go around.**", "Acknowledge in flight: **rock the wings** by day, **one flash of the landing light** at night."]], ["Using a phone", ["Only **after** the normal radio-failure steps. **Squawk 7600 first**, then call the ATS unit by cell or satellite phone.", "The phone numbers are in the **CFS**."]]]], ["Transponders", [["What it does", ["Answers ATS radar with a **four-digit code**. **Mode C** adds your **altitude**: keep it on in Canada unless ATS says otherwise.", "Press **IDENT** only when ATS asks."]], ["VFR codes", ["**1200** at or below 12,500 ft ASL · **1400** above 12,500 ft ASL · **1202** gliders.", "Unless ATS assigns a code. When you leave the airspace that code was for, go back to 1200 (or 1400)."], "codes"], ["Alarm codes", ["**7500** unlawful interference · **7600** radio failure · **7700** emergency, when you can't reach ATC right away.", "Each one sets off an **alarm** for ATC. With 7700, contact ATC as soon as you can."]], ["Using it on the ground", ["**STANDBY** while taxiing. **ON** as late as practical before takeoff (entering the runway). **STANDBY or OFF** once off the runway after landing.", "Some airports (noted in the CFS) want it on the whole time you're on the manoeuvring area."], "xpdr"], ["Changing codes", ["Don't pass through 7500, 7600 or 7700. From 1700 to 7100, go **1700 → 1100 → 7100**, not through 7700.", "Don't switch to STANDBY while you change: your target disappears from ATC's screen."]], ["Rules and ATC words", ["Required in **Class A, B and C**, and Class D or E marked as transponder airspace (including Class E from 10,000 to 12,500 ft ASL within radar coverage).", "Fails where it's required? You may continue to your **next airport of intended landing**.", "**SQUAWK (code)** = set it · **SQUAWK IDENT** = press IDENT · **SQUAWK MODE CHARLIE** = turn on altitude. Follow ATC's transponder instructions until they change them or you land."]]]], ["ELTs and emergencies", [["ELT basics", ["An **ELT** (emergency locator transmitter) sends on **121.5, 243 or 406 MHz**. Satellites detect **406 MHz only**."], "elt"], ["Hear one?", ["In flight, **monitor 121.5** when you can. Hear an ELT? Tell the **nearest ATS unit** where and when you first heard it, how strong it was, where and when you lost it, and whether it stopped suddenly or faded.", "Don't try to search for it yourself."]], ["Your own ELT", ["After every flight (and before, when you can), **listen on 121.5** to make sure yours isn't transmitting.", "Set it off by accident? **Switch it off** and **report** it to the nearest ATS unit. Report it promptly: no charge or penalty.", "Testing a 121.5 ELT: the **first 5 minutes of a UTC hour**, for **5 seconds** at most."]], ["Declaring an emergency", ["Grave or imminent danger, help needed now: **MAYDAY** ×3. A safety concern, no immediate help needed: **PAN PAN** ×3. Practise both in **ROC-A Part 3**.", "Call on the frequency **you're using**; no answer, try **121.5**. Can't reach ATC right away? **Squawk 7700**."]]]]], "summary": "If your radio fails in Class B, C or D airspace: leave it (in a control zone, by landing at its aerodrome; elsewhere, by the shortest route), squawk 7600 and tell ATC as soon as you can. Watch the tower for light signals and acknowledge by rocking the wings (day) or one landing-light flash (night). A phone is fine after the normal steps. VFR codes: 1200 at or below 12,500 ft ASL, 1400 above. Alarm codes: 7500 unlawful interference, 7600 radio failure, 7700 emergency. Standby while taxiing, on when you enter the runway, and never pass through 7500, 7600 or 7700 when you change codes. Satellites hear 406 MHz ELTs only. Listen on 121.5 after each flight, and report any ELT you hear to the nearest ATS unit.", "selfcheck": [["Your radio fails in a control zone. Name the three things you do.", "Land at its aerodrome, squawk 7600, tell ATC as soon as possible."], ["Your radio fails in Class C (not a control zone). How do you leave?", "By the shortest route."], ["How do you acknowledge a tower light signal in flight at night?", "One flash of the landing light."], ["Give the codes for unlawful interference, radio failure and emergency.", "7500, 7600, 7700."], ["VFR at 8,500 ft ASL, no code assigned: which code?", "1200."], ["How do you change from 1700 to 7100?", "Via 1100, so you never pass through 7700."], ["Which ELT frequency do satellites detect?", "406 MHz."], ["You set your ELT off by accident. What now?", "Switch it off and report it to the nearest ATS unit."]], "practice": [["TP 11919 (PSTAR)", "§3 Communications, questions 3.08 and 3.18–3.20"], ["CARs", "602.138 (VFR radio failure)"], ["TC AIM", "RAC 4.4.5–4.4.8 · COM 1.7, 8 · SAR 3"]], "reading": ["TC AIM RAC 4.4.8 (VFR communications failure)", "TC AIM COM 8 (transponder operation)", "TC AIM SAR 3 (ELTs)", "ROC-A Part 3 (Emergency Communications)"]}];
const KEY = 'safapp-cornell-pstar5';
let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const $ = id => document.getElementById(id);
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let cur = store.last && LESSONS.some(l => l.code === store.last) ? store.last : LESSONS[0].code;
let studying = false;

function tabs() {
  $('tabs').innerHTML = '';
  LESSONS.forEach(L => {
    const b = document.createElement('button'); b.className = 'tab';
    b.setAttribute('aria-pressed', L.code === cur); b.textContent = L.code + ' ' + L.title;
    b.onclick = () => { cur = L.code; store.last = cur; save(); tabs(); render(); document.getElementById('scroller').scrollTo(0, 0); };
    $('tabs').appendChild(b);
  });
}
function render() {
  const L = LESSONS.find(l => l.code === cur);
  let h = `<div style="display:flex;flex-direction:column;gap:18px">
  <div class="title"><span class="code">${L.code}</span><span class="name">${esc(L.title)}</span><span class="kind">CORNELL NOTES</span></div>
  <div class="panel goldleft"><h3>By the end of this lesson you can</h3><ul class="b">${L.objectives.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>
  <div class="toolbar">
    <label class="switch" for="study"><input type="checkbox" id="study" ${studying ? 'checked' : ''}> Study mode: hide the notes</label>
    <span class="hint" id="hint">${studying ? 'Answer each cue in your head, then tap the notes to check.' : 'Turn on study mode to quiz yourself with the cues.'}</span>
  </div>
  <div class="cornell ${studying ? 'studying' : ''}" id="cornell">
    <div class="colhead"><div>CUES / QUESTIONS</div><div>NOTES</div></div>`;
  L.sections.forEach(([head, rows]) => {
    h += `<div class="sec">${esc(head)}</div>`;
    rows.forEach(([cue, notes, fig]) => {
      h += `<div class="row"><div class="cue">${md(cue)}</div><div class="note"><div class="content"><ul class="b">${notes.map(n => `<li>${md(n)}</li>`).join('')}</ul>${fig && FIGS[fig] ? `<figure class="fig">${FIGS[fig].svg}<figcaption>${md(FIGS[fig].cap)}</figcaption></figure>` : ''}</div><button class="reveal" aria-label="Show notes"><span>Tap to check</span></button></div></div>`;
    });
  });
  h += `</div>
  <div class="summary"><h3>Summary</h3>
    <label for="mine" style="font-weight:600">In my own words</label>
    <textarea id="mine" placeholder="Write the big ideas of this lesson in 3–4 sentences without looking at the notes.">${esc((store.mine || {})[L.code] || '')}</textarea>
    <span class="saved" id="saved" hidden>Saved on this device</span>
    <div class="model"><button class="cmp" id="cmp" type="button">Compare with the model summary</button><span class="hint" id="cmpHint">Write at least 30 characters first.</span><p style="margin:0" id="model" hidden>${md(L.summary)}</p></div></div>
  <div class="panel"><h3>Self-check</h3><div class="qa">${L.selfcheck.map(([q, a], i) => `<div class="q"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span><span class="a" hidden>${esc(a)}</span><button data-i="${i}">Show answer</button></div>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Exam practice</h3><span class="hint">Official guide: <a href="${GUIDE.url}" target="_blank" rel="noopener">${esc(GUIDE.name)}</a></span><ul class="b">${L.practice.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>Required reading — next class</h3><ul class="b">${L.reading.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  </div></div>`;
  $('lesson').innerHTML = h;
  $('study').onchange = e => { studying = e.target.checked; render(); };
  document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => { if (studying) n.classList.add('shown'); }));
  document.querySelectorAll('.q button').forEach(b => b.onclick = () => { const a = b.previousElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; });
  let t; $('mine').oninput = e => { clearTimeout(t); t = setTimeout(() => { store.mine = store.mine || {}; store.mine[L.code] = e.target.value; save(); $('saved').hidden = false; }, 500); };
  const gate = () => { const ok = $('mine').value.trim().length >= 30; $('cmp').disabled = !ok; $('cmpHint').hidden = ok; };
  $('mine').addEventListener('input', gate); gate();
  $('cmp').onclick = () => { if ($('cmp').disabled) return; $('model').hidden = false; $('cmp').hidden = true; };
}
tabs(); render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "pstar5-notes", "unit": 5, "kind": "notes"};
  const run = window.google && google.script && google.script.run;
  const sent = {};
  let who = ''; try { who = localStorage.getItem('safa-who') || ''; } catch (e) {}
  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();
  function askName() {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };
    document.body.appendChild(b);
  }
  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
  if (typeof render === 'function') { const _r = render; render = function () { _r.apply(this, arguments); try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }; try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }
  document.addEventListener('change', e => { if (e.target && e.target.id === 'study' && e.target.checked) T('notes', {l: cur, a: 'study'}, 6e5); });
  let st_; document.addEventListener('input', e => { if (e.target && e.target.id === 'mine' && e.target.value.trim().length >= 30) { clearTimeout(st_); st_ = setTimeout(() => T('notes', {l: cur, a: 'summary'}, 6e5), 1500); } });
})();
</script>
</body>
