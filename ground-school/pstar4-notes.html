<style>
:root{
  --bg:#000; --panel:#121110; --cue:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
header img{width:84px;flex:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);line-height:1.15;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px}
.title .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--gold);line-height:1}
.title .name{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;text-transform:uppercase}
.title .kind{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.goldleft{border-left:4px solid var(--gold)}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.b li{position:relative;padding-left:18px}
ul.b li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:13px;top:1px}
b{font-weight:700}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.hint{font-size:13px;color:var(--muted)}
.cornell{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.colhead{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:2px solid var(--gold)}
.colhead div{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--gold)}
.sec{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px}
.row{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cue{background:var(--cue);color:var(--gold);font-weight:700;padding:12px 14px;border-right:2px solid var(--gold);min-width:0}
.note{padding:12px 16px;min-width:0;position:relative}
.note ul.b li{line-height:1.45}
.studying .note .content{filter:blur(7px);opacity:.55;user-select:none;transition:filter .25s,opacity .25s}
.studying .note.shown .content{filter:none;opacity:1;user-select:auto}
.reveal{display:none}
.studying .note:not(.shown) .reveal{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;width:100%}
.reveal span{background:#000;border:1px solid var(--gold);border-radius:99px;padding:6px 14px}
.summary{border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
textarea{width:100%;min-height:96px;resize:vertical;background:#1b1915;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.saved{font-size:13px;color:#7fc48a}
.qa{display:flex;flex-direction:column;gap:8px}
.q{background:#17150f;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.q .n{font-family:var(--display);font-weight:700;color:var(--gold)}
.q .a{grid-column:2;color:var(--gold)}
.q button{grid-column:2;justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:12px;font-weight:600;cursor:pointer}
.q button:hover{border-color:var(--gold);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand img{width:60px}
.tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){
  .row,.colhead{grid-template-columns:1fr}
  .cue{border-right:0;border-bottom:1px solid var(--gold);padding:10px 14px}
  .colhead div:last-child{display:none}
  .grid2{grid-template-columns:1fr}
  .title .kind{margin-left:0;width:100%}
}
@media print{body{background:#fff;color:#000}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}
header img{width:62px!important}

.fig{margin:10px 0 2px;background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;overflow-y:hidden}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.model{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cmp{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.cmp:disabled{background:var(--line);color:var(--muted);cursor:default}
.panel a{color:var(--gold)}
</style>

rspace<\/text><text x=\"490\" y=\"210\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Controlled airspace<\/text><\/svg>", "cap": "CARs 101.01 and 602.31; TC AIM RAC 1.6."}, "fpfi": {"svg": "<svg viewBox=\"0 0 600 188\" role=\"img\" aria-label=\"Flight plan versus Flight itinerary\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"150\" y=\"0\" width=\"220\" height=\"30\" rx=\"8\" fill=\"#4a1f18\"/><text x=\"260\" y=\"20\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Flight plan<\/text><rect x=\"380\" y=\"0\" width=\"220\" height=\"30\" rx=\"8\" fill=\"#5b4c1c\"/><text x=\"490\" y=\"20\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\">Flight itinerary<\/text><rect x=\"0\" y=\"36\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"58\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">File with<\/text><text x=\"260\" y=\"58\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">ATC, FSS or CARS<\/text><text x=\"490\" y=\"58\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Same, or a responsible person<\/text><rect x=\"0\" y=\"74\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"96\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">No SAR time given<\/text><text x=\"260\" y=\"96\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Due 1 h after ETA<\/text><text x=\"490\" y=\"96\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Due 24 h after ETA<\/text><rect x=\"0\" y=\"112\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"134\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Canada ↔ U.S.<\/text><text x=\"260\" y=\"134\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Required<\/text><text x=\"490\" y=\"134\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Not accepted<\/text><rect x=\"0\" y=\"150\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#1b1915\" stroke=\"#2e2a23\"/><text x=\"12\" y=\"172\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\">Close with<\/text><text x=\"260\" y=\"172\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">ATC, FSS or CARS<\/text><text x=\"490\" y=\"172\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12.5\">Same, or your responsible person<\/text><\/svg>", "cap": "CARs 602.73, 602.75 and 602.77; TC AIM RAC 3.5.3."}, "sar": {"svg": "<svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"Arrival report deadlines\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M20 70 H400\" stroke=\"#ffffff\" stroke-width=\"3\"/><path d=\"M430 70 H620\" stroke=\"#ffffff\" stroke-width=\"3\"/><path d=\"M402 80 l8 -20 M418 80 l8 -20\" stroke=\"#a8a39a\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"70\" r=\"7\" fill=\"#ffffff\"/><text x=\"20\" y=\"52\" fill=\"#ffffff\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"800\" text-anchor=\"start\" pointer-events=\"none\">ETD<\/text><text x=\"20\" y=\"96\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\" text-anchor=\"start\" pointer-events=\"none\">take-off<\/text><circle cx=\"180\" cy=\"70\" r=\"7\" fill=\"#ffffff\"/><text x=\"180\" y=\"52\" fill=\"#ffffff\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" pointer-events=\"none\">ETA<\/text><text x=\"180\" y=\"96\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\" text-anchor=\"middle\" pointer-events=\"none\">last reported<\/text><circle cx=\"300\" cy=\"70\" r=\"7\" fill=\"#d8b358\"/><text x=\"300\" y=\"52\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" pointer-events=\"none\">ETA + 1 h<\/text><text x=\"300\" y=\"96\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" pointer-events=\"none\">flight plan<\/text><circle cx=\"600\" cy=\"70\" r=\"7\" fill=\"#d8b358\"/><text x=\"600\" y=\"52\" fill=\"#d8b358\" font-family=\"IBM Plex Mono,Menlo,monospace\" font-size=\"13\" font-weight=\"800\" text-anchor=\"end\" pointer-events=\"none\">ETA + 24 h<\/text><text x=\"600\" y=\"96\" fill=\"#ffffff\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" text-anchor=\"end\" pointer-events=\"none\">flight itinerary<\/text><text x=\"0\" y=\"18\" fill=\"#d8b358\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\" text-anchor=\"start\" pointer-events=\"none\">No SAR time given? Your arrival report is due by…<\/text><text x=\"0\" y=\"130\" fill=\"#a8a39a\" font-family=\"Poppins,Arial,sans-serif\" font-size=\"12\" font-weight=\"400\" text-anchor=\"start\" pointer-events=\"none\">Gave a SAR time? Then that time is the deadline. Miss it and a search begins.<\/text><\/svg>", "cap": "CAR 602.77 and TC AIM RAC 3.9 and 3.11."}};

const LESSONS = [{"code": "P4.1", "title": "Canadian Airspace", "objectives": ["Describe how Canadian airspace is divided: **low-level vs high-level**, **controlled vs uncontrolled**", "Name the seven **classes (A–G)** and what a VFR pilot needs for each", "Apply the **VFR minima in uncontrolled airspace** and the **VFR cruising altitudes**", "Know the general rules: **Class F**, **ADIZ**, **minimum heights**, **day and night**, alcohol and aerobatics"], "sections": [["The big picture", [["Low and high", ["**Low-level airspace**: everything **below 18,000 ft ASL**.", "**High-level airspace**: **18,000 ft ASL and above**."], "xsec"], ["North and south", ["Canadian Domestic Airspace is split into the **Southern** (SDA) and **Northern** (NDA) Domestic Airspace.", "Cruising altitudes use **magnetic** track in the south and **true** track in the north."]], ["Controlled or not", ["**Controlled airspace**: ATC service is provided, and some or all aircraft may be subject to ATC control.", "**Uncontrolled (Class G)**: ATC has no authority to control you, but you still get **flight information** and **alerting** service (alerting is what starts a search when you're overdue)."]], ["Seven classes", ["**A, B, C, D, E** are controlled. **F** is special use. **G** is uncontrolled.", "The rules come from the **class**, not the name: a control zone could be Class B, C, D or E."], "classes"]]], ["VFR weather and altitude", [["Always", ["Every VFR flight, controlled or uncontrolled, needs **visual reference to the surface**. (The one exception is VFR over-the-top, which has its own rules and qualifications.)"]], ["Uncontrolled, 1,000 ft AGL and up", ["Flight visibility: **1 mile by day**, **3 miles at night**.", "Distance from cloud: **500 ft vertically**, **2,000 ft horizontally**."], "minima_g"], ["Uncontrolled, below 1,000 ft AGL", ["Aeroplanes: **2 miles by day**, **3 miles at night**, **clear of cloud**.", "Helicopters: **1 mile by day**, **3 miles at night**, **clear of cloud**."]], ["Day and night", ["**Day**: from the start of **morning civil twilight** to the end of **evening civil twilight**.", "**Night**: the time in between (end of evening civil twilight to start of morning civil twilight)."]], ["Cruising altitudes", ["VFR in **level cruise above 3,000 ft AGL** follows the track rule.", "Track **000°–179°**: **odd** thousands **+ 500** (3,500, 5,500, 7,500).", "Track **180°–359°**: **even** thousands **+ 500** (4,500, 6,500, 8,500)."], "cruise"]]], ["Special airspace", [["Class F restricted (CYR)", ["**Stay out** unless the **user agency** (the group running the activity) gives you permission."]], ["Class F advisory (CYA)", ["**Not forbidden**, but avoid it unless you're part of the activity. If you go in, keep an **extra-sharp lookout**.", "The letter in brackets is the activity: (P) parachuting, (T) training, (S) soaring, (M) military…", "Numbers **201–299** are in **Alberta**."], "classf"], ["ADIZ", ["The **Air Defence Identification Zone**. To fly into or inside it you file a **defence flight plan** or **defence flight itinerary** with **ATC, an FSS or a CARS**.", "VFR: if you'll miss your entry estimate by more than **5 minutes** or **20 NM**, revise it and tell ATC, an FSS or a CARS."]]]], ["Low flying and conduct", [["Over towns and crowds", ["High enough to **land safely** if the engine quits, and never lower than:", "Aeroplanes: **1,000 ft above the highest obstacle within 2,000 ft**.", "Helicopters: **1,000 ft above the highest obstacle within 500 ft**."]], ["Everywhere else", ["Never closer than **500 ft** to any **person, vessel, vehicle or structure**.", "Take-offs and landings inside a **built-up area** happen only at an **airport, heliport or military aerodrome** (police and life-saving flights aside)."]], ["Conduct rules", ["**Dropping objects**: not if it creates a **hazard** to people or property.", "**Formation flight**: only by **pre-arrangement** between the pilots-in-command, plus **ATC** in a control zone.", "**Aerobatics**: never over a **built-up area or crowd**, never below **2,000 ft AGL**, never with flight visibility under **3 miles**."]], ["You and your papers", ["**Alcohol**: no crew duty within **12 hours** of a drink, or while under the influence of alcohol or an impairing drug.", "**Documents**: show your licence or aircraft papers when a **peace officer**, an **immigration officer** or **Transport Canada** asks."]]]]], "summary": "Low-level airspace is below 18,000 ft ASL; high-level is 18,000 ft and up. Classes A to E are controlled, F is special use and G is uncontrolled; the class sets the rules. VFR needs sight of the surface (VFR over-the-top aside). In Class G at or above 1,000 ft AGL you need 1 mile by day (3 at night) and 500 ft vertically and 2,000 ft horizontally from cloud; below 1,000 ft AGL stay clear of cloud with 2 miles by day (helicopters 1) and 3 at night. Above 3,000 ft AGL, cruise at odd thousands plus 500 on tracks 000–179° and even plus 500 on 180–359°. Stay out of CYR areas without permission and take care in CYA areas. Over towns, aeroplanes stay 1,000 ft above obstacles within 2,000 ft; elsewhere, 500 ft from people and things. No flying within 12 hours of alcohol.", "selfcheck": [["Where does high-level airspace begin?", "18,000 ft ASL."], ["Which classes are controlled?", "A, B, C, D and E."], ["What does ATS still give you in Class G?", "Flight information and alerting service."], ["VFR in Class G at 2,000 ft AGL at night: visibility and cloud distance?", "3 miles; 500 ft vertically and 2,000 ft horizontally."], ["VFR aeroplane in Class G below 1,000 ft AGL by day?", "2 miles visibility and clear of cloud."], ["VFR, level cruise above 3,000 ft AGL, magnetic track 250°. Give a correct altitude.", "Any even thousand + 500, e.g. 6,500 ft."], ["Can you fly into CYA airspace? CYR airspace?", "CYA: yes, with extra care. CYR: only with the user agency's permission."], ["How long after a drink before you may act as crew?", "12 hours (and not under the influence)."]], "practice": [["TP 11919", "Study topics 12.01–12.21"], ["TC AIM", "RAC 2.1–2.8 Airspace · RAC 3.8 ADIZ"], ["CARs", "602.14 · 602.115 · 602.34 · 601.04 · 602.145"]], "reading": ["TC AIM RAC 2 (free on the Transport Canada website)", "The legend of your VFR Navigation Chart (VNC)"]}, {"code": "P4.2", "title": "Controlled Airspace", "objectives": ["Describe the main kinds of **controlled airspace**: control zones, airways, transition areas", "Apply the **VFR minima in controlled airspace** and in **control zones**", "Say what a VFR pilot needs to enter **Class B, C, D and E**", "Know when and how to use **Special VFR**"], "sections": [["Kinds of controlled airspace", [["Control zone", ["Around certain aerodromes, from the **surface** up to **3,000 ft** above the aerodrome, unless charted otherwise. CAR 101.01 says **3,000 ft AGL**; the TC AIM says **3,000 ft AAE** (above aerodrome elevation).", "Radius: usually **7 NM** for a tower inside a terminal control area, **5 NM** for most others, a few **3 NM**."]], ["Built for IFR traffic", ["**Transition area**: based at **700 ft AGL**.", "**Low-level airway** and **control area extension**: based at **2,200 ft AGL**, up to but not including **18,000 ft ASL**.", "**Terminal control area (TCA)**: busy airports, layered like an upside-down wedding cake."]], ["Transponder airspace", ["All **Class A, B and C**, plus **Class D or E** where charted as transponder airspace.", "That includes Class E from **10,000 to 12,500 ft ASL** within radar coverage.", "You need a **transponder** with **automatic altitude reporting (Mode C)**."]]]], ["VFR minima in controlled airspace", [["Anywhere controlled", ["Flight visibility at least **3 miles**, **day or night**.", "Distance from cloud: **500 ft vertically**, **1 mile horizontally**."], "minima_c"], ["Control zone extras", ["**Ground visibility**, when reported, at least **3 miles**.", "At least **500 ft above the surface**, except when taking off or landing."]]]], ["Getting in, by class", [["Class B", ["Controlled low-level airspace above **12,500 ft ASL** (or the MEA if higher) up to 18,000 ft ASL, plus some control zones and TCAs.", "VFR needs an **ATC clearance** (controlled VFR), a two-way radio, navigation equipment and a **transponder with Mode C**."]], ["Class C", ["VFR needs a **clearance to enter**, a two-way **radio** and a **transponder with Mode C**.", "No radio? Only by **day in VMC**, with ATC permission arranged **before** you enter."]], ["Class D", ["VFR must make **two-way radio contact** with ATC **before entering**."]], ["Class E", ["VFR needs **no permission** and, outside mandatory frequency (MF) areas, **no contact**.", "ATC separates **IFR** aircraft only. Watching for other traffic is **your** job."]], ["Tower closed?", ["Class C or D becomes **Class E** when the ATC unit is not operating."]], ["Calling in", ["Listen to the **ATIS** first.", "Call the tower at least **5 minutes** before entering the control zone, when practical.", "Class C: call ATC **before** entering with your type and call sign, position, altitude, destination and route, transponder code and the ATIS letter."]]]], ["Special VFR", [["What it is", ["Permission to fly VFR in a **control zone** when the weather is **below VFR minima**.", "Only in **control zones**, and only when **you ask**: ATC never offers it."]], ["Minima", ["Flight visibility (ground visibility when reported): **1 mile** for aeroplanes, **½ mile** for helicopters.", "Stay **clear of cloud** and in **sight of the ground**. You need a working **radio**."]], ["At night", ["An aeroplane gets Special VFR at night **only to land** at its destination aerodrome."]], ["Still your job", ["With Special VFR you still must **avoid other aircraft** and any weather beyond you or your aircraft."]]]]], "summary": "A control zone runs from the surface to 3,000 ft above the aerodrome. Transition areas start at 700 ft AGL; airways and control area extensions at 2,200 ft AGL, up to 18,000 ft ASL. In controlled airspace VFR needs 3 miles visibility and 500 ft vertically and 1 mile horizontally from cloud, day or night; in a control zone also 3 miles ground visibility when reported and 500 ft above the ground. Class B and C need an ATC clearance, Class D needs radio contact first, Class E needs nothing from ATC. C and D become E when the tower closes. Transponder airspace is all of A, B and C plus charted D and E. Special VFR is only in control zones, only if you ask: 1 mile (helicopters ½), clear of cloud, ground in sight, radio on board.", "selfcheck": [["How high does a control zone normally go?", "3,000 ft above aerodrome elevation."], ["Base of a transition area? Of a low-level airway?", "700 ft AGL; 2,200 ft AGL."], ["VFR visibility and cloud distance in controlled airspace?", "3 miles; 500 ft vertically and 1 mile horizontally."], ["Two extra VFR rules inside a control zone?", "Ground visibility 3 miles when reported; 500 ft above the surface except taking off or landing."], ["VFR into Class C needs…? Class D needs…?", "C: an ATC clearance. D: two-way radio contact first."], ["What happens to Class D when the tower closes?", "It becomes Class E."], ["Where is Special VFR allowed, and who starts it?", "Only in a control zone; the pilot must ask for it."], ["Special VFR visibility for an aeroplane and a helicopter?", "1 mile; ½ mile."]], "practice": [["TP 11919", "Study topics 13.01–13.12"], ["TC AIM", "RAC 2.7 Controlled airspace · RAC 2.8 Classes · RAC 4.4 Arrivals · RAC 5.8 Class C"], ["CARs", "601.07 · 601.08 · 602.114 · 602.117"]], "reading": ["TC AIM RAC 2.7–2.8", "The VFR Terminal Area (VTA) chart for Calgary: find the Class C and D areas"]}, {"code": "P4.3", "title": "Clearances & Instructions", "objectives": ["Tell an ATC **clearance** from an ATC **instruction**", "Know your duty to **comply** and **acknowledge**", "Act correctly when you **can't comply** or a clearance is **not acceptable**", "Explain who keeps you **clear of other traffic**"], "sections": [["Clearance or instruction?", [["Clearance", ["An **authorization** from ATC to proceed in **controlled airspace** under the conditions it sets.", "It always contains a form of the word **\"clear\"**: \"cleared for take-off\", \"cleared to the circuit\"."], "clr"], ["Instruction", ["A **directive** from ATC: \"taxi to…\", \"turn left heading 270\", \"hold short\".", "You'll almost never hear the word \"instruct\"."]], ["Where they count", ["A clearance or instruction is valid only while you're **in controlled airspace**."]]]], ["Your duties", [["Instructions", ["**Comply** and **acknowledge**, as long as doing so doesn't put the aircraft in danger. From **19 Nov 2026**, hold-short instructions, runways, altimeter settings and transponder codes must also be **read back** (see ROC-A Part 2)."]], ["Clearances", ["**Comply** with every clearance you have **received and accepted**.", "When you acknowledge a clearance, ATC takes that as **acceptance**."]], ["Can't comply?", ["With **part or all** of it? Tell ATC **immediately** (\"**UNABLE**\").", "Cleared for take-off but not ready? Say so. ATC will change or cancel the clearance."]], ["Not acceptable?", ["**Don't accept it.** Tell ATC right away and ask for something you can do.", "VFR: speak up if an instruction would take you into **cloud** or too close to **terrain**. ATC will give you another."]], ["Collision alert", ["You may leave a clearance to avoid a collision (for example a **TCAS** or terrain warning).", "Then tell ATC **as soon as possible** and go back to your clearance."]]]], ["Who avoids whom?", [["ATC separation", ["**Class B**: ATC separates **all** aircraft.", "**Class C**: IFR from IFR, plus traffic information and conflict help between IFR and VFR.", "**Class D and E**: ATC separates **IFR** aircraft only."]], ["Your job, always", ["**You** must **see and avoid** other aircraft, **even with a clearance**.", "ATC warnings about birds, icing or traffic help you, but the flight's safety is still **your** responsibility."]]]]], "summary": "A clearance is an ATC authorization to proceed in controlled airspace and always uses a form of \"clear\"; an instruction is an ATC directive. Comply with and acknowledge instructions unless that would endanger the aircraft, and comply with clearances you have received and accepted. Acknowledging a clearance means you accept it, so if you can't comply, or the clearance isn't acceptable, tell ATC immediately (\"unable\"). You may leave a clearance to avoid a collision, then tell ATC and return to it. Clearances only count in controlled airspace. ATC separates IFR traffic (everyone in Class B), but seeing and avoiding other aircraft is always the pilot's job.", "selfcheck": [["What is an ATC clearance?", "An ATC authorization to proceed in controlled airspace under set conditions."], ["How can you recognise a clearance?", "It contains a form of the word \"clear\"."], ["What must you do with an ATC instruction?", "Comply and acknowledge, unless it would endanger the aircraft."], ["When must you comply with a clearance?", "Once you have received and accepted it."], ["You can't comply with part of an accepted clearance. What now?", "Tell ATC immediately."], ["What should you do with a clearance you can't accept?", "Don't accept it; tell ATC right away and ask for another."], ["On a VFR clearance in good weather, who avoids other traffic?", "The pilot (see and avoid)."], ["Is your clearance valid after you leave controlled airspace?", "No."]], "practice": [["TP 11919", "Study topics 10.01–10.06"], ["TC AIM", "RAC 1.6 ATC clearances, instructions and information · RAC 4.3"], ["CARs", "101.01 · 602.31"]], "reading": ["TC AIM RAC 1.6"]}, {"code": "P4.4", "title": "Flight Plans & Itineraries", "objectives": ["Know when a VFR **flight plan or flight itinerary** is required", "Explain **who** each can be filed with, including a **responsible person**", "Close on time: **arrival report**, **SAR time**, **1 hour** versus **24 hours**", "Plan **intermediate stops** and **VFR fuel reserves**"], "sections": [["When you must file", [["VFR", ["File a **VFR flight plan** or **VFR flight itinerary** for every VFR flight, unless you stay **within 25 NM** of the departure aerodrome."]], ["Leaving Canada", ["Flights between Canada and another country need a **flight plan**. An itinerary isn't accepted."]], ["Plan or itinerary?", ["**Flight plan**: filed with an **ATC unit**, a **flight service station** (FSS, including a FIC) or a **CARS** (community aerodrome radio station).", "**Flight itinerary**: any of those, **or** a **responsible person**."], "fpfi"], ["Responsible person", ["Someone who has **agreed** to tell **ATC, an FSS or a CARS**, or a **rescue coordination centre (RCC)**, if you are **overdue**.", "Leave them your itinerary details. They'll need them to report you."]]]], ["Opening and changing", [["Open it", ["Open a VFR flight plan or itinerary on departure with the tower, FSS, FIC or CARS. That turns on the **alerting service**.", "Delayed or cancelled? **Tell them.** Otherwise they start it at your **planned departure time (ETD)**."]], ["Changes", ["Changing your **route**, the **duration** of the flight or your **destination**? Tell ATS, a CARS or your responsible person **as soon as practicable**."]]]], ["Closing it", [["Arrival report", ["File it **as soon as practicable after landing**.", "**Flight plan**: no later than your **SAR time**, or **1 hour after your last reported ETA** if you didn't give one.", "**Flight itinerary**: no later than your SAR time, or **24 hours after your last reported ETA**."], "sar"], ["Forget to close?", ["A **search** starts. Never assume the tower or FSS will close it for you.", "You may close it **by radio before landing**. That counts as your arrival report and **ends all alerting**, so only do it when you're sure."]], ["What to say", ["Registration or call sign, **plan or itinerary**, **departure** aerodrome, **arrival** aerodrome, **date and time** of arrival."]]]], ["Stops and fuel", [["Intermediate stops", ["A VFR flight plan can include **short** stops, for passengers or fuel.", "Write each stop in the route as name, 4-digit **duration**, name: e.g. **CYXH 0030 CYXH** (30 minutes at Medicine Hat).", "Your **estimated elapsed time** is the total to the final destination, **including** the stops."]], ["Search with stops", ["A search is based on your ETA at the **final destination**.", "Want a search to start if you're late on **any leg**? File a **separate** plan or itinerary for each leg."]], ["VFR fuel", ["Aeroplane by **day**: enough to reach the destination **plus 30 minutes** at normal cruising speed.", "At **night**: **plus 45 minutes**. Helicopter: **plus 20 minutes**.", "Also carry fuel for taxiing, weather and any delays you can foresee."]]]]], "summary": "Every VFR flight needs a VFR flight plan or itinerary unless it stays within 25 NM of the departure aerodrome, and flights to another country need a flight plan. A flight plan goes to ATC, an FSS or a CARS; an itinerary can also go to a responsible person who agrees to report you overdue. Open it on departure, report changes in route, duration or destination, and file an arrival report after landing: by your SAR time, or 1 hour after your last ETA for a plan and 24 hours for an itinerary. If you don't close it, a search starts. Show stops as name, duration, name, and include them in your elapsed time. VFR aeroplanes carry 30 minutes of reserve fuel by day, 45 at night; helicopters 20.", "selfcheck": [["When can you skip a VFR flight plan or itinerary?", "When you stay within 25 NM of the departure aerodrome."], ["Who can a flight itinerary be filed with that a flight plan can't?", "A responsible person."], ["What is a responsible person?", "Someone who has agreed to notify ATS or an RCC if you are overdue."], ["Flight plan, no SAR time: arrival report deadline?", "1 hour after the last reported ETA."], ["Flight itinerary, no SAR time: arrival report deadline?", "24 hours after the last reported ETA."], ["Which VFR changes must you report?", "Route, duration of flight, destination."], ["How do you show a 45-minute stop at Medicine Hat in the route?", "CYXH 0045 CYXH."], ["VFR fuel reserve: aeroplane by day, at night, helicopter?", "30 minutes, 45 minutes, 20 minutes."]], "practice": [["TP 11919", "Study topics 9.01–9.11"], ["TC AIM", "RAC 3.5–3.12 Flight plans, arrival reports, fuel"], ["CARs", "602.73 · 602.75 · 602.76 · 602.77 · 602.88"]], "reading": ["TC AIM RAC 3", "The \"Flight Planning\" pages of the Canada Flight Supplement (CFS)"]}];
const KEY = 'safapp-cornell-pstar4';
let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const $ = id => document.getElementById(id);
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let cur = store.last && LESSONS.some(l => l.code === store.last) ? store.last : LESSONS[0].code;
let studying = false;

function tabs() {
  $('tabs').innerHTML = '';
  LESSONS.forEach(L => {
    const b = document.createElement('button'); b.className = 'tab';
    b.setAttribute('aria-pressed', L.code === cur); b.textContent = L.code + ' ' + L.title;
    b.onclick = () => { cur = L.code; store.last = cur; save(); tabs(); render(); document.getElementById('scroller').scrollTo(0, 0); };
    $('tabs').appendChild(b);
  });
}
function render() {
  const L = LESSONS.find(l => l.code === cur);
  let h = `<div style="display:flex;flex-direction:column;gap:18px">
  <div class="title"><span class="code">${L.code}</span><span class="name">${esc(L.title)}</span><span class="kind">CORNELL NOTES</span></div>
  <div class="panel goldleft"><h3>By the end of this lesson you can</h3><ul class="b">${L.objectives.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>
  <div class="toolbar">
    <label class="switch" for="study"><input type="checkbox" id="study" ${studying ? 'checked' : ''}> Study mode: hide the notes</label>
    <span class="hint" id="hint">${studying ? 'Answer each cue in your head, then tap the notes to check.' : 'Turn on study mode to quiz yourself with the cues.'}</span>
  </div>
  <div class="cornell ${studying ? 'studying' : ''}" id="cornell">
    <div class="colhead"><div>CUES / QUESTIONS</div><div>NOTES</div></div>`;
  L.sections.forEach(([head, rows]) => {
    h += `<div class="sec">${esc(head)}</div>`;
    rows.forEach(([cue, notes, fig]) => {
      h += `<div class="row"><div class="cue">${md(cue)}</div><div class="note"><div class="content"><ul class="b">${notes.map(n => `<li>${md(n)}</li>`).join('')}</ul>${fig && FIGS[fig] ? `<figure class="fig">${FIGS[fig].svg}<figcaption>${md(FIGS[fig].cap)}</figcaption></figure>` : ''}</div><button class="reveal" aria-label="Show notes"><span>Tap to check</span></button></div></div>`;
    });
  });
  h += `</div>
  <div class="summary"><h3>Summary</h3>
    <label for="mine" style="font-weight:600">In my own words</label>
    <textarea id="mine" placeholder="Write the big ideas of this lesson in 3–4 sentences without looking at the notes.">${esc((store.mine || {})[L.code] || '')}</textarea>
    <span class="saved" id="saved" hidden>Saved on this device</span>
    <div class="model"><button class="cmp" id="cmp" type="button">Compare with the model summary</button><span class="hint" id="cmpHint">Write at least 30 characters first.</span><p style="margin:0" id="model" hidden>${md(L.summary)}</p></div></div>
  <div class="panel"><h3>Self-check</h3><div class="qa">${L.selfcheck.map(([q, a], i) => `<div class="q"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span><span class="a" hidden>${esc(a)}</span><button data-i="${i}">Show answer</button></div>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Exam practice</h3><span class="hint">Official guide: <a href="${GUIDE.url}" target="_blank" rel="noopener">${esc(GUIDE.name)}</a></span><ul class="b">${L.practice.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>Required reading — next class</h3><ul class="b">${L.reading.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  </div></div>`;
  $('lesson').innerHTML = h;
  $('study').onchange = e => { studying = e.target.checked; render(); };
  document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => { if (studying) n.classList.add('shown'); }));
  document.querySelectorAll('.q button').forEach(b => b.onclick = () => { const a = b.previousElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; });
  let t; $('mine').oninput = e => { clearTimeout(t); t = setTimeout(() => { store.mine = store.mine || {}; store.mine[L.code] = e.target.value; save(); $('saved').hidden = false; }, 500); };
  const gate = () => { const ok = $('mine').value.trim().length >= 30; $('cmp').disabled = !ok; $('cmpHint').hidden = ok; };
  $('mine').addEventListener('input', gate); gate();
  $('cmp').onclick = () => { if ($('cmp').disabled) return; $('model').hidden = false; $('cmp').hidden = true; };
}
tabs(); render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "pstar4-notes", "unit": 4, "kind": "notes"};
  const run = window.google && google.script && google.script.run;
  const sent = {};
  let who = ''; try { who = localStorage.getItem('safa-who') || ''; } catch (e) {}
  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();
  function askName() {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };
    document.body.appendChild(b);
  }
  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
  if (typeof render === 'function') { const _r = render; render = function () { _r.apply(this, arguments); try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }; try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }
  document.addEventListener('change', e => { if (e.target && e.target.id === 'study' && e.target.checked) T('notes', {l: cur, a: 'study'}, 6e5); });
  let st_; document.addEventListener('input', e => { if (e.target && e.target.id === 'mine' && e.target.value.trim().length >= 30) { clearTimeout(st_); st_ = setTimeout(() => T('notes', {l: cur, a: 'summary'}, 6e5), 1500); } });
})();
</script>
