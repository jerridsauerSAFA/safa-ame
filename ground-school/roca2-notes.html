<style>
:root{
  --bg:#000; --panel:#121110; --cue:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px}
header img{width:84px;flex:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);line-height:1.15;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab:hover{border-color:var(--gold)}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px}
.title .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--gold);line-height:1}
.title .name{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;text-transform:uppercase}
.title .kind{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel.goldleft{border-left:4px solid var(--gold)}
ul.b{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.b li{position:relative;padding-left:18px}
ul.b li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:13px;top:1px}
b{font-weight:700}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.hint{font-size:13px;color:var(--muted)}
.cornell{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.colhead{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:2px solid var(--gold)}
.colhead div{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--gold)}
.sec{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px}
.row{display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cue{background:var(--cue);color:var(--gold);font-weight:700;padding:12px 14px;border-right:2px solid var(--gold);min-width:0}
.note{padding:12px 16px;min-width:0;position:relative}
.note ul.b li{line-height:1.45}
.studying .note .content{filter:blur(7px);opacity:.55;user-select:none;transition:filter .25s,opacity .25s}
.studying .note.shown .content{filter:none;opacity:1;user-select:auto}
.reveal{display:none}
.studying .note:not(.shown) .reveal{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;width:100%}
.reveal span{background:#000;border:1px solid var(--gold);border-radius:99px;padding:6px 14px}
.summary{border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
textarea{width:100%;min-height:96px;resize:vertical;background:#1b1915;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.saved{font-size:13px;color:#7fc48a}
.qa{display:flex;flex-direction:column;gap:8px}
.q{background:#17150f;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.q .n{font-family:var(--display);font-weight:700;color:var(--gold)}
.q .a{grid-column:2;color:var(--gold)}
.q button{grid-column:2;justify-self:start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 12px;font-family:var(--display);font-size:12px;font-weight:600;cursor:pointer}
.q button:hover{border-color:var(--gold);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand img{width:60px}
.tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){
  .row,.colhead{grid-template-columns:1fr}
  .cue{border-right:0;border-bottom:1px solid var(--gold);padding:10px 14px}
  .colhead div:last-child{display:none}
  .grid2{grid-template-columns:1fr}
  .title .kind{margin-left:0;width:100%}
}
@media print{body{background:#fff;color:#000}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}
header img{width:62px!important}

.fig{margin:10px 0 2px;background:#0b0a09;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;overflow-y:hidden}
.fig svg{display:block;width:100%;min-width:520px;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.model{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cmp{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.cmp:disabled{background:var(--line);color:var(--muted);cursor:default}
.panel a{color:var(--gold)}
</style>

const GUIDE = {"name": "RIC-21 Study Guide for the ROC-A (ISED)", "url": "https://ised-isde.canada.ca/site/spectrum-management-telecommunications/en/licences-and-certificates/radiocom-information-circulars-ric/ric-21-study-guide-restricted-operator-certificate-aeronautical-qualification-roc"};
const LESSONS = [{"code": "R2.1", "title": "Speech, Phonetics, Numbers & UTC", "objectives": ["Speak on the radio the RIC-21 way: plain, clear, steady speed, normal rhythm", "Spell any letter or call sign with the **ITU phonetic alphabet**", "Say numbers the radio way: digit by digit, whole thousands, **decimal**, headings, altitudes", "Give times in **UTC** on the 24-hour clock and convert Alberta time to UTC"], "sections": [["Speaking on the radio", [["Why it matters", ["How well radio works depends a lot on **how you speak**.", "Words that sound alike need **extra care** so they are not misheard."]], ["Speak plainly", ["Say every word **plainly and clearly** so words do not run together.", "**Don't shout**, don't over-stress syllables and **don't rush**."]], ["Speed", ["Keep your rate of speech **constant**: not too fast, not too slow.", "Why? The person receiving may have to **write your message down**."]], ["Rhythm", ["Keep the **rhythm of normal conversation**.", "No **\"er\"** or **\"um\"** between words. Pause instead."]], ["Before you press the button", ["**Plan** what you will say.", "**Listen** first, so you don't talk over someone.", "Use **standard phrases** whenever you can."]]]], ["The phonetic alphabet", [["Why phonetics?", ["Over a crackly radio, letters like **B, D and P** sound alike.", "The **ITU phonetic alphabet** gives each letter its own word. Use it for difficult or unusual words, and for **every call sign**."]], ["The 26 words", ["Alfa · Bravo · Charlie · Delta · Echo · Foxtrot · Golf · Hotel · India · Juliett · Kilo · Lima · Mike · November · Oscar · Papa · Quebec · Romeo · Sierra · Tango · Uniform · Victor · Whiskey · X-ray · Yankee · Zulu", "Radio spellings: **Alfa** (not alpha) and **Juliett** (two Ts)."], "phon"], ["Saying them", ["Two sounds are accepted for **Charlie** (CHAR-LEE or SHAR-LEE) and **Uniform** (YOU-NEE-FORM or OO-NEE-FORM).", "**Quebec** = KEH-BECK. **Sierra** = SEE-AIR-RAH."]], ["Spell a registration", ["Say every letter in order: C-GSAF → **Charlie Golf Sierra Alfa Foxtrot**."]]]], ["Saying numbers", [["The radio digits", ["0 ZE-RO · 1 WUN · 2 TOO · 3 **TREE** · 4 FOW-er · 5 **FIFE** · 6 SIX · 7 SEV-en · 8 AIT · 9 **NIN-er**", "Decimal = **DAY-SEE-MAL** · Hundred = HUN-dred · Thousand = TOU-SAND"], "digits"], ["Digit by digit", ["Say **each digit separately**: 75 → \"seven five\" · 100 → \"one zero zero\" · 5,800 → \"five eight zero zero\".", "Exception, **whole thousands**: 11,000 → \"one one thousand\"."]], ["Decimals and frequencies", ["Say the dot as **\"decimal\"**: 121.5 → \"one two one **decimal** five\"."]], ["Altitude, heading, flight level", ["**Altitude** above sea level = thousands + hundreds: 2,700 → \"two thousand seven hundred\".", "**Headings** are always **three digits**: 005 → \"heading zero zero five\".", "**Flight levels** are separate digits: FL265 → \"flight level two six five\"."]]]], ["Time on the radio", [["The 24-hour clock", ["Use **four figures**: the first two are the hour past midnight, the last two the minutes.", "1:45 p.m. → **1345** · 12:45 a.m. → **0045** · noon → **1200** · midnight → **0000** (RIC-21 also allows 2400)."]], ["UTC (Zulu)", ["Aviation uses **Coordinated Universal Time (UTC)** so everyone uses the same clock, whatever their time zone.", "Also called **Zulu (Z)**: 0920Z → \"zero niner two zero Zulu\".", "If you only fly in one time zone, **local time may be used**."]], ["Alberta → UTC", ["From **1 Nov 2026**, Alberta stays on **Alberta Time (ABT) = UTC−6** all year.", "**Add 6 hours**: 0900 ABT → **1500Z** · 2030 ABT → **0230Z the next day**.", "Older charts may still show Mountain time (UTC−7 in winter)."], "time"], ["Date and time together", ["Use **six figures**: day of the month + time. **161200** = the 16th, at 1200."]]]]], "summary": "Speak plainly and clearly at a steady speed, with normal rhythm and no \"um\". Spell letters and call signs with the ITU phonetic alphabet; watch the radio spellings Alfa and Juliett. Say numbers digit by digit (TREE, FIFE, NIN-er), except whole thousands; say \"decimal\" for the dot; headings are three digits; altitudes are thousands plus hundreds. Give times in four figures on the 24-hour clock, in UTC (Zulu). Alberta Time is UTC−6, so add 6 hours.", "selfcheck": [["Name the two speaking points RIC-21 lists by name.", "Speed (keep it constant) and rhythm (normal conversation, no \"er\" or \"um\")."], ["Why should your rate of speech stay constant?", "The listener may have to write your message down."], ["Spell C-GSAF in phonetics.", "Charlie Golf Sierra Alfa Foxtrot."], ["Which two phonetic words have radio spellings that trip people up?", "Alfa (not alpha) and Juliett (two Ts)."], ["How do you say 121.5?", "One two one decimal five."], ["How do you say 11,000 and 5,800?", "\"One one thousand\" and \"five eight zero zero\"."], ["Write 4:30 p.m. on the 24-hour clock.", "1630."], ["It is 1915 Alberta Time. What is the UTC time?", "0115Z, the next day (add 6 hours)."]], "practice": [["RIC-21", "§5.1 Speech · §5.2 Time and date · §5.3 Phonetic alphabet · §5.4 Numbers"], ["TC AIM", "GEN 1.5 Time (UTC)"]], "reading": ["RIC-21 §5.1–5.4 (free on the ISED website)", "TC AIM GEN 1.5 Time"]}, {"code": "R2.2", "title": "Procedure Words, Call Signs & Calling", "objectives": ["Use the standard **procedure words** from RIC-21 Appendix B, and no slang", "Say a private aircraft's **call sign** and know when it may be shortened", "Name ground stations by what they do: **Tower, Ground, Centre, Radio…**", "Make an **initial call**, reply with GO AHEAD or STAND BY, and end with OVER or OUT"], "sections": [["Procedure words", [["No slang", ["Never use **OK, REPEAT, TEN-FOUR, OVER AND OUT, BREAKER BREAKER** or **COME IN PLEASE**.", "Use the standard words in RIC-21 **Appendix B**."]], ["Yes, no, got it", ["**AFFIRM** = yes. **NEGATIVE** = no, or that is not correct.", "**ROGER** = I have received all of your last transmission.", "**WILCO** = your instructions are received, understood and **will be complied with**."]], ["Say it again", ["**SAY AGAIN** = please repeat your last transmission. (Never \"repeat\".)", "**I SAY AGAIN** = I am repeating for clarity or emphasis.", "**READ BACK** = repeat this message back to me exactly as received.", "**CONFIRM** = have I got this right? / did you get it?"]], ["Running the conversation", ["**GO AHEAD** = send your message. **STANDBY** = wait, I will call you.", "**BREAK** separates parts of a message. **CORRECTION** = I made a mistake; here is the right version. **DISREGARD** = ignore that transmission.", "**MONITOR** = listen on a frequency. **WORDS TWICE** = conditions are bad, say each word twice."]], ["OVER or OUT?", ["**OVER** = my transmission is ended and **I expect a reply**.", "**OUT** = conversation ended, **no reply expected**.", "\"Over and out\" is on RIC-21's slang list. Pick one."]]]], ["Call signs", [["Your call sign", ["Assigned by **Transport Canada** with the aircraft's registration and markings.", "Always say call signs **phonetically**.", "Use it when you **make first contact** and again when you **finish**."]], ["Private aircraft", ["Say the **maker or type**, then the **last four letters** of the registration.", "A Cessna 182, C-GFAC → **\"Cessna one eight two Golf Foxtrot Alfa Charlie\"**."]], ["Airlines", ["Company name + **flight number**: \"Air Canada one four nine\"."]], ["Shortening it", ["On first contact, always use your **full** call sign.", "If ATS shortens it, you may then use the short form: the **last three letters**. Cessna Golf Sierra Alfa Foxtrot → **Sierra Alfa Foxtrot**.", "RIC-21's older example shortens to two letters (Bravo Charlie). Today, use NAV CANADA's three."]], ["Ground stations", ["Place name + **what the station does**:", "**Tower** · **Ground** · **Centre** · **Radio** (e.g. Watson Lake Radio) · **Information** · **Delivery** · **Arrival** · **Departure**.", "At an aerodrome with no station, you talk to the other pilots: **\"Eagle Butte Traffic\"**."]]]], ["Making a call", [["Listen first", ["Listen long enough to be sure you won't interrupt. If someone is talking, **wait for a break**.", "Usually the **aircraft calls first**."]], ["The initial call", ["1 **Station called** (once if radio conditions are good, never more than 3 times)", "2 **THIS IS**", "3 **Your call sign** (once if good, never more than 3 times)", "4 **Frequency** you are on", "5 **OVER**"], "call"], ["The reply", ["Answer **as soon as possible**: \"**GO AHEAD**\" to send the message, or \"**STAND BY** two minutes\" to make them wait.", "Not sure the call was for you? **Don't answer** until it is repeated.", "Not sure who called? \"**Station calling** Cessna Foxtrot November Juliett India, say again, over.\""]], ["Later calls", ["After first contact you may **drop THIS IS and OVER**, and shorten call signs if there is no chance of confusion."]], ["Fixing mistakes", ["Say **CORRECTION**, the last correct word, then the right version: \"over Ottawa at two seven, **correction**, two eight\".", "Missed part of a message? \"**Say again all before** hangar\" · \"all after…\" · \"…to…\"."]], ["Ending", ["Finish with **OUT**: the conversation is over and no reply is expected."]]]]], "summary": "Use RIC-21's procedure words, not slang: AFFIRM, NEGATIVE, ROGER, WILCO, SAY AGAIN, READ BACK, GO AHEAD, STANDBY, CORRECTION, OVER and OUT. Say call signs phonetically; a private aircraft is the maker or type plus the last four letters of its registration. Use the full call sign first, and the short form only after ATS uses it. Ground stations are a place name plus a function word like Tower, Ground or Radio. An initial call is: station called, THIS IS, your call sign, frequency, OVER. Listen before you talk, and end with OUT.", "selfcheck": [["What does WILCO mean?", "Your instructions are received, understood and will be complied with."], ["What is the difference between ROGER and WILCO?", "ROGER = I received all of it. WILCO adds that you understand and will comply."], ["What do you say instead of \"repeat\"?", "SAY AGAIN."], ["What does OVER mean, and what does OUT mean?", "OVER: I'm done and expect a reply. OUT: conversation ended, no reply expected."], ["Say the call sign of a Cessna 182, registration C-GFAC.", "Cessna one eight two Golf Foxtrot Alfa Charlie."], ["When may you use a shortened call sign?", "After ATS has used the shortened form with you."], ["List the five parts of an initial call, in order.", "Station called, THIS IS, your call sign, frequency, OVER."], ["You hear a call but aren't sure it was for you. What do you do?", "Don't answer until the call is repeated and understood."]], "practice": [["RIC-21", "§5.5 Procedural words · §5.6 Call signs · §5.7 Calling procedure · Appendix B"], ["NAV CANADA", "VFR Phraseology: call signs"]], "reading": ["RIC-21 §5.5–5.7 and Appendix B", "NAV CANADA VFR Phraseology guide (call signs)"]}, {"code": "R2.3", "title": "Radio Checks, Circuit Calls & Readbacks", "objectives": ["Do a **radio check** and rate a signal on the **1–5 readability scale**", "Explain **MF** and **ATF** areas and where to find each one's frequency", "Make the required calls when **departing and arriving** at an uncontrolled aerodrome", "Know what you **must read back** to ATS (ATC or flight service) under the new CARs rule (19 Nov 2026)"], "sections": [["Radio check", [["How to ask", ["Use a frequency where you **won't interfere** with others.", "\"Watson Lake Radio, this is Cessna Foxtrot Alfa Bravo Charlie, **radio check** one two six decimal seven, **how do you read**, over.\"", "Keep it **under 10 seconds**, and say **your call sign**.", "TC AIM: where possible, use a frequency **other than an ATC frequency**. Usually, just making two-way contact proves your radio works."]], ["The readability scale", ["**1** Bad (unreadable) · **2** Poor (readable now and then) · **3** Fair (readable but with difficulty) · **4** Good (readable) · **5** Excellent (perfectly readable)"], "rs"], ["The answer", ["RIC-21: \"Cessna Foxtrot Alfa Bravo Charlie, this is Watson Lake Radio, **reading you strength five**, over.\"", "NAV CANADA's short form: \"…**read you three**, background static.\""]]]], ["Uncontrolled aerodromes", [["No tower? Talk to each other", ["Where there is no control tower, pilots use **one frequency** to say where they are and what they will do."]], ["MF area", ["**MF = mandatory frequency.** You **must** have a radio (a few no-radio exceptions exist) and **listen** on the MF (CARs 602.97).", "Reports go to the **ground station** if it is open; otherwise you **broadcast** them (602.98)."]], ["ATF area", ["**ATF = aerodrome traffic frequency.** Make the **same calls** as in an MF area.", "Where there is no UNICOM, the ATF is usually **123.2 MHz** (TC AIM RAC 4.5.5).", "Flying VFR en route in uncontrolled airspace? Monitor **126.7 MHz** when you are not on an MF or ATF."]], ["Where to find it", ["Each MF and ATF has its own **frequency, distance and altitude**, listed in the **Canada Flight Supplement (CFS)**.", "TC AIM example: \"ATF – tfc 123.2 5 NM 5500 ASL\" (use 123.2 within 5 NM, up to 5,500 ft above sea level)."]], ["The circuit", ["Turns are to the **left** unless the CFS says right turns (CARs 602.96).", "Legs: **upwind → crosswind → downwind → base → final**.", "Recommended circuit height for propeller aeroplanes: **1,000 ft** above the aerodrome, unless the CFS says otherwise.", "**Look out** and fit in with the traffic already flying the pattern."], "circuit"]]], ["The required calls", [["Departing", ["**Before taxiing onto the manoeuvring area** (taxiways and runways): report your intentions.", "**Before moving onto the runway**: report how you will depart.", "Before takeoff: **look and listen**. Make sure no one is landing or on the runway.", "**After takeoff**: report leaving the circuit, and keep listening until well clear."]], ["Arriving", ["**At least 5 minutes before** entering the area: position, altitude, landing time, intentions.", "**Joining the circuit**: give your position in it.", "**Downwind** (if you fly one) → **final** → **clear of the runway**."]], ["What a call sounds like", ["**Who you're calling → who you are → where you are → what you'll do.**", "\"Eagle Butte Traffic, Sierra Alfa Foxtrot, left downwind runway two seven.\"", "Never say \"any traffic in the area, please advise\". It is not standard phraseology (TC AIM RAC 4.5.2)."]]]], ["Readbacks", [["Read back or acknowledge?", ["**Acknowledge** = let ATS know you got it.", "**Read back** = say the key parts back so ATS can **catch mistakes**."]], ["Must read back (CARs, from 19 Nov 2026)", ["Any instruction to **hold short** of a runway.", "The **runway in use** or **assigned runway**.", "The **altimeter setting**.", "The **transponder code** (squawk).", "Runway, altimeter and squawk: not needed if you got them from **ATIS**. Hold short: **always** read back."]], ["Recommended readbacks", ["Instructions to **enter, cross, backtrack or line up** on a runway: read them back as good practice (TC AIM RAC 4.2.5). TC **strongly recommends** it for crossings.", "Other runway clearances (enter, land, take off, backtrack), **heading, altitude and speed** instructions and **route clearances**: NAV CANADA lists these as items that **may** be read back. Good practice."]], ["How to read back", ["The key words, then **your call sign at the end**: \"Hold short runway two six, India Zulu Victor.\"", "\"Runway two seven, altimeter two niner niner one, Mike Echo Charlie.\""]]]]], "summary": "For a radio check, call on a frequency that won't interfere, give your call sign, ask \"how do you read?\" and keep it under 10 seconds. Readability runs from 1 (bad, unreadable) to 5 (excellent, perfectly readable). At an aerodrome with no tower, use the MF or ATF listed in the CFS. Circuits are left-hand unless the CFS says otherwise. Departing: report before taxiing onto the manoeuvring area, before entering the runway, and when leaving the circuit. Arriving: report at least 5 minutes before entering the area, joining the circuit, downwind, final and clear of the runway. From 19 Nov 2026 you must read back hold-short instructions, the runway, the altimeter setting and the transponder code, with your call sign at the end.", "selfcheck": [["What is readability 3?", "Fair: readable but with difficulty."], ["How long should a radio check last?", "No more than 10 seconds."], ["What does MF stand for, and what must you do in an MF area?", "Mandatory frequency. Have a radio, listen on the MF and make the required reports."], ["Where do you find an aerodrome's MF or ATF frequency, distance and altitude?", "In the Canada Flight Supplement (CFS)."], ["Which way are circuit turns, unless the CFS says otherwise?", "Left."], ["How early must you report before entering an MF area?", "At least 5 minutes before, when circumstances permit."], ["List the four things you must read back from 19 Nov 2026.", "Hold-short instructions, the runway in use or assigned runway, the altimeter setting, the transponder code."], ["Where does your call sign go in a readback?", "At the end."]], "practice": [["RIC-21", "§5.7.5 Radio check and readability scale"], ["CARs", "602.96–602.103 (MF), 602.31 (readbacks)"], ["TP 11919 (PSTAR)", "Section 3 Communications"]], "reading": ["TC AC 602-008 Pilot Readback Requirements", "TC AIM RAC 4.5 (uncontrolled aerodromes)", "NAV CANADA VFR Phraseology guide"]}];
const KEY = 'safapp-cornell-roca2';
let store = {}; try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const $ = id => document.getElementById(id);
const md = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let cur = store.last && LESSONS.some(l => l.code === store.last) ? store.last : LESSONS[0].code;
let studying = false;

function tabs() {
  $('tabs').innerHTML = '';
  LESSONS.forEach(L => {
    const b = document.createElement('button'); b.className = 'tab';
    b.setAttribute('aria-pressed', L.code === cur); b.textContent = L.code + ' ' + L.title;
    b.onclick = () => { cur = L.code; store.last = cur; save(); tabs(); render(); document.getElementById('scroller').scrollTo(0, 0); };
    $('tabs').appendChild(b);
  });
}
function render() {
  const L = LESSONS.find(l => l.code === cur);
  let h = `<div style="display:flex;flex-direction:column;gap:18px">
  <div class="title"><span class="code">${L.code}</span><span class="name">${esc(L.title)}</span><span class="kind">CORNELL NOTES</span></div>
  <div class="panel goldleft"><h3>By the end of this lesson you can</h3><ul class="b">${L.objectives.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>
  <div class="toolbar">
    <label class="switch" for="study"><input type="checkbox" id="study" ${studying ? 'checked' : ''}> Study mode: hide the notes</label>
    <span class="hint" id="hint">${studying ? 'Answer each cue in your head, then tap the notes to check.' : 'Turn on study mode to quiz yourself with the cues.'}</span>
  </div>
  <div class="cornell ${studying ? 'studying' : ''}" id="cornell">
    <div class="colhead"><div>CUES / QUESTIONS</div><div>NOTES</div></div>`;
  L.sections.forEach(([head, rows]) => {
    h += `<div class="sec">${esc(head)}</div>`;
    rows.forEach(([cue, notes, fig]) => {
      h += `<div class="row"><div class="cue">${md(cue)}</div><div class="note"><div class="content"><ul class="b">${notes.map(n => `<li>${md(n)}</li>`).join('')}</ul>${fig && FIGS[fig] ? `<figure class="fig">${FIGS[fig].svg}<figcaption>${md(FIGS[fig].cap)}</figcaption></figure>` : ''}</div><button class="reveal" aria-label="Show notes"><span>Tap to check</span></button></div></div>`;
    });
  });
  h += `</div>
  <div class="summary"><h3>Summary</h3>
    <label for="mine" style="font-weight:600">In my own words</label>
    <textarea id="mine" placeholder="Write the big ideas of this lesson in 3–4 sentences without looking at the notes.">${esc((store.mine || {})[L.code] || '')}</textarea>
    <span class="saved" id="saved" hidden>Saved on this device</span>
    <div class="model"><button class="cmp" id="cmp" type="button">Compare with the model summary</button><span class="hint" id="cmpHint">Write at least 30 characters first.</span><p style="margin:0" id="model" hidden>${md(L.summary)}</p></div></div>
  <div class="panel"><h3>Self-check</h3><div class="qa">${L.selfcheck.map(([q, a], i) => `<div class="q"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span><span class="a" hidden>${esc(a)}</span><button data-i="${i}">Show answer</button></div>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Exam practice</h3><span class="hint">Official guide: <a href="${GUIDE.url}" target="_blank" rel="noopener">${esc(GUIDE.name)}</a></span><ul class="b">${L.practice.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>Required reading — next class</h3><ul class="b">${L.reading.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  </div></div>`;
  $('lesson').innerHTML = h;
  $('study').onchange = e => { studying = e.target.checked; render(); };
  document.querySelectorAll('.note').forEach(n => n.addEventListener('click', () => { if (studying) n.classList.add('shown'); }));
  document.querySelectorAll('.q button').forEach(b => b.onclick = () => { const a = b.previousElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer'; });
  let t; $('mine').oninput = e => { clearTimeout(t); t = setTimeout(() => { store.mine = store.mine || {}; store.mine[L.code] = e.target.value; save(); $('saved').hidden = false; }, 500); };
  const gate = () => { const ok = $('mine').value.trim().length >= 30; $('cmp').disabled = !ok; $('cmpHint').hidden = ok; };
  $('mine').addEventListener('input', gate); gate();
  $('cmp').onclick = () => { if ($('cmp').disabled) return; $('model').hidden = false; $('cmp').hidden = true; };
}
tabs(); render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "roca2-notes", "unit": 7, "kind": "notes"};
  const run = window.google && google.script && google.script.run;
  const sent = {};
  let who = ''; try { who = localStorage.getItem('safa-who') || ''; } catch (e) {}
  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();
  function askName() {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };
    document.body.appendChild(b);
  }
  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
  if (typeof render === 'function') { const _r = render; render = function () { _r.apply(this, arguments); try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }; try { T('notes', {l: cur, a: 'view'}, 6e5); } catch (e) {} }
  document.addEventListener('change', e => { if (e.target && e.target.id === 'study' && e.target.checked) T('notes', {l: cur, a: 'study'}, 6e5); });
  let st_; document.addEventListener('input', e => { if (e.target && e.target.id === 'mine' && e.target.value.trim().length >= 30) { clearTimeout(st_); st_ = setTimeout(() => T('notes', {l: cur, a: 'summary'}, 6e5), 1500); } });
})();
</script>
