<title>SAFA Ground School – Glossary</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#000; --panel:#121110; --panel2:#1b1915; --line:#2e2a23; --fg:#fff; --muted:#a8a39a;
  --gold:#d8b358; --gold-ink:#000;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:22px}
/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:30px 0 4px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,50px);line-height:1.05;margin:6px 0 10px;letter-spacing:-.01em}
h1 span{color:var(--gold)}
.lede{margin:0;color:#d8d4cc;font-size:17px;max-width:38em}
.top img{width:120px}
/* sticky search */
/* bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;font:600 18px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 48px;outline:none}
.search input::placeholder{color:#7d786f;font-weight:400}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,179,88,.2)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;border:0;background:var(--panel2);color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.clear:hover{color:var(--gold)}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:-10px}
.row,.az{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row::-webkit-scrollbar,.az::-webkit-scrollbar{display:none}
.chip{font-family:var(--display);font-weight:600;font-size:12.5px;background:var(--panel);color:#e4e0d8;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13px;color:#e4e0d8;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer}
.toggle i{width:30px;height:18px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle[aria-pressed="true"]{border-color:var(--gold)}
.toggle[aria-pressed="true"] i{background:rgba(216,179,88,.25)}
.toggle[aria-pressed="true"] i::after{transform:translateX(12px);background:var(--gold)}
/* letters */
.az button{flex:0 0 auto;font-family:var(--display);font-weight:700;font-size:13px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;padding:0}
.az button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.az button:disabled{opacity:.25;cursor:default}
/* list */
.group{display:flex;flex-direction:column;gap:10px;scroll-margin-top:var(--barh,200px)}
.group h2{font-family:var(--display);font-weight:800;font-size:28px;color:var(--gold);margin:6px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.term .name{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;color:var(--fg);overflow-wrap:anywhere}
.term.plain .name{font-size:19px}
.term .full{font-family:var(--display);font-weight:600;font-size:15px;color:var(--gold);line-height:1.3}
.term .note{margin:0;color:#d8d4cc;font-size:15px}
.term .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tag{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;text-decoration:none}
a.tag:hover{color:var(--gold);border-color:var(--gold)}
mark{background:rgba(216,179,88,.32);color:inherit;border-radius:3px;padding:0 1px}
.best{border-color:var(--gold)}
/* test mode */
.test .term .hide{filter:blur(7px);user-select:none;transition:filter .15s}
.test .term{cursor:pointer}
.test .term.show .hide{filter:none;user-select:auto}
.test .term .peek{display:block;font-size:12.5px;color:var(--muted);font-family:var(--display);font-weight:600}
.term .peek{display:none}
.test .term.show .peek{display:none}
.az button.on{border-color:var(--gold);color:var(--gold)}
.group h2 .cont{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 0 0}
.pager .nums{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.pg{font-family:var(--display);font-weight:700;font-size:14px;min-width:38px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.pg:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pg:disabled{opacity:.3;cursor:default}
.pg.cur{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.pg.wide{padding:0 14px}
.pager .gap{color:var(--muted);padding:0 2px}
.pnote{display:none;color:var(--muted);font-size:14px;font-family:var(--display);font-weight:600}
@media (max-width:480px){.pager .nums{display:none}.pnote{display:inline}.pager{justify-content:space-between}}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:#d8d4cc}
.empty b{color:var(--gold)}
footer{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px;text-align:center}
footer img{width:64px}
.tagline{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.32em;color:var(--gold)}
footer p{margin:0;color:var(--muted);font-size:13px}
button:focus-visible,a:focus-visible,.term:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:760px){.row,.az{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr}.top img{display:none}}
@media (max-width:480px){.az button{width:27px;height:27px;font-size:12px}.search input{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html,body{height:100%;overflow:hidden}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-color:#d8b358 #1b1915;scrollbar-width:thin}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-track{background:#1b1915}
#scroller::-webkit-scrollbar-thumb{background:#d8b358;border-radius:10px;border:2px solid #1b1915}

<script>
const G = [["ROC-A", "Restricted Operator Certificate with Aeronautical Qualification", "Lets you operate the radio in an aircraft or at an aeronautical ground station. You earn it by passing an exam with an ISED-accredited examiner; valid for life.", "Licences & Rules", 6], ["ISED", "Innovation, Science and Economic Development Canada", "The federal department in charge of radio. It issues station licences, accredits ROC-A examiners and replaces a lost ROC-A.", "Licences & Rules", 6], ["RIC-21", "Radiocommunication Information Circular 21", "ISED's free study guide for the ROC-A exam.", "Licences & Rules", 6], ["Station licence", "", "A licence for the radio station itself, not the person. It sets the call sign and frequencies. Some aeronautical stations are exempt.", "Licences & Rules", 6], ["Privacy of communications", "", "Don't share the contents, or even the existence, of a radio message unless the person it was sent to allows it. Distress, urgency, safety and ALL STATIONS messages are the exceptions.", "Licences & Rules", 6], ["Message priority", "", "The order radio messages go in: distress, urgency, direction-finding, flight safety, weather, flight regularity, UN Charter, government (priority asked), service, then all other.", "Radio", 6], ["Aircraft station", "", "A mobile radio station on board an aircraft.", "Radio", 6], ["Aeronautical station", "", "A land (ground) radio station in the aeronautical mobile service.", "Radio", 6], ["121.5 MHz", "Aeronautical emergency frequency", "The emergency frequency. Use it if you can't get help on the frequency in use, and monitor it when you can over sparsely settled areas.", "Emergencies", 6], ["Short", "", "An electrical fault: bare wires touching each other or the metal case.", "Radio", 6], ["Open", "", "An electrical fault: a wire broken inside its insulation.", "Radio", 6], ["FSS", "Flight service station", "An air traffic services unit that gives selected flight services.", "Airspace & ATC", 6], ["Controlled aerodrome", "", "An aerodrome where an air traffic control unit is operating.", "Aerodromes", 6], ["Aerodrome", "", "Any land, water (even frozen) or structure used by aircraft to arrive, depart, move or be serviced.", "Aerodromes", 6], ["General aviation", "", "Civil flying other than commercial air transport (scheduled or charter flights for hire).", "Licences & Rules", 6], ["Phonetic alphabet", "", "A word for each letter (Alfa, Bravo, Charlie…) so letters that sound alike are not confused. Note the spellings Alfa and Juliett.", "Radio", 7], ["UTC", "Coordinated Universal Time", "The time used in aviation, also called Zulu (Z). Alberta Time is UTC−6 all year from 1 Nov 2026: add 6 hours.", "Radio", 7], ["AFFIRM", "", "Yes.", "Radio", 7], ["NEGATIVE", "", "No, or that is not correct, or I do not agree.", "Radio", 7], ["ROGER", "", "I have received all of your last transmission.", "Radio", 7], ["WILCO", "Will comply", "Instructions received, understood and will be complied with.", "Radio", 7], ["SAY AGAIN", "", "Please repeat your last transmission. Never say \"repeat\" on the radio.", "Radio", 7], ["READ BACK", "", "Repeat this message back to me exactly as received.", "Radio", 7], ["STANDBY", "", "Wait. I must pause; I will call you.", "Radio", 7], ["CORRECTION", "", "I made an error; the correct version is…", "Radio", 7], ["DISREGARD", "", "Consider this transmission as not sent.", "Radio", 7], ["OVER", "", "My transmission is ended and I expect a reply.", "Radio", 7], ["OUT", "", "Conversation ended, no reply expected.", "Radio", 7], ["WORDS TWICE", "", "Communication is difficult: say each word twice.", "Radio", 7], ["Call sign", "", "Your radio name. A private Canadian aircraft uses its maker or type plus the last four letters of its registration, e.g. \"Cessna Golf Sierra Alfa Foxtrot\".", "Radio", 7], ["Readability scale", "", "1 Bad (unreadable), 2 Poor (now and then), 3 Fair (with difficulty), 4 Good (readable), 5 Excellent (perfectly readable).", "Radio", 7], ["Radio check", "", "A short radio test, 10 seconds at most: your call sign, \"radio check\", the frequency, \"how do you read?\"", "Radio", 7], ["MF", "Mandatory frequency", "The frequency you must use within a set distance and altitude of selected uncontrolled aerodromes. You need a working radio (a few exceptions exist), must listen on it and make the required reports.", "Aerodromes", 7], ["ATF", "Aerodrome traffic frequency", "The frequency for traffic at an uncontrolled aerodrome that has no MF. Normally the UNICOM frequency, or 123.2 MHz where there is no UNICOM.", "Aerodromes", 7], ["CFS", "Canada Flight Supplement", "The publication that lists aerodromes and their details, including MF/ATF frequencies and areas, and circuit direction.", "Aerodromes", 7], ["Circuit", "", "The pattern flown around an aerodrome: upwind, crosswind, downwind, base, final. Left turns unless the CFS says right. Aeroplanes normally fly it at 1,000 ft above aerodrome elevation, unless the CFS says otherwise.", "Aerodromes", 7], ["Readback", "", "Saying the key parts of an ATS message back, call sign at the end. From 19 Nov 2026 you must read back hold-short instructions, the runway, the altimeter setting and the transponder code (the last three not if they came from ATIS).", "Airspace & ATC", 7], ["ATS", "Air traffic services", "The umbrella name for air traffic control (ATC) and flight service (flight service stations and flight information centres).", "Airspace & ATC", 7], ["MAYDAY", "", "The distress signal, said 3 times: grave and/or imminent danger, needing immediate assistance. It has priority over all other transmissions.", "Emergencies", 8], ["PAN PAN", "", "The urgency signal, said 3 times: a safety concern for an aircraft, vehicle or someone on board or in sight, with no immediate assistance needed.", "Emergencies", 8], ["MAYDAY RELAY", "", "Said 3 times when you pass on another station's MAYDAY: they can't transmit, more help is needed, or nobody has acknowledged it.", "Emergencies", 8], ["RECEIVED MAYDAY", "", "How an acknowledgment of a MAYDAY ends.", "Emergencies", 8], ["SEELONCE MAYDAY", "", "Orders radio silence during distress traffic. Used by the station in distress or the station in control.", "Emergencies", 8], ["SEELONCE DISTRESS", "", "Orders radio silence during distress traffic. Used by another nearby station, only if essential.", "Emergencies", 8], ["SEELONCE FEENEE", "", "The distress is over; normal radio working may resume.", "Emergencies", 8], ["Right of way", "", "Converging at about the same altitude, the aircraft that has the other on its right gives way. Power-driven heavier-than-air aircraft (aeroplanes, helicopters) give way to airships, gliders and balloons; balloons are top of the order.", "Flying Safely", 1], ["Head-on", "", "Two aircraft meeting head-on (or nearly) with a risk of collision: both pilots alter heading to the right.", "Flying Safely", 1], ["Overtaking", "", "The aircraft being overtaken has the right of way. The overtaking aircraft alters heading to the right and stays clear until it is entirely past.", "Flying Safely", 1], ["Wake turbulence", "", "Turbulence from wingtip vortices, a by-product of lift. Worst behind aircraft that are heavy, clean and slow. Avoid the area below and behind.", "Flying Safely", 1], ["Wingtip vortices", "", "Two counter-rotating spirals of air behind the wingtips. From a large aircraft they sink 400–500 ft/min and level off less than 1,000 ft below.", "Flying Safely", 1], ["Rotation point", "", "Where a departing aircraft lifts its nosewheel and starts making wake. Behind a departing heavy aircraft, lift off before its rotation point.", "Flying Safely", 1], ["ELT", "Emergency locator transmitter", "A beacon that transmits on 121.5, 243 or 406 MHz so searchers can find a downed aircraft; satellites detect 406 only. Listen on 121.5 after every flight to check yours is not transmitting.", "Emergencies", 1], ["Jet blast", "", "The fast exhaust behind a jet engine. Danger areas run from 200 ft behind an executive jet at idle to 1,600 ft behind a jumbo jet at take-off power.", "Flying Safely", 1], ["LAHSO", "Land and hold short operations", "Using intersecting runways at the same time: one aircraft accepts a clearance to land and stop before the hold line. The pilot-in-command may refuse it, and must if it isn't safe.", "Aerodromes", 1], ["Airport", "", "An aerodrome with an airport certificate in force.", "Aerodromes", 2], ["Manoeuvring area", "", "The runways and taxiways used for take-off, landing and moving to and from them. Not the apron.", "Aerodromes", 2], ["Apron", "", "Where aircraft are loaded, refuelled, serviced and parked (the ramp).", "Aerodromes", 2], ["Movement area", "", "The manoeuvring area plus the aprons.", "Aerodromes", 2], ["Windsock", "", "Shows wind direction and strength. A standard dry windsock standing straight out means a wind of 15 kt or more.", "Aerodromes", 2], ["Runway number", "", "The runway's magnetic direction to the nearest 10°, last zero dropped: a runway pointing 087° is 09, and its other end is 27. In the far north, runways use true direction.", "Aerodromes", 2], ["Holding position", "", "Where you stop before entering a runway. With no marking or sign, hold at least 200 ft from the runway edge.", "Aerodromes", 2], ["Light signals", "", "Tower signals for when the radio is not working. In flight: steady green = cleared to land, steady red = give way and keep circling, red flashes = aerodrome unsafe, do not land. On the ground: steady red = stop.", "Aerodromes", 2], ["Certificate of registration", "", "Aircraft document that must be on board.", "Licences & Rules", 2], ["Flight authority", "", "The document that allows the aircraft to fly, such as a certificate of airworthiness. It must be on board.", "Licences & Rules", 2], ["Journey log", "", "The aircraft's log, carried on board unless you won't land and shut down anywhere other than where you started.", "Licences & Rules", 2], ["Inf ed airspace with a base of 700 ft AGL.", "Airspace & ATC", 4], ["Low-level airway", "", "Controlled airspace from 2,200 ft AGL up to, but not including, 18,000 ft ASL.", "Airspace & ATC", 4], ["ADIZ", "Air defence identification zone", "Flying into it needs a defence flight plan or itinerary, filed with ATC, an FSS or a CARS.", "Airspace & ATC", 4], ["Transponder airspace", "", "Class A, B and C airspace, plus Class D or E airspace marked as transponder airspace. You need a transponder with Mode C.", "Airspace & ATC", 4], ["VFR", "Visual flight rules", "Flying by looking outside. In controlled airspace you need 3 miles visibility and must stay 500 ft vertically and 1 mile horizontally from cloud.", "Airspace & ATC", 4], ["IFR", "Instrument flight rules", "Flying by reference to instruments. Class A airspace is IFR only.", "Airspace & ATC", 4], ["Special VFR", "", "VFR in a control zone below the normal minima, only when the pilot asks: aeroplane 1 mile visibility, clear of cloud, ground in sight. At night, an aeroplane gets it only to land at its destination.", "Airspace & ATC", 4], ["VFR cruising altitudes", "", "In level cruise above 3,000 ft AGL: track 000°–179°, odd thousands + 500 (3,500, 5,500…); track 180°–359°, even thousands + 500 (4,500, 6,500…).", "Flight Planning", 4], ["SDA", "Southern Domestic Airspace", "Cruising altitudes use magnetic track in the SDA and true track in the Northern Domestic Airspace (NDA).", "Airspace & ATC", 4], ["Day", "", "From the start of morning civil twilight to the end of evening civil twilight.", "Licences & Rules", 4], ["AGL", "Above ground level", "Height above the ground below you.", "Airspace & ATC", 4], ["ASL", "Above sea level", "Altitude measured from mean sea level.", "Airspace & ATC", 4], ["AAE", "Above aerodrome elevation", "Height above the aerodrome. Aeroplane circuits are normally flown at 1,000 ft AAE.", "Aerodromes", 4], ["ATC", "Air traffic control", "The air traffic service that issues clearances and instructions in controlled airspace.", "Airspace & ATC", 4], ["ATC clearance", "", "An authorization to proceed in controlled airspace under set conditions. It contains a form of the word \"clear\". Once you accept it, you must comply.", "Airspace & ATC", 4], ["ATC instruction", "", "A directive from ATC, such as \"turn left heading 270\". Comply and acknowledge unless it would endanger the aircraft.", "Airspace & ATC", 4], ["UNABLE", "", "What you tell ATC, right away, when you cannot comply with a clearance or instruction.", "Radio", 4], ["Minimum altitudes", "", "Over a built-up area, an aeroplane must be high enough to land safely if the engine fails, and at least 1,000 ft above the highest obstacle within 2,000 ft. Elsewhere, at least 500 ft from any person, vessel, vehicle or structure.", "Flying Safely", 4], ["Flight plan", "", "Filed with ATC, an FSS or a CARS. A VFR flight needs a plan or itinerary unless it stays within 25 NM of departure. Arrival report due 1 hour after your last ETA, unless you gave a SAR time.", "Flight Planning", 4], ["Flight itinerary", "", "Like a flight plan, but it can also be left with a responsible person. Arrival report due 24 hours after your last ETA, unless you gave a SAR time.", "Flight Planning", 4], ["Responsible person", "", "Someone who has agreed to tell ATC, an FSS, a CARS or a rescue coordination centre if you are overdue.", "Flight Planning", 4], ["SAR time", "Search and rescue time", "A time you set for search and rescue alerting to start if you haven't reported your arrival. Your arrival report is due by then.", "Flight Planning", 4], ["Arrival report", "", "Closes your flight plan or itinerary. You close it yourself, even at an airport with a tower.", "Flight Planning", 4], ["ETA", "Estimated time of arrival", "When you expect to arrive. Alerting deadlines count from your last reported ETA.", "Flight Planning", 4], ["CARS", "Community aerodrome radio station", "A ground radio station at some aerodromes. You can file flight plans and itineraries with it.", "Radio", 4], ["ATIS", "Automatic terminal information service", "A recorded broadcast of routine airport information, such as weather, altimeter setting and runways. Listen first, then say its code letter on your first call (\"with Bravo\").", "Airspace & ATC", 5], ["126.7 MHz", "", "VFR en route in uncontrolled airspace (when not on an MF or ATF): monitor it and, when you can, broadcast your position, altitude and intentions (encouraged, not mandatory). In an emergency with no ATS in range, call other pilots on it.", "Radio", 5], ["FIC", "Flight information centre", "Gives weather, NOTAMs and relayed ATC clearances in flight and takes position reports, but no traffic information. Call it \"(Place) Radio\".", "Airspace & ATC", 5], ["UNICOM", "Universal communications", "A private air-ground radio station at some uncontrolled aerodromes. Where there is one, the ATF is normally its frequency.", "Radio", 5], ["NOTAM", "", "A notice about a new or changed aeronautical facility, service, procedure or hazard that pilots need to know about in time.", "Flight Planning", 5], ["Have numbers", "", "You already have the runway, wind and altimeter setting from the last advisory.", "Radio", 5], ["Clock position (traffic)", "", "Traffic calls use a clock where 12 o'clock is your track over the ground, not where your nose points.", "Radio", 5], ["NORDO", "No radio", "An aircraft with no working radio. At an airport with a tower, join from the upwind side and watch for light signals.", "Radio", 5], ["Radio failure (VFR)", "", "In a control zone, land at its aerodrome; in other Class B, C or D airspace, leave by the shortest route. Squawk 7600 and tell ATC as soon as you can.", "Emergencies", 5], ["Transponder", "", "A radio that answers radar with a 4-digit code (and your altitude in Mode C). Unless ATS gives you a code, VFR uses 1200 at or below 12,500 ft ASL and 1400 above. Standby while taxiing, unless the CFS says otherwise.", "Radio", 5], ["Squawk 7500", "", "Transponder code for unlawful interference.", "Emergencies", 5], ["Squawk 7600", "", "Transponder code for radio (communication) failure.", "Emergencies", 5], ["Squawk 7700", "", "Transponder code for an emergency, when you can't reach ATC right away.", "Emergencies", 5], ["Mode C", "", "The transponder mode that sends your altitude. Keep it on in Canada unless ATS says otherwise.", "Radio", 5], ["IDENT", "", "The transponder's identification button (\"squawk ident\"). Press it only when ATS asks.", "Radio", 5]];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS = ["Radio", "Emergencies", "Licences & Rules", "Airspace & ATC", "Aerodromes", "Flying Safely", "Pilot Health", "Flight Planning"];
const UNITNAMES = {"6": "ROC-A Part 1 · Radio Rules & Equipment", "7": "ROC-A Part 2 · Speaking on the Radio", "8": "ROC-A Part 3 · Emergency Communications", "1": "PSTAR Part 1 · Rules of the Air", "2": "PSTAR Part 2 · Aerodromes, Signals & Equipment", "3": "PSTAR Part 3 · Pilot, Medical & Occurrences", "4": "PSTAR Part 4 · Airspace, ATC & Flight Planning", "5": "PSTAR Part 5 · Communications"};
const TAGS = {"6": "ROC-A 1", "7": "ROC-A 2", "8": "ROC-A 3", "1": "PSTAR 1", "2": "PSTAR 2", "3": "PSTAR 3", "4": "PSTAR 4", "5": "PSTAR 5"};

const items = G.map((g, i) => ({
  i, name: g[0], full: g[1], note: g[2], cat: g[3], unit: g[4],
  plain: !g[1],
  letter: /^[0-9]/.test(g[0]) ? '#' : g[0].replace(/^Squawk\s+/, 'S')[0].toUpperCase(),

let cat = 'all', test = false;
const shown = new Set();
const scroller = document.getElementById('scroller') || document.scrollingElement;

// category chips
$('cats').innerHTML = [['all', 'All', items.length], ...CATS.map(c => [c, c, items.filter(x => x.cat === c).length])]
  .map(([v, l, n]) => `<button type="button" class="chip" data-c="${esc(v)}" aria-pressed="${v === 'all'}">${esc(l)}<span class="n">${n}</span></button>`).join('');
$('cats').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cat = b.dataset.c; page = 0;
  $('cats').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});

const STOP = new Set(['of','the','and','a','an','to','in','for','on','or','is','at','by']);
const wordsOf = s => s.split(/[^a-z0-9]+/).filter(Boolean);
function score(x, q, nq, words) {
  // lower = better; null = no match
  if (nq && x.nName === nq) return 0;
  if (nq && x.nName.startsWith(nq)) return 1;
  if (!words.length) return null;
  const starts = (txt, w) => wordsOf(txt).some(f => f.startsWith(w));
  if (words.every(w => starts(x.lFull, w) || starts(x.lName, w))) return x.lFull.startsWith(words[0]) || x.lName.startsWith(words[0]) ? 2 : 3;
  if (nq.length >= 3 && x.nName.includes(nq)) return 4;
  if (q.length >= 3 && x.lFull.includes(q)) return 5;
  if (words.every(w => starts(x.lNote, w) || starts(x.lFull, w) || starts(x.lName, w))) return 6;
  return null;
}
function hl(text, words) {
  let s = esc(text);
  if (!words.length) return s;
  const re = new RegExp('\\b(' + words.map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a, b) => b.length - a.length).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}
function card(x, words, best) {
  const url = (LINKS[x.unit] || '').trim();
  const ok = /^https?:\/\//.test(url);
  const unit = ok ? `<a class="tag" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(UNITNAMES[x.unit])}">${TAGS[x.unit]}</a>`
                  : `<span class="tag" title="${esc(UNITNAMES[x.unit])}">${TAGS[x.unit]}</span>`;
  return `<article class="term${x.plain ? ' plain' : ''}${best ? ' best' : ''}${shown.has(x.i) ? ' show' : ''}" data-i="${x.i}" tabindex="${test ? 0 : -1}">
    <div class="name">${hl(x.name, words)}</div>
    ${x.full ? `<div class="full hide">${hl(x.full, words)}</div>` : ''}
    <p class="note hide">${hl(x.note, words)}</p>
    <span class="peek">Tap to reveal</span>
    <div class="meta"><span class="tag">${esc(x.cat)}</span>${unit}</div>
  </article>`;
}
const PER = 25;
let page = 0, jumpTo = null;
function render() {
  const raw = $('q').value.trim();
  const q = raw.toLowerCase(), nq = norm(raw);
  const words = wordsOf(q).filter(w => !STOP.has(w) && (w.length > 1 || /\d/.test(w)));
  const searching = !!nq;
  $('clear').hidden = !raw;
  const pool = items.filter(x => cat === 'all' || x.cat === cat);
  let list, ranks = null;
  if (searching) {
    const hits = pool.map(x => [x, score(x, q, nq, words)]).filter(h => h[1] !== null)
      .sort((a, b) => a[1] - b[1] || a[0].name.localeCompare(b[0].name, 'en', {sensitivity: 'base'}));
    list = hits.map(h => h[0]); ranks = hits.map(h => h[1]);
  } else list = pool;
  const n = list.length, pages = Math.max(1, Math.ceil(n / PER));
  page = Math.min(Math.max(0, page), pages - 1);
  const from = page * PER, slice = list.slice(from, from + PER);
  let html = '';
  if (searching) {
    if (n) html = `<section class="group"><div class="grid">${slice.map((x, k) => card(x, words, from + k === 0 && ranks[0] <= 1)).join('')}</div></section>`;
  } else {
    const by = [];
    slice.forEach(x => { const last = by[by.length - 1]; if (last && last[0] === x.letter) last[1].push(x); else by.push([x.letter, [x]]); });
    by.forEach(([L, xs], k) => {
      const cont = k === 0 && from > 0 && list[from - 1].letter === L;
      html += `<section class="group" id="L-${L === '#' ? 'num' : L}"><h2>${L}${cont ? ' <span class="cont">continued</span>' : ''}</h2><div class="grid">${xs.map(x => card(x, [], false)).join('')}</div></section>`;
    });
  }
  if (!n) html = `<div class="empty">No match for <b>“${esc(raw)}”</b>${cat !== 'all' ? ' in ' + esc(cat) + ' — <button type="button" class="chip" id="allcats">search all topics</button>' : '. Try fewer letters, or search the words it stands for.'}</div>`;
  if (pages > 1) html += pager(pages);
  $('list').innerHTML = html;
  const range = n > PER ? ` · showing ${from + 1}–${from + slice.length}` : '';
  $('count').textContent = (searching ? `${n} match${n === 1 ? '' : 'es'}` : `${n} entries${cat !== 'all' ? ' in ' + cat : ''}`) + range;
  // letters: enabled if the letter exists anywhere in the filtered list; current page's letters highlighted
  const have = new Set(list.map(x => x.letter)), here = new Set(slice.map(x => x.letter));
  const AZ = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  $('az').hidden = searching;
  $('az').innerHTML = AZ.map(L => `<button type="button" data-l="${L}" ${have.has(L) ? '' : 'disabled'} class="${here.has(L) ? 'on' : ''}" aria-label="Jump to ${L === '#' ? 'numbers' : L}">${L}</button>`).join('');
  const ac = $('allcats');
  if (ac) ac.addEventListener('click', () => $('cats').querySelector('[data-c="all"]').click());
  setBarH();
}
function pager(pages) {
  const btn = (p, label, aria, cls = '') => `<button type="button" class="pg ${cls}" data-p="${p}" ${p < 0 || p >= pages ? 'disabled' : ''} ${aria ? `aria-label="${aria}"` : ''}>${label}</button>`;
  const nums = [];
  for (let i = 0; i < pages; i++) {
    if (i === 0 || i === pages - 1 || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return `<nav class="pager" aria-label="Glossary pages">${btn(page - 1, '← Prev', 'Previous page', 'wide')}
    <span class="nums">${nums.map(i => i === '…' ? '<span class="gap">…</span>' : `<button type="button" class="pg${i === page ? ' cur' : ''}" data-p="${i}" ${i === page ? 'aria-current="page"' : ''}>${i + 1}</button>`).join('')}</span>
    <span class="pnote">Page ${page + 1} of ${pages}</span>
    ${btn(page + 1, 'Next →', 'Next page', 'wide')}</nav>`;
}
function toTop() {
  const top = $('list').getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - $('bar').offsetHeight - 12;
  scroller.scrollTo({top: Math.max(0, top)});
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('.pager button[data-p]'); if (!b || b.disabled) return;
  page = +b.dataset.p; render(); toTop();
});
function setBarH() { document.documentElement.style.setProperty('--barh', ($('bar').offsetHeight + 8) + 'px'); }
$('az').addEventListener('click', e => {
  const b = e.target.closest('button[data-l]'); if (!b || b.disabled) return;
  const pool = items.filter(x => cat === 'all' || x.cat === cat);
  const idx = pool.findIndex(x => x.letter === b.dataset.l); if (idx < 0) return;
  page = Math.floor(idx / PER); render();
  const el = [...document.querySelectorAll('.group')].find(g => g.id === 'L-' + (b.dataset.l === '#' ? 'num' : b.dataset.l));
  if (!el) return;
  const top = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - $('bar').offsetHeight - 6;
  scroller.scrollTo({top: Math.max(0, top)});
});
let t;
$('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { page = 0; render(); jumpToBar(); }, 80); });
function jumpToBar() {
  const top = $('bar').getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
  if (scroller.scrollTop > top) scroller.scrollTo({top});
}
$('clear').addEventListener('click', () => { $('q').value = ''; page = 0; render(); $('q').focus(); });
$('test').addEventListener('click', () => {
  test = !test; shown.clear();
  $('test').setAttribute('aria-pressed', test);
  document.body.classList.toggle('test', test);
  render();
});
$('list').addEventListener('click', e => {
  if (!test || e.target.closest('a')) return;
  const c = e.target.closest('.term'); if (!c) return;
  const i = +c.dataset.i;
  shown.has(i) ? shown.delete(i) : shown.add(i);
  c.classList.toggle('show');
});
$('list').addEventListener('keydown', e => {
  if (test && (e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('term')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; page = 0; render(); }
});
addEventListener('resize', setBarH);
$('lede').textContent = `${items.length} key terms and abbreviations from ROC-A and PSTAR. Search by the letters (ATIS) or the words (“wake”), and switch on test mode to quiz yourself.`;
render();
</script>
<script>
/* SAFA progress tracker: reports to the Apps Script when the page is served from it; does nothing otherwise */
(function () {
  const PAGE = {"id": "spp-glossary", "unit": 0, "kind": "glossary"};
  const run = window.google && google.script && google.script.run;
  const sent = {};
  let who = ''; try { who = localStorage.getItem('safa-who') || ''; } catch (e) {}
  function T(type, data, gap) {
    if (!run) return; const k = type + JSON.stringify(data), now = Date.now();
    if (sent[k] && now - sent[k] < (gap == null ? 3e4 : gap)) return; sent[k] = now;
    try { google.script.run.withFailureHandler(function () {}).track(PAGE.id, PAGE.unit, type, JSON.stringify(data), who); } catch (e) {}
  }
  window.SAFA_TRACK = T;
  if (run && window.SAFA_ME && !window.SAFA_ME.email && !who) askName();

    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1f1a10;border:1px solid #d9b25a;border-radius:14px;padding:12px 14px;color:#fff;font:15px Source Sans 3,Arial,sans-serif;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    b.innerHTML = '<b style="font-family:Poppins,Arial;color:#d9b25a">Save my progress:</b> <input placeholder="Your full name" style="flex:1;min-width:160px;font:15px Arial;padding:7px 10px;border-radius:8px;border:1px solid #5c4a22;background:#000;color:#fff"><button style="font:700 13px Poppins,Arial;padding:8px 14px;border-radius:8px;border:0;background:#d9b25a;color:#000;cursor:pointer">Save</button>';
    b.querySelector('button').onclick = () => { const v = b.querySelector('input').value.trim(); if (!v) return; who = v; try { localStorage.setItem('safa-who', v); } catch (e) {} b.remove(); T('visit', {}, 0); };

  if (PAGE.kind !== 'teacher') T('visit', {}, 6e5);
